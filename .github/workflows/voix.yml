name: Voix off
on:
  push:
    branches: [outil-voix]
    paths: [texte.json, voix.py, .github/workflows/voix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "kokoro>=0.9.4" "misaki[en]" soundfile numpy "piper-tts>=1.2" faster-whisper
      - run: python voix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add voix resultats_voix.json
          git commit -m "Voix off générée" || echo "Rien de nouveau"
          git push
