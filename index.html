"th":"numerique","t":"100 000 ingénieurs formés par an, contre 40 000","d":"Faire passer de 40 000 à 100 000 le nombre d'ingénieurs formés chaque année, et doubler en cinq ans les infrastructures informatiques françaises.","s":["maddyness_ia"],"aj":"2026-10-15","fin":"n","id":"p196","plus":{"detail":[["Faire passer de 40 000 à 100 000 le nombre d'ingénieurs formés chaque année, et doubler en cinq ans les infrastructures informatiques françaises.","maddyness_ia"]],"auj":[["En 2025, 85 % des 18-24 ans utilisent l'IA générative.","sujet_numerique_barometre_rapport"]],"maj":"2026-10-19"}},{"c":"philippe","th":"numerique","t":"Un « droit à la reconversion » face à l'IA","d":"Créer un « droit à la reconversion » pour les métiers menacés par l'intelligence artificielle.","s":["maddyness_ia"],"aj":"2026-10-15","fin":"n","id":"p197","plus":{"detail":[["Créer un « droit à la reconversion » pour les personnes dont le métier est menacé par l'intelligence artificielle.","maddyness_ia"]],"auj":[["Le règlement européen sur l'IA impose depuis février 2025 des obligations de formation aux organisations qui utilisent l'IA.","sujet_numerique_ec_ai_act"]],"maj":"2026-10-19"}},{"c":"retailleau","th":"numerique","t":"25 milliards d'euros sur cinq ans pour l'IA","d":"Un plan de 25 milliards d'euros sur cinq ans pour développer l'intelligence artificielle.","s":["maddyness_ia"],"aj":"2026-10-15","a":{"v":25,"nature":"cout","per":"total","h":"sur cinq ans"},"fin":"c","id":"p198"},{"c":"glucksmann","th":"numerique","t":"Une agence industrielle du numérique et de l'IA","d":"Créer une « agence industrielle du numérique et de l'IA ».","s":["maddyness_ia"],"aj":"2026-10-15","fin":"n","id":"p199","plus":{"detail":[["Il propose de créer une « agence industrielle du numérique et de l'IA ».","maddyness_ia"],["Son « nouveau contrat patriotique » vise « l'indépendance énergétique, technologique et industrielle ».","lcp_primaire_oppositions"]],"auj":[["Le règlement européen sur l'IA s'applique de façon générale depuis le 2 août 2026, avec des exceptions.","sujet_numerique_ec_ai_act"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"numerique","t":"Un traité international sur les usages les plus risqués de l'IA","d":"Créer un traité international encadrant les usages de l'intelligence artificielle à très haut risque.","s":["maddyness_ia"],"aj":"2026-10-15","fin":"s","id":"p200","plus":{"detail":[["Il propose un traité international encadrant les usages de l'intelligence artificielle à très haut risque.","maddyness_ia"]],"auj":[["Dans l'Union européenne, le règlement sur l'IA interdit déjà certaines pratiques depuis le 2 février 2025.","sujet_numerique_ec_ai_act"]],"maj":"2026-10-19"}},{"c":"tondelier","th":"numerique","t":"Étiqueter les contenus générés par l'IA","d":"Rendre obligatoire l'étiquetage des contenus générés par l'intelligence artificielle, et imposer la traçabilité des données utilisées pour entraîner les modèles.","s":["maddyness_ia"],"aj":"2026-10-15","fin":"s","id":"p201"},{"c":"retailleau","th":"pouvoir","t":"Supprimer les certificats d'économie d'énergie pour baisser le prix de l'essence","d":"Supprimer les certificats d'économie d'énergie (CEE), ce qui pourrait selon lui réduire les prix à la pompe de « 15 à 17 centimes par litre ».","s":["afp_pouvoir_achat"],"aj":"2026-10-15","fin":"s","id":"p202"},{"c":"retailleau","th":"travail","t":"Mieux payer ceux qui travaillent 30 minutes de plus par jour","d":"Mieux rémunérer ceux qui acceptent de travailler « 30 minutes de plus chaque jour ».","s":["afp_pouvoir_achat"],"aj":"2026-10-15","fin":"n","id":"p203"},{"c":"le-pen","th":"travail","t":"Des salaires augmentés de 10 %, sans cotisations patronales sur la hausse","d":"Inciter les entreprises à augmenter les salaires de 10 % en exonérant cette hausse de cotisations patronales.","s":["afp_pouvoir_achat"],"aj":"2026-10-15","fin":"n","id":"p204","plus":{"detail":[["Les entreprises qui augmenteraient les salaires de 10 % seraient exonérées de cotisations patronales sur cette hausse.","afp_pouvoir_achat"],["Nous n'avons pas trouvé de coût annoncé.",null]],"auj":[["En 2024, le salaire net médian dans le privé est de 2 190 € par mois en équivalent temps plein.","sujet_travail_insee_salaires2024"]],"maj":"2026-10-19"}},{"c":"melenchon","th":"etudes","t":"Supprimer Parcoursup","d":"Supprimer la plateforme Parcoursup, qu'il qualifie d'« école du vice ».","s":["orange_melenchon_jeunes"],"aj":"2026-10-15","fin":"s","id":"p205","plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Démanteler Parcoursup et garantir l'accès sans sélection à la formation de son choix » et « La fin de la sélection en master ».","lfi_synthese"]],"objectif":[["Pour son parti, « l'accès à l'université sera de nouveau démocratisé par l'abolition de ParcourSup ».","lfi_contrebudget_2025"]],"pourquoi":[["À Clermont-Ferrand, le 11 octobre 2026 : « Parcoursup doit être aboli » ; « Nous ne sommes pas pour la sélection à l'université ».","sudradio_clermont"],["Il qualifie la plateforme d'« école du vice ».","orange_melenchon_jeunes"],["Son parti la décrit comme une plateforme « qui trie les élèves et les laisse dans une incertitude angoissante ».","lfi_contrebudget_2025"]],"auj":[["Au 11 juillet 2026, 576 749 lycéens sur 660 399 candidats lycéens avaient reçu au moins une proposition d'admission sur Parcoursup, soit environ 87 % (calcul de l'appli).","sujet_etudes_parcoursup_tdb"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"institutions","t":"Le droit de vote à 16 ans","d":"Abaisser l'âge du droit de vote à 16 ans, contre 18 actuellement.","s":["orange_melenchon_jeunes"],"aj":"2026-10-15","fin":"s","id":"p206","plus":{"detail":[["Abaisser l'âge du droit de vote de 18 à 16 ans. Il l'a redit à Clermont-Ferrand le 11 octobre 2026.","ps_vote16"],["La mesure ajouterait « environ 1,5 million d'électeurs potentiels », selon Public Sénat.","ps_vote16"]],"objectif":[["Donner « aux lycéens davantage de poids politique », selon Public Sénat, et favoriser le « respect » de la jeunesse, selon l'AFP.","ps_vote16","sudradio_clermont"]],"pourquoi":[["« À 16 ans, on peut être émancipé et assurer son devoir de parent, on vote aux élections prud'homales, on va en prison. » « Alors à 16 ans on doit pouvoir donner son avis, non pas secondairement, mais comme tous les autres, comme citoyen. »","ps_vote16"]],"auj":[["Le droit de vote est fixé à 18 ans depuis 1974 : il a alors été abaissé de 21 à 18 ans.","ps_vote16"],["Au premier tour de la présidentielle de 2022, 67,2 % des inscrits de 18 à 29 ans ont voté, contre 77,0 % des 65 ans ou plus.","sujet_institutions_insee_ip1929"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"education","t":"Le bac pro de nouveau en quatre ans","d":"Rétablir la règle des quatre ans pour passer un bac professionnel, et créer une filière qui part du CAP jusqu'à la licence professionnelle.","s":["orange_melenchon_jeunes"],"aj":"2026-10-15","fin":"c","id":"p207","plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Rétablir le baccalauréat professionnel en quatre ans et abroger les contre-réformes du lycée professionnel ».","lfi_synthese"],["Il propose aussi de « créer une filière qui part du CAP jusqu'à la licence professionnelle ».","orange_melenchon_jeunes"]],"objectif":[["« Qualifier tout le monde » : c'est le titre de la partie du programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["Pour son parti, les réformes successives du lycée professionnel « ont à la fois diminué les heures d'enseignement » et « sabordé les fondements de la qualification » ; la voie professionnelle serait « abandonnée au profit du “tout apprentissage” réclamé par le MEDEF ».","lfi_contrebudget_2025"],["Quatre ans de formation permettraient de « replacer les disciplines et les enseignements techniques et spécifiques au cœur de cette voie tout en renforçant les enseignements généraux ».","lfi_contrebudget_2025"]],"auj":[["Le bac professionnel se prépare aujourd'hui « sur une période de trois ans après la classe de troisième ».","edu_bacpro"]],"fin_cand":[["Dans son contre-budget 2025 (novembre 2024), La France insoumise chiffre le retour au bac pro en quatre ans et l'abrogation de la réforme de la voie professionnelle à 650 millions d'euros.","lfi_contrebudget_2025"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"becht","th":"etudes","t":"Supprimer et remplacer Parcoursup","d":"« Parcoursup est une boîte noire qui doit être supprimée et remplacée. »","s":["sudradio_becht"],"aj":"2026-10-15","fin":"n","id":"p208","plus":{"detail":[["« Parcoursup est une boîte noire qui doit être supprimée et remplacée. »","sudradio_becht"],["Il évoque à la place « une épreuve de spécialité permettant de déterminer l'orientation des élèves ».","sudradio_becht"],["Nous n'avons pas trouvé par quoi exactement il remplacerait la plateforme.",null]],"pourquoi":[["Il juge le mouvement lycéen contre Parcoursup « légitime sur le fond ».","sudradio_becht"]],"auj":[["Au 11 juillet 2026, 576 749 lycéens avaient reçu au moins une proposition d'admission sur Parcoursup, sur 660 399 candidats lycéens.","sujet_etudes_parcoursup_tdb"]],"maj":"2026-10-19"}},{"c":"becht","th":"travail","t":"Un contrat de travail unique, avec un salaire socle entre deux emplois","d":"Un contrat de travail unique qui suit la personne toute sa vie, transférable d'un employeur à l'autre, avec un revenu jamais inférieur au salaire minimum. En échange, il faudrait accepter un emploi correspondant à ses qualifications, se former ou, sans travail, faire 25 heures de bénévolat.","s":["sudradio_becht","becht_sociale"],"aj":"2026-10-15","fin":"n","id":"p209","plus":{"detail":[["« Ce contrat serait portable d'une entreprise à l'autre » et resterait attaché à la personne entre deux emplois, avec un salaire socle, « une forme de revenu universel ».","sudradio_becht"],["Son site parle d'un contrat « qui nous suit toute notre vie, transférable d'un établissement à un autre », « qui nous garantit un revenu permanent jamais en deçà du salaire minimum ».","becht_sociale"],["Pour toucher ce revenu, il faudrait accepter un emploi correspondant à ses qualifications, suivre une formation ou, sans travail, « effectuer 25 heures de bénévolat au service de la société ».","sudradio_becht"],["Le contrat permettrait aussi de prendre « une année sabbatique ».","becht_sociale"]],"objectif":[["Un contrat « fondé sur les notions d'engagement et de réciprocité ».","becht_sociale"]],"pourquoi":[["À la création de la Sécurité sociale, « cinq personnes cotisaient pour une personne bénéficiant de prestations » ; « elles ne sont plus que 1,4 », selon lui.","sudradio_becht"],["Il veut aussi protéger les travailleurs face à l'intelligence artificielle.","sudradio_becht"]],"auj":[["Le Smic net mensuel pour un temps plein est de 1 477,93 € depuis le 1er juin 2026.","sujet_travail_sp_smic_juin"],["Le taux de chômage est de 8,3 % au 2e trimestre 2026.","sujet_travail_insee_chomage"]],"fin_cand":[["Nous n'avons pas trouvé de coût annoncé pour ce revenu garanti.",null]],"note":["Le site de campagne ne date pas ses pages : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"c":"becht","th":"education","t":"Décentraliser la gestion des enseignants","d":"Décentraliser la gestion des enseignants et donner plus d'autonomie aux établissements, pour que leurs directeurs puissent composer leurs équipes pédagogiques.","s":["sudradio_becht"],"aj":"2026-10-15","fin":"s","id":"p210","plus":{"detail":[["Il veut gérer les enseignants au niveau local et donner plus d'autonomie aux établissements, pour que leurs directeurs composent leurs équipes.","sudradio_becht"],["Il refuse une régionalisation de l'Éducation nationale : « Les programmes doivent rester les mêmes sur l'ensemble du territoire ».","sudradio_becht"]],"objectif":[["« Qu'il y ait un enseignant devant chaque classe ».","sudradio_becht"]],"pourquoi":[["Il affirme que « 3 000 enseignants sont sans affectation ».","sudradio_becht"]],"auj":[["Aujourd'hui, l'État recrute et gère les enseignants et répartit les moyens consacrés à l'éducation.","sujet_education_men_etat"]],"maj":"2026-10-19"}},{"c":"melenchon","th":"eco","t":"Un « ISF climatique »","d":"Rétablir un impôt sur la fortune avec un volet climatique. Son plan budgétaire pour 2027 en attend 10 milliards d'euros.","s":["lfi_synthese","lcp_contrebudget_2027"],"aj":"2026-10-18","fin":"c","id":"p211","k":"isf","test":true,"a":{"v":10,"nature":"recette","per":"total","h":"dans son plan budgétaire pour 2027"},"plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Rétablir et renforcer l'impôt sur la fortune avec un volet climatique ».","lfi_synthese"],["Le volet climatique doit servir à « faire payer les plus gros pollueurs », selon son parti.","lfi_contrebudget_2025"],["Nous n'avons trouvé ni le seuil ni le barème prévus. En 2022, l'Institut Montaigne notait déjà que le candidat ne les avait pas précisés.","montaigne_2022_isf"]],"objectif":[["« Faire la révolution fiscale » : c'est le titre de la partie de son programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["Son parti veut renforcer l'impôt sur la fortune « avec une composante climatique afin de faire payer les plus gros pollueurs ».","lfi_contrebudget_2025"]],"auj":[["Depuis 2018, l'ISF est remplacé par l'impôt sur la fortune immobilière (IFI), qui ne porte que sur l'immobilier. Il doit rapporter 2,3 milliards d'euros en 2025, payés par 193 600 foyers, selon la DGFiP citée par l'AFP. L'ancien ISF rapportait « autour de 5 milliards d'euros en 2017 ».","moneyvox_ifi"]],"fin_cand":[["Dans son plan budgétaire pour 2027, présenté le 14 octobre 2026, son équipe attend 10 milliards d'euros de l'« ISF climatique ».","lcp_contrebudget_2027"],["Dans son contre-budget 2025 (novembre 2024), son parti en attendait 15 milliards d'euros.","lfi_contrebudget_2025"]],"fin_ind":[["En 2022, l'Institut Montaigne estimait la recette totale à 5,5 milliards d'euros par an, soit 3,5 milliards de plus que l'IFI, quand le candidat annonçait 10 milliards.","montaigne_2022_isf"],["En juin 2024, trois économistes (Lucas Chancel, Anne-Laure Delatte, Élise Huillery) estimaient entre 15 et 30 milliards d'euros la recette d'un ISF renforcé avec volet climatique et du rétablissement de l'exit tax, dans le programme du Nouveau Front populaire.","gc_nfp_recettes"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"eco","t":"Une taxe Zucman sur les patrimoines de plus de 100 millions d'euros","d":"Instaurer une taxe Zucman sur les patrimoines supérieurs à 100 millions d'euros. Son plan budgétaire pour 2027 en attend 15 milliards d'euros.","s":["lfi_synthese","lcp_contrebudget_2027"],"aj":"2026-10-18","fin":"c","id":"p212","k":"zucman","test":true,"a":{"v":15,"nature":"recette","per":"total","h":"dans son plan budgétaire pour 2027"},"plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Instaurer une taxe Zucman ou un impôt plancher sur le patrimoine des milliardaires ».","lfi_synthese"],["Dans son plan budgétaire de 2026, la taxe porte sur « les patrimoines supérieurs à 100 millions d'euros ».","lcp_contrebudget_2027"],["En 2024, son parti prévoyait une « garantie d'impôt de 2 % sur le patrimoine des milliardaires ».","lfi_contrebudget_2025"]],"objectif":[["« Faire la révolution fiscale » : c'est le titre de la partie de son programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["Son parti affirme que « les plus riches payent en moyenne seulement 2 % d'impôt sur leur revenu économique », et présente cet impôt plancher comme « un mécanisme de sécurité » contre l'optimisation fiscale.","lfi_contrebudget_2025"]],"auj":[["Une taxe Zucman de 2 % sur les patrimoines de plus de 100 millions d'euros a été votée par l'Assemblée nationale le 20 février 2025, puis rejetée par le Sénat le 12 juin 2025 (188 voix contre, 129 pour).","ps_zucman_senat"],["Le 31 octobre 2025, pendant l'examen du budget 2026, l'Assemblée l'a rejetée par 228 voix contre 172.","lcp_zucman_rejet"]],"fin_cand":[["Dans son plan budgétaire pour 2027, présenté le 14 octobre 2026, son équipe en attend 15 milliards d'euros.","lcp_contrebudget_2027"],["En novembre 2024, son parti la présentait comme « neutre budgétairement ».","lfi_contrebudget_2025"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"securite","t":"Rétablir une police de proximité","d":"Rétablir une police de proximité, interdire certaines pratiques dangereuses, « en premier lieu les LBD », et former les policiers.","s":["lfi_synthese"],"aj":"2026-10-18","fin":"n","id":"p213","k":"police","test":true,"plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Rétablir une police de proximité », « Interdire certaines pratiques dangereuses en premier lieu les LBD », « Former les policiers », « Interdire la reconnaissance faciale ».","lfi_synthese"],["Dans la partie « Refonder une police républicaine », il prévoit aussi de « Supprimer la Brav-M » et de « Créer une police de proximité ».","lfi_synthese"],["En 2024, son parti voulait « déployer de premières équipes de police de proximité » et « revoir et allonger la formation des policiers ».","lfi_contrebudget_2025"]],"objectif":[["« Une police de proximité au service de la sûreté des citoyens » : c'est le titre de la partie de son programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["« La police sera rénovée de la cave au grenier afin de mettre en place une véritable police républicaine »","lfi_contrebudget_2025"],["« Nous mènerons une politique intraitable vis-à-vis des violences policières. »","lfi_contrebudget_2025"]],"auj":[["La police de proximité, créée par la gauche en 1998, a été supprimée en 2003 par Nicolas Sarkozy, alors ministre de l'Intérieur.","ps_police_proximite"]],"fin_cand":[["Dans son contre-budget 2025 (novembre 2024), son parti chiffrait à 40 millions d'euros le déploiement des premières équipes de police de proximité avec le démantèlement de la Brav-M, et à 30 millions la refonte de la formation des policiers.","lfi_contrebudget_2025"],["Nous n'avons pas trouvé de coût dans son plan budgétaire de 2026.",null]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"immigration","t":"Abroger les dernières lois asile et immigration, et régulariser","d":"Abroger les dernières lois asile et immigration, et « régulariser les travailleurs, étudiants, parents d'enfants scolarisés ».","s":["lfi_synthese"],"aj":"2026-10-18","fin":"s","id":"p214","k":"asile","test":true,"plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Abroger les dernières lois asile et immigration » et « régulariser les travailleurs, étudiants, parents d'enfants scolarisés ».","lfi_synthese"],["Le programme prévoit aussi de « garantir une protection effective des mineurs non accompagnés au titre de la protection de l'enfance ».","lfi_synthese"],["En 2024, son parti voulait une « autorisation de travailler pour les demandeurs d'asile » et garantir l'accès à l'aide médicale de l'État (AME).","lfi_contrebudget_2025"]],"objectif":[["« Pour une politique migratoire humaniste » : c'est le titre de la partie de son programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["Son parti veut abroger les lois « votées par Macron pour punir et précariser toujours plus les migrants ».","lfi_contrebudget_2025"]],"auj":[["La dernière loi sur l'immigration est la loi n° 2024-42 du 26 janvier 2024, « pour contrôler l'immigration, améliorer l'intégration ».","anil_loi_immigration"],["En 2025, la France a délivré 384 230 premiers titres de séjour (+11,2 %) et procédé à 28 610 régularisations (-10,1 %). 151 665 demandes d'asile ont été déposées (-3,7 %), selon le ministère de l'Intérieur.","ps_titres_2025"]],"fin_cand":[["Dans son contre-budget 2025 (novembre 2024), son parti chiffrait à 80 millions d'euros l'accompagnement social et l'autorisation de travailler des demandeurs d'asile.","lfi_contrebudget_2025"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"securite","t":"5 milliards contre les violences sexistes, sexuelles et faites aux enfants","d":"Consacrer 5 milliards d'euros à un plan de lutte contre les violences sexistes et sexuelles et contre les violences faites aux enfants.","s":["lcp_contrebudget_2027","lfi_synthese"],"aj":"2026-10-18","fin":"c","id":"p215","k":"vss","test":true,"a":{"v":5,"nature":"cout","per":"total","h":"dans son plan budgétaire pour 2027"},"plus":{"detail":[["Dans son plan budgétaire pour 2027, présenté le 14 octobre 2026, son équipe consacre 5 milliards d'euros à un plan contre les violences sexistes et sexuelles et contre les violences faites aux enfants.","lcp_contrebudget_2027"],["En 2024, son parti voulait une « loi intégrale pour lutter contre les violences sexistes et sexuelles » et plus de moyens pour l'Aide sociale à l'enfance (ASE).","lfi_contrebudget_2025"],["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Former les magistrats à la prise en charge des violences sexistes et sexuelles et des violences faites aux enfants ».","lfi_synthese"]],"objectif":[["« Réaliser l'égalité entre les femmes et les hommes » et « Protéger les enfants » : ce sont des titres de parties de son programme.","lfi_synthese"]],"pourquoi":[["« Nous reprendrons la revendication des associations féministes d'une grande loi de lutte contre les violences sexistes »","lfi_contrebudget_2025"],["« Il faut ensuite s'attaquer au scandale des dérives de l'Aide sociale à l'enfance »","lfi_contrebudget_2025"]],"auj":[["En 2025, la police et la gendarmerie ont enregistré 132 300 victimes de violences sexuelles (+8 % sur un an). 85 % sont des femmes et 58 % des mineurs.","interieur_vss_2025"]],"fin_cand":[["Dans son plan budgétaire pour 2027, présenté le 14 octobre 2026, le plan est chiffré à 5 milliards d'euros.","lcp_contrebudget_2027"],["Dans son contre-budget 2025 (novembre 2024), son parti chiffrait la loi intégrale à 2,4 milliards d'euros et la hausse des moyens de l'ASE à 1 milliard.","lfi_contrebudget_2025"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"logement","t":"Augmenter les APL de 10 %","d":"Augmenter les aides personnalisées au logement (APL) de 10 %.","s":["lcp_contrebudget_2027","lfi_synthese"],"aj":"2026-10-18","fin":"c","id":"p216","k":"apl","test":true,"plus":{"detail":[["Augmenter de 10 % les aides personnelles au logement (APL).","lcp_contrebudget_2027"],["En 2024, son parti voulait que les APL « suivent l'inflation ».","lfi_contrebudget_2025"]],"objectif":[["« Garantir le droit au logement » : c'est le titre de la partie de son programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["Son parti veut « la revalorisation directe des APL de 10 % afin que ces dernières suivent l'inflation », et « que la baisse de 5 € par mois imposée par Macron ne soit plus qu'un mauvais souvenir ».","lfi_contrebudget_2025"]],"auj":[["En 2024, les aides personnelles au logement ont représenté 15,9 milliards d'euros : 7,1 milliards d'APL, 5,5 milliards d'ALS et 3,3 milliards d'ALF, versés à environ 5,8 millions de foyers.","drees_logement"],["Une hausse de 10 % de ce montant représenterait environ 1,6 milliard d'euros par an (calcul de l'appli).","drees_logement"]],"fin_cand":[["Selon Éric Coquerel, son plan budgétaire pour 2027 prévoit « la hausse des APL de 10 % (8 milliards) ». Le compte rendu ne précise pas ce que couvrent ces 8 milliards, plus élevés que 10 % des aides actuelles.","lcp_contrebudget_2027"],["Dans son contre-budget 2025 (novembre 2024), son parti chiffrait la même hausse de 10 % à 1,7 milliard d'euros.","lfi_contrebudget_2025"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"logement","t":"Encadrer les loyers partout en France","d":"Étendre et pérenniser l'encadrement des loyers sur tout le territoire.","s":["lfi_synthese"],"aj":"2026-10-18","fin":"s","id":"p217","k":"loyers","test":true,"plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Étendre et pérenniser l'encadrement des loyers sur tout le territoire ».","lfi_synthese"],["En 2024, son parti parlait d'un « encadrement des loyers à la baisse ».","lfi_contrebudget_2025"],["Le programme prévoit aussi de « Limiter la concentration immobilière en instaurant un plafond de logement transmis dans le cas de l'héritage ou achat direct ».","lfi_synthese"]],"objectif":[["« Garantir le droit au logement » : c'est le titre de la partie de son programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["Nous n'avons pas trouvé, pour l'instant, d'explication détaillée de sa part sur cette mesure."]],"auj":[["L'encadrement des loyers est une expérimentation créée par la loi Élan du 23 novembre 2018. Elle doit prendre fin le 24 novembre 2026, sauf nouvelle prolongation. Environ 70 villes l'appliquent, dont Paris, Lille, Lyon, Bordeaux et Grenoble.","actujur_loyers"]],"fin_cand":[["Nous n'avons pas trouvé de coût annoncé. La mesure change une règle et ne prévoit pas de dépense directe.",null]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"social","t":"3 milliards de plus pour l'hôpital et 10 000 soignants","d":"Augmenter le budget de l'hôpital de 3 milliards d'euros et créer 10 000 postes de personnels soignants.","s":["ps_contrebudget_2027"],"aj":"2026-10-18","fin":"c","id":"p218","k":"hopital","test":true,"a":{"v":3,"nature":"cout","per":"total","h":"dans son plan budgétaire pour 2027"},"plus":{"detail":[["Dans son plan budgétaire pour 2027, présenté le 14 octobre 2026, son équipe augmente de 3 milliards d'euros le budget de l'hôpital, avec la création de 10 000 postes de personnels soignants.","ps_contrebudget_2027"],["En 2024, son parti prévoyait un « plan pluriannuel de recrutement des professionnels du soin et du médico-social », la revalorisation du travail de nuit et du week-end à l'hôpital public, et la régulation de l'installation des médecins dans les déserts médicaux.","lfi_contrebudget_2025"],["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Instaurer le 100% Sécu » et « Reconnaître le burn out comme maladie professionnelle » radition chrétienne ».","s":["upr_rentree_2026"],"fin":"s","plus":{"detail":[["Son parti annonce l'inscription dans la Constitution de la France comme une « République laïque de tradition chrétienne ».","upr_rentree_2026"]],"auj":[["L'article 1er de la Constitution dispose : « La France est une République indivisible, laïque, démocratique et sociale. »","sujet_institutions_cc_constitution"]],"note":["Ses mesures viennent du compte rendu de son discours de rentrée publié par l'UPR. Ce texte résume ses propos sans les citer mot pour mot.","upr_rentree_2026"],"maj":"2026-10-19"}},{"c":"asselineau","id":"p241","k":"transparence","aj":"2026-10-19","th":"institutions","t":"Un questionnaire de transparence obligatoire pour les candidats à la présidentielle","d":"Obliger les candidats à la présidentielle à déclarer leurs autres nationalités, leurs liens avec certains cercles d'influence, leur appartenance à une loge maçonnique et les financements de leur parti.","s":["upr_rentree_2026"],"fin":"s","plus":{"detail":[["« Instauration d'un questionnaire obligatoire de transparence pour tous les candidats à la présidentielle »","upr_rentree_2026"],["Il porterait sur la « déclaration des éventuelles autres nationalités », les « liens passés ou présents avec des cercles comme la French American Foundation ou le Bilderberg » et l'« appartenance à des sociétés de pensée ou loges maçonniques ».","upr_rentree_2026"],["Il porterait aussi sur l'« origine des financements des partis et état réel des dettes politiques ».","upr_rentree_2026"]],"note":["Ses mesures viennent du compte rendu de son discours de rentrée publié par l'UPR. Ce texte résume ses propos sans les citer mot pour mot.","upr_rentree_2026"],"maj":"2026-10-19"}},{"c":"asselineau","id":"p242","k":"regions","aj":"2026-10-19","th":"etat","t":"Supprimer les régions et la moitié des conseillers départementaux","d":"Supprimer les régions et la moitié des conseillers départementaux.","s":["upr_rentree_2026"],"fin":"c","a":{"v":6,"nature":"economie","per":"nd","h":"économie annoncée par l'UPR pour la suppression des régions"},"plus":{"detail":[["« Suppression de la moitié des conseillers départementaux et suppression pure et simple des régions »","upr_rentree_2026"],["Le compte rendu ne dit pas qui reprendrait les compétences des régions.",null]],"fin_cand":[["Son parti estime la suppression des régions « à 6 milliards d'économies ». Le compte rendu ne dit pas comment ce chiffre est calculé.","upr_rentree_2026"]],"note":["Ses mesures viennent du compte rendu de son discours de rentrée publié par l'UPR. Ce texte résume ses propos sans les citer mot pour mot.","upr_rentree_2026"],"maj":"2026-10-19"}},{"c":"asselineau","id":"p243","k":"elysee","aj":"2026-10-19","th":"etat","t":"Diviser par deux le budget de l'Élysée","d":"Diviser par deux le budget de la présidence de la République, revendre la plupart des avions présidentiels et mettre fin au statut non officiel de Première dame.","s":["upr_rentree_2026"],"fin":"n","plus":{"detail":[["« Division par deux du budget de la présidence » et « revente de la majeure partie des aéronefs présidentiels ».","upr_rentree_2026"],["Il annonce aussi la « fin du statut non officiel de Première dame ».","upr_rentree_2026"]],"auj":[["Le projet de budget pour 2026 prévoyait une dotation de l'État à la présidence de la République de 122,56 millions d'euros, stable, selon la commission des finances du Sénat.","senat_pouvoirs_publics_plf2026"],["La moitié de cette dotation représente environ 61 millions d'euros (calcul de l'appli).","senat_pouvoirs_publics_plf2026"]],"note":["Ses mesures viennent du compte rendu de son discours de rentrée publié par l'UPR. Ce texte résume ses propos sans les citer mot pour mot.","upr_rentree_2026"],"maj":"2026-10-19"}},{"c":"attal","id":"p244","k":"equilibre","aj":"2026-10-19","th":"budget","t":"Revenir à l'équilibre des comptes publics en 2037","d":"Ramener le déficit public sous 3 % du PIB avant 2032 et revenir à l'équilibre en 2037, avec 120 à 150 milliards d'euros d'économies sans hausse d'impôts et une « règle d'or » soumise à référendum.","s":["ps_attal_fonctionnaires","acteurspublics_attal"],"fin":"c","a":{"v":120,"nature":"economie","per":"total","lab":"Économies annoncées","h":"entre 120 et 150 milliards d'euros sur dix ans, selon lui"},"plus":{"detail":[["Il vise un déficit public à 3 % du PIB « avant 2032 » et l'« absence de déséquilibre budgétaire à l'horizon 2037 ».","ps_attal_fonctionnaires"],["« Pour réaliser entre 120 et 150 milliards d'euros d'économies, sans hausse d'impôts », les deux tiers viendraient des dépenses sociales.","acteurspublics_attal"],["Il propose « un référendum en début de quinquennat pour une \"règle d'or\" d'équilibre budgétaire ».","acteurspublics_attal"]],"pourquoi":[["Selon lui, les dépenses sociales sont « hors de contrôle et pèsent trop sur ceux qui travaillent ».","acteurspublics_attal"]],"auj":[["Le projet de budget pour 2027 prévoit un déficit public de 5,0 % du PIB, après 5,4 % attendu en 2026. Il n'est pas encore voté.","sujet_budget_ecogouv_plf2027"],["Le Gouvernement vise un déficit sous 3 % du PIB en 2029.","sujet_budget_tresor_raa2026"]],"fin_cand":[["Il chiffre l'effort à « 120 à 150 milliards d'euros sur dix ans ».","ps_attal_fonctionnaires"]],"maj":"2026-10-19"}},{"c":"attal","id":"p245","k":"annee_blanche","aj":"2026-10-19","th":"pouvoir","t":"Geler les prestations sociales en 2028, sauf les petites retraites","d":"Faire une « année blanche » sur l'ensemble des prestations sociales dans le budget 2028 : elles ne seraient pas revalorisées, sauf les petites retraites.","s":["acteurspublics_attal","ps_attal_fonctionnaires"],"fin":"n","plus":{"detail":[["Il prévoit, « pour le premier budget de 2028, d'une année blanche sur l'ensemble des prestations sociales ».","acteurspublics_attal"],["Il veut « geler toutes les prestations sociales, en excluant toutefois les petites retraites ».","ps_attal_fonctionnaires"],["Nous n'avons pas trouvé à partir de quel montant une retraite serait considérée comme « petite ».",null]],"pourquoi":[["Selon lui, les dépenses sociales sont « hors de contrôle et pèsent trop sur ceux qui travaillent ».","acteurspublics_attal"]],"auj":[["Au 1er janvier 2026, les pensions de retraite de base ont augmenté de 0,9 %.","sujet_retraites_sp_revalo"],["Les prix ont augmenté de 3,0 % sur un an en septembre 2026 (estimation provisoire).","sujet_pouvoir_insee_ipc_sept"]],"maj":"2026-10-19"}},{"c":"attal","id":"p246","k":"impunite","aj":"2026-10-19","th":"etat","t":"Les ministres qui ne tiennent pas leur budget devront partir","d":"Obliger les ministres et directeurs d'administration centrale qui ne tiennent pas leur budget à quitter leurs fonctions, et le gouvernement à démissionner si la trajectoire budgétaire n'est pas tenue trois ans de suite.","s":["acteurspublics_attal"],"fin":"s","plus":{"detail":[["« Les ministres et directeurs d'administration centrale qui n'auront pas tenu leur budget devront quitter leurs fonctions. »","acteurspublics_attal"],["Si la trajectoire budgétaire n'est pas tenue trois années de suite, hors crise, « la responsabilité en incomberait au Premier ministre et à son gouvernement, appelés alors à démissionner ».","acteurspublics_attal"]],"auj":[["Le Gouvernement détermine et conduit la politique de la nation et dispose de l'administration (article 20 de la Constitution).","sujet_institutions_cc_constitution"]],"maj":"2026-10-19"}},{"c":"attal","id":"p247","k":"referendums","aj":"2026-10-19","th":"institutions","t":"Des référendums réguliers","d":"Organiser des référendums réguliers pour consulter les Français pendant le quinquennat, dont un référendum sur une « règle d'or » budgétaire en début de mandat.","s":["ps_meeting_attal","acteurspublics_attal"],"fin":"s","plus":{"detail":[["Il veut des « référendums réguliers » pour ne pas attendre cinq ans avant de donner la parole aux Français.","ps_meeting_attal"],["Le premier porterait sur une « règle d'or » d'équil e","d":"Augmenter de 20 % en cinq ans la rémunération des enseignants, en échange de plus d'autonomie, de présence, de formation et d'évaluation, et instaurer un certificat de fin de primaire pour entrer au collège.","s":["ne_education"],"fin":"n","plus":{"detail":[["« Une augmentation de 20 % des rémunérations en cinq ans », en échange de plus d'autonomie, de présence dans l'établissement, de formation et d'évaluation.","ne_education"],["« Un corps unique d'enseignants contractuels, recrutés sur concours national ».","ne_education"],["« Un certificat de fin de primaire, dont la validation conditionnera l'entrée au collège ».","ne_education"]],"auj":[["En 2025-2026, 851 500 enseignants travaillent dans les écoles et établissements.","sujet_education_depp_enc2026"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"c":"lisnard","id":"p319","k":"sante","aj":"2026-10-19","th":"social","t":"Doubler le nombre d'étudiants en médecine et supprimer les ARS","d":"Doubler le nombre d'étudiants en médecine d'ici 2030, rembourser mieux les actes dans les zones sous-dotées et supprimer les agences régionales de santé.","s":["ne_sante"],"fin":"n","plus":{"detail":[["« Nous voulons doubler le nombre d'étudiants en médecine d'ici 2030, supprimer Parcoursup ».","ne_sante"],["« La Sécurité sociale rembourse mieux les actes dans les zones sous-dotées que dans les zones saturées. »","ne_sante"],["« Nous voulons supprimer les ARS, transférer les responsabilités aux préfets et aux élus ».","ne_sante"]],"pourquoi":[["« Ce n'est pas une question de moyens – la France dépense plus que ses voisins. »","ne_sante"],["« Ce n'est pas un problème de candidats – 90 000 jeunes veulent devenir médecins chaque année ».","ne_sante"]],"auj":[["En 2025, 6,4 millions d'assurés n'ont pas de médecin traitant.","sujet_sante_senat_rapport668"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"c":"lisnard","id":"p320","k":"contrat","aj":"2026-10-19","th":"travail","t":"Un contrat de travail unique pour les nouveaux emplois","d":"Instaurer un contrat de travail unique pour les nouveaux emplois et supprimer les charges des particuliers employeurs au niveau du Smic.","s":["ne_ambition"],"fin":"n","plus":{"detail":[["« L'instauration d'un contrat de travail unique pour les nouveaux emplois ».","ne_ambition"],["« Les charges pour les employeurs à domicile au niveau du SMIC seront supprimées ».","ne_ambition"]],"auj":[["Le taux de chômage est de 8,3 % au 2e trimestre 2026.","sujet_travail_insee_chomage"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"c":"lisnard","id":"p321","k":"provinces","aj":"2026-10-19","th":"etat","t":"Remplacer départements et régions par des « Provinces »","d":"Passer à trois niveaux, État, Provinces et bloc communal, les Provinces remplaçant départements et régions, avec un référendum constitutionnel, et transférer aux collectivités la plupart des compétences de l'État.","s":["ne_civique"],"fin":"s","plus":{"detail":[["Un « nouveau schéma institutionnel à trois niveaux : Etat/ Province/ Bloc communal », « selon un choix à faire valider par un référendum constitutionnel ».","ne_civique"],["« Les Provinces pourraient résulter de la fusion de départements avec des territoires des Régions actuelles. »","ne_civique"],["L'État transférerait aux collectivités la plupart de ses compétences, sauf les fonctions régaliennes, et leur donnerait « un pouvoir normatif ».","ne_civique"]],"pourquoi":[["« L'organisation administrative territoriale est aujourd'hui d'une complexité incompréhensible pour le citoyen. »","ne_civique"]],"auj":[["Les collectivités territoriales sont les communes, les départements, les régions et des collectivités à statut particulier ; elles s'a d":"2026-10-14","s":"bfm_lepen_ukraine","k":"programme","c":["le-pen"],"txt":"Marine Le Pen dit qu'elle maintiendrait l'aide financière à l'Ukraine pendant six mois après son élection, puis qu'elle l'arrêterait"},{"d":"2026-10-14","s":"ps_odoxa_oct","k":"sondage","c":["melenchon","philippe"],"txt":"Baromètre Odoxa-Backbone (24 septembre au 7 octobre, 12 005 personnes) : avec Édouard Philippe comme candidat du centre, Jean-Luc Mélenchon atteint 18 % au premier tour, devant Édouard Philippe (17 %)"},{"d":"2026-10-15","s":"sudradio_lisnard","k":"sondage","c":["attal","lisnard","retailleau","zemmour"],"txt":"Sondage Ifop-Fiducial : David Lisnard est crédité de 6 % des intentions de vote au premier tour, devant Gabriel Attal, Bruno Retailleau et Éric Zemmour"},{"d":"2026-10-11","s":"orange_melenchon_jeunes","k":"programme","c":["melenchon"],"txt":"À Clermont-Ferrand, Jean-Luc Mélenchon propose de supprimer Parcoursup et d'abaisser l'âge du droit de vote à 16 ans"},{"d":"2026-10-11","s":"sudradio_becht","k":"programme","c":["becht"],"txt":"Olivier Becht présente son « Projet France » : supprimer et remplacer Parcoursup, un contrat de travail unique avec un salaire socle"}],"sondages":[{"id":"harris-v6","inst":"Toluna Harris Interactive","pour":"M6 et RTL","terrain":"22 au 24 septembre 2026","d":"2026-09-28","n":1974,"hyp":"Hypothèse 1 : Raphaël Glucksmann, Gabriel Attal et Édouard Philippe candidats","s":["toluna_v6"],"scores":{"le-pen":35,"melenchon":17,"philippe":13,"glucksmann":10,"retailleau":7,"attal":5,"zemmour":5,"tondelier":3,"roussel":2,"dupont-aignan":2,"arthaud":1}},{"id":"elabe-08","inst":"Elabe","pour":"voir la notice de l'institut","terrain":"26 au 28 août 2026","d":"2026-08-28","n":1501,"hyp":"Hypothèse avec Raphaël Glucksmann et Édouard Philippe, sans Gabriel Attal","s":["wiki_polls"],"scores":{"le-pen":34,"philippe":17,"melenchon":14,"glucksmann":11.5,"retailleau":6.5,"zemmour":4,"tondelier":3.5,"roussel":3,"dupont-aignan":3,"arthaud":1.5,"villepin":2}},{"id":"ifop-08","inst":"Ifop","pour":"voir la notice de l'institut","terrain":"24 et 25 août 2026","d":"2026-08-25","n":1598,"hyp":"Hypothèse avec Raphaël Glucksmann, Gabriel Attal et Édouard Philippe","s":["wiki_polls"],"scores":{"le-pen":33,"melenchon":16,"philippe":14.5,"glucksmann":11,"attal":8,"retailleau":6,"zemmour":3.5,"roussel":3,"tondelier":3,"dupont-aignan":1.5,"arthaud":0.5}}],"duels":{"inst":"Toluna Harris Interactive pour M6 et RTL","terrain":"8 au 10 septembre 2026","n":2052,"s":"toluna_v5","list":[["le-pen",67,"melenchon",33],["le-pen",56,"attal",44],["le-pen",55,"philippe",45]]},"reperes":{"dette":{"v":3595.5,"pct":"119 % du PIB","quand":"fin juin 2026","s":"insee_dette"},"deficit":{"v":152.5,"pct":"5,1 % du PIB","quand":"en 2025","s":"insee_apu"},"depenses":{"v":1714.1,"quand":"en 2025","s":"insee_apu"},"population":69.1,"popSource":"insee_demo","axes":{"retraites":{"titre":"L'âge de départ proposé","min":59.5,"max":65.5,"ticks":[60,62,64,65],"unite":"ans","rows":[{"c":"le-pen","v":62,"alt":60,"altLabel":"60 si début avant 20 ans","s":"ps_retraites"},{"c":"melenchon","v":62,"alt":60,"altLabel":"objectif 60","s":"ps_retraites"},{"c":"philippe","v":65,"s":"ps_retraites"},{"c":"retailleau","v":63,"alt":65,"altLabel":"retraite complète à 65","s":"ps_retraites"},{"c":"roussel","v":60,"s":"pcf_pacte"}],"note":"Sans âge fixe : Gabriel Attal (selon les années de travail), Raphaël Glucksmann et François Ruffin (selon la pénibilité)."},"travail":{"titre":"Le salaire minimum proposé","min":1450,"max":2300,"ticks":[1500,1800,2100],"unite":"€","rows":[{"c":"arthaud","v":2200,"label":"2 200 € net","s":"lbb_arthaud"},{"c":"melenchon","v":1700,"label":"1 700 € net","s":"an_ppl3176"},{"c":"ruffin","v":1700,"label":"1 700 € net","s":"orange_ruffin"},{"c":"tondelier","v":2000,"hollow":true,"label":"2 000 € brut","s":"lci_tondelier"}],"note":"Point plein : montant net, ce que l'on touche. Point creux : montant brut, avant cotisations."}}},"agenda":[["2026-12-13","Les adhérents des Écologistes décident s'ils gardent Marine Tondelier comme candidate (vote du 10 au 13 décembre)"],["2027-03","Liste officielle des candidats, publiée par le Conseil constitutionnel"],["2027-04-18","Premier tour"],["2027-05-02","Second tour"]],"videos":[],"kit":[{"id":"inscription","titre":"Suis-je inscrit pour voter ?","en_bref":"Pour voter, il faut être inscrit sur une liste électorale, et ce n'est pas toujours automatique. Un service officiel gratuit permet de vérifier votre inscription et votre bureau de vote.","blocs":[{"h":"S'inscrire : en ligne, en mairie ou par courrier","txt":"En ligne, vous utilisez le service officiel de demande d'inscription ; en mairie ou par courrier, le formulaire cerfa n°12669. Il faut fournir un justificatif d'identité et un justificatif de domicile de moins de 3 mois.","src":"kit_sp_inscription"},{"h":"La date limite","txt":"À partir du 1er juillet 2026, la date limite pour s'inscrire est le 6e vendredi précédant le scrutin, que la démarche se fasse en ligne ou en mairie. Avant cette date, la limite en ligne était le 6e mercredi.","src":"kit_sp_a18967"},{"h":"À 18 ans : l'inscription automatique et ses limites","txt":"Si vous avez fait votre recensement citoyen à 16 ans, vous êtes inscrit automatiquement à 18 ans. Sinon, ou si le recensement a été tardif, ce n'est pas automatique. Après un déménagement, demandez à votre nouvelle mairie de vous inscrire.","src":"kit_sp_auto18"},{"h":"Moins de 26 ans, chez vos parents","txt":"Si vous habitez chez vos parents et avez moins de 26 ans, deux documents suffisent : un justificatif de moins de 3 mois prouvant le domicile réel de votre parent dans la commune, et un document prouvant votre filiation (livret de famille, acte de naissance).","src":"kit_sp_justif"}],"lien":{"label":"Vérifier mon inscription","u":"https://www.service-public.gouv.fr/particuliers/vosdroits/R51788"},"sous":"Vérifier son inscription et s'inscrire à temps"},{"id":"procuration","titre":"Voter par procuration","en_bref":"Si vous ne pouvez pas vous rendre au bureau de vote, vous pouvez désigner un électeur qui votera à votre place. La demande commence en ligne sur maprocuration.gouv.fr.","blocs":[{"h":"Qui peut voter à votre place ?","txt":"Depuis le 1er janvier 2022, vous pouvez donner procuration à un électeur inscrit sur les listes électorales d'une autre commune que la vôtre.","src":"kit_ei_procuration"},{"h":"Où faire la démarche","txt":"Vous faites votre demande en ligne, puis vous vous déplacez au commissariat, à la gendarmerie ou au consulat pour faire vérifier votre identité et valider la procuration. Avec une identité numérique certifiée, pas besoin de vous déplacer.","src":"kit_mp_accueil"},{"h":"100 % en ligne avec France Identité","txt":"Avec la nouvelle carte d'identité et une identité numérique certifiée France Identité, vous pouvez faire valider votre identité via l'application, sans vous déplacer en gendarmerie ou en commissariat.","src":"kit_int_france_identite"},{"h":"Durée et nombre de procurations","txt":"La procuration est établie soit pour un scrutin déterminé, soit pour une durée donnée, dans la limite d'un an. Le jour du vote, l'électeur désigné ne peut avoir qu'une procuration établie en France.","src":"kit_ei_procuration"}],"lien":{"label":"Faire ma procuration","u":"https://www.maprocuration.gouv.fr/"},"sous":"Si vous n'êtes pas là le jour du vote"},{"id":"election","titre":"Comment se passe la présidentielle","en_bref":"Le président de la République est élu pour cinq ans au suffrage universel direct. Le premier tour de la prochaine élection est fixé au 18 avril 2027, et le second tour, s'il est nécessaire, au 2 mai 2027.","blocs":[{"h":"Candidats : 500 parrainages","txt":"Un candidat doit être présenté par au moins 500 élus (parlementaires, conseillers, maires…) venant d'au moins 30 départements ou collectivités d'outre-mer, sans que plus d'un dixième viennent du même département ou de la même collectivité. Le Conseil constitutionnel établit la liste des candidats.","src":"kit_cc_loi62"},{"h":"Un ou deux tours","txt":"Le président est élu à la majorité absolue des suffrages exprimés. Sinon, un second tour oppose les deux candidats arrivés en tête au premier tour, après retrait éventuel de candidats mieux placés. Son mandat dure cinq ans.","src":"kit_cc_constitution"},{"h":"Les dates de 2027","txt":"Le Conseil des ministres du 1er juillet 2026 a statué : premier tour le dimanche 18 avril 2027, second tour le dimanche 2 mai 2027. Dans certains territoires d'outre-mer, dont la Guadeloupe, le vote a lieu le samedi (17 avril et 1er mai).","src":"kit_sp_dates2027"},{"h":"Temps de parole : l'exemple de 2022","txt":"Pour la présidentielle de 2022, l'Arcom veillait au pluralisme politique : les chaînes devaient respecter l'équité des temps de parole et d'antenne, puis, pendant la campagne officielle, leur égalité, dans des conditions de programmation comparables.","src":"kit_arcom_2022"}],"sous":"Parrainages, deux tours, dates de 2027"},{"id":"president","titre":"Ce que peut faire le président","en_bref":"Le président de la République nomme le Premier ministre, peut dissoudre l'Assemblée nationale, organiser certains référendums et il est chef des armées. Les lois sont votées par le Parlement, et le Gouvernement détermine et conduit la politique de la nation.","blocs":[{"h":"Premier ministre et armées","txt":"Le président nomme le Premier ministre et met fin à ses fonctions sur la présentation par celui-ci de la démission du Gouvernement (article 8). Il est le chef des armées (article 15).","src":"kit_cc_constitution"},{"h":"Dissolution et référendum","txt":"Il peut dissoudre l'Assemblée nationale, mais pas à nouveau dans l'année qui suit les élections qui en résultent (art. 12). Sur proposition du Gouvernement ou des deux assemblées, il peut soumettre certains projets de loi au référendum (art. 11).","src":"kit_cc_constitution"},{"h":"Les lois, la Constitution","txt":"Le Parlement, qui comprend l'Assemblée nationale et le Sénat, vote la loi et les projets de loi de finances (articles 24 et 47). La révision de la Constitution peut être proposée par le président, sur proposition du Premier ministre, ou par les parlementaires (article 89).","src":"kit_cc_constitution"},{"h":"La cohabitation","txt":"On parle de cohabitation lorsque le Président de la République et la majorité des députés sont de tendances politiques opposées. Le Gouvernement détermine et conduit la politique de la nation (article 20) et il est responsable devant l'Assemblée nationale.","src":"kit_cc_cohabitation"}],"sous":"Ce qu'il décide seul, ce qui passe par le Parlement"},{"id":"promesse","titre":"Lire une promesse de campagne","en_bref":"Une promesse de campagne n'est pas une décision déjà prise. Pour la lire, posez-vous quatre questions : est-elle chiffrée, est-elle financée, qui décide, et par quel texte ?","blocs":[{"h":"Est-ce chiffré ? Est-ce financé ?","txt":"Demandez combien la mesure coûte et comment elle serait financée : nouvel impôt, économie ailleurs, dette. À noter : le Parlement vote les projets de loi de finances (article 47 de la Constitution).","src":"kit_cc_constitution"},{"h":"Qui décide ?","txt":"Selon la Constitution, le Gouvernement détermine et conduit la politique de la nation (art. 20) et le Parlement vote la loi (art. 24). Pour chaque promesse, cherchez quel texte il faudrait, et qui devrait le prendre ou le voter.","src":"kit_cc_constitution"},{"h":"Exemple : le Smic, par décret","txt":"Le Smic est revalorisé chaque année au 1er janvier. Pour 2026, c'est le décret n° 2025-1228 du 17 décembre 2025 qui a porté relèvement du Smic. En cours d'année, il peut l'être si les prix augmentent d'au moins 2 %.","src":"kit_sp_smic"},{"h":"Exemple : la retraite, par la loi","txt":"La réforme des retraites a été suspendue par la loi de financement de la Sécurité sociale pour 2026 : l'âge légal de 64 ans ne s'applique plus aux personnes nées en 1968, mais uniquement à celles nées à partir de 1969.","src":"kit_sp_retraites"}],"sous":"Chiffrée ? Financée ? Qui décide ?"},{"id":"fausse-info","titre":"Repérer une fausse information","en_bref":"Avant de croire ou de partager une information, vérifiez sa source et sa date. Le CLEMI, centre d'éducation aux médias et à l'information, conseille aussi de croiser les sources et de se méfier des images et des vidéos.","blocs":[{"h":"Cherchez la source et la date","txt":"Pour savoir si l'information est vraie, il faut chercher sa source. Regardez aussi sa date : si elle est ancienne, elle n'est peut-être plus vraie. Où est-elle publiée : sur un média connu comme sérieux ou sur un site inconnu ?","src":"kit_clemi_poster"},{"h":"Vérifiez avec d'autres sources","txt":"On peut vérifier si d'autres médias confirment cette information avec d'autres sources. Le CLEMI le résume ainsi : « chacun doit donc vérifier ses sources ! ».","src":"kit_clemi_poster"},{"h":"Images et vidéos : prudence","txt":"Une photo ou une vidéo ne sont pas des preuves suffisantes, car elles peuvent être truquées. Ce n'est pas parce qu'une photo ou une vidéo est très partagée sur les réseaux sociaux qu'elle est vraie.","src":"kit_clemi_poster"},{"h":"Prendre du recul, utiliser le fact-checking","txt":"Le CLEMI conseille de prendre du recul, car le web nous a poussé à vivre dans l'instantanéité, et d'utiliser des sites de fact-checking. Il cite notamment CheckNews (Libération), Les Décodeurs (Le Monde) et le blog Factuel de l'AFP.","src":"kit_clemi_mission"}],"lien":{"label":"Mission fact-checking (CLEMI)","u":"https://www.clemi.fr/familles/activites-en-famille/mission-fact-checking"},"_liens_non_verifies":[{"label":"AFP Factuel","u":"https://factuel.afp.com/","note":"page non ouverte (acces bloque depuis l'environnement de recherche) : a verifier avant publication"},{"label":"franceinfo Vrai ou faux","u":"https://www.francetvinfo.fr/vrai-ou-faux/","note":"page non ouverte (acces bloque) : a verifier avant publication"}],"sous":"Les bons réflexes avant de partager"}],"budget":{"dep":{"annee":"2024","statut":"provisoire","total":1671.8,"postes":[{"l":"Protection sociale","md":693,"pct":41.5,"dont":[["Retraites",392],["Famille et enfants",66.7],["Chômage",48.5],["Exclusion sociale",36.5],["Aides au logement",21.1]]},{"l":"Santé","md":261.2,"pct":15.6},{"l":"Fonctionnement des administrations","md":181.1,"pct":10.8,"dont":[["Intérêts de la dette",58.9]]},{"l":"Économie et transports","md":166.1,"pct":9.9},{"l":"École et enseignement supérieur","md":148.6,"pct":8.9},{"l":"Défense","md":54.2,"pct":3.2},{"l":"Sécurité, justice et secours","md":52.1,"pct":3.1},{"l":"Culture, sport et loisirs","md":43.1,"pct":2.6},{"l":"Logement et équipements collectifs","md":42.1,"pct":2.5},{"l":"Environnement","md":30.3,"pct":1.8}],"src":["budget_insee_cofog","eurostat_cofog"]},"rec":{"annee":"2025","total":1561.7,"blocs":[["Impôts et cotisations sociales (prélèvements obligatoires)",1374.1],["Recettes de production",129.2],["Revenus de la propriété",23],["Autres transferts",35.5]],"detail":[["Cotisations sociales effectives",446.3],["Taxe sur la valeur ajoutée (TVA)",208.8],["Contribution sociale généralisée (CSG)",156.6],["Impôt sur le revenu des personnes physiques (IRPP), avant crédits d'impôts",103.6],["Impôt sur les sociétés (IS), avant crédits d'impôts",69.5],["Taxe foncière",44.2],["Accises sur les produits énergétiques (TICPE)",30.5],["Droits de mutation à titre gratuit (successions, donations)",21.1]],"src":["insee_ip2106","insee_impots","insee_ir78_annexe"]}},"sujets":{"logement":{"trente":{"txt":"57,3 % des ménages sont propriétaires de leur résidence principale ; environ 40 % sont locataires. Le maire ou l'intercommunalité délivre en général les permis de construire, et une commission du bailleur social attribue les HLM. La loi SRU impose un quota de logements sociaux à certaines communes ; les Caf versent l'APL.","src":["sujet_logement_insee_parc2026","sujet_logement_sp_permis_autorite","sujet_logement_sp_hlm","sujet_logement_anil_sru","sujet_logement_sp_apl"]},"chiffres":[{"v":"38,6 millions","l":"de logements en France (hors Mayotte) au 1er janvier 2026, dont 82,7 % de résidences principales","src":"sujet_logement_insee_parc2026"},{"v":"57,3 %","l":"des ménages sont propriétaires de leur résidence principale en 2026 ; la part de locataires se maintient autour de 40 % (23,2 % du parc de résidences principales chez des bailleurs privés, 17,3 % chez des bailleurs publics)","src":"sujet_logement_insee_parc2026"},{"v":"5,4 millions","l":"de logements locatifs sociaux au 1er janvier 2025, soit 15,9 % des résidences principales","src":"sujet_logement_sdes_rpls2025"},{"v":"2,8 millions","l":"de demandeurs en attente d'un logement social en 2025, contre 2 millions en 2017 (chiffre cité par le Sénat)","src":"sujet_logement_senat_avis819"},{"v":"274 611","l":"logements mis en chantier en 2025, soit 21,3 % de moins que la moyenne des cinq années précédentes","src":"sujet_logement_sdes_construction2025"},{"v":"16,8 %","l":"du revenu des ménages consacré à leur résidence principale en 2024, après déduction des aides au logement (18,3 % début 2014) ; 32,1 % pour le quart des ménages les plus modestes","src":"sujet_logement_insee_taux_effort"}],"recent":[{"date":"8 juil. 2026","txt":"Le Sénat adopte avec modifications, en première lecture, le projet de loi visant la relance et la décentralisation du logement, qui vise notamment à créer un cadre pour le troisième programme national de renouvellement urbain et à renforcer les pouvoirs du maire dans l'attribution des logements sociaux. Le texte a été transmis à l'Assemblée nationale et n'est pas encore une loi.","src":"sujet_logement_senat_pjl2026","iso":"2026-07-08"},{"date":"26 nov. 2025","txt":"La loi n° 2025-1129 de simplification du droit de l'urbanisme et du logement est promulguée, après l'adoption définitive par l'Assemblée nationale le 15 octobre 2025 ; le Conseil constitutionnel l'a jugée partiellement conforme à la Constitution (décision du 20 novembre 2025).","src":"sujet_logement_senat_loi2025","iso":"2025-11-26"},{"date":"19 nov. 2024","txt":"La loi n° 2024-1039 renforce les outils de régulation des meublés de tourisme à l'échelle locale : elle étend les autorisations de changement d'usage, prévoit des quotas d'autorisations temporaires et réduit certains avantages fiscaux sur les revenus de ces locations.","src":"sujet_logement_senat_loi2024","iso":"2024-11-19"},{"date":"27 juil. 2023","txt":"La loi n° 2023-668 visant à protéger les logements contre l'occupation illicite est promulguée. Elle vise à mieux réprimer le squat des logements et à sécuriser les rapports locatifs ; elle modifie notamment des procédures d'expulsion et des délais en cas d'impayés de loyer.","src":"sujet_logement_senat_loi2023","iso":"2023-07-27"}],"decide":[{"txt":"Le permis de construire est délivré au nom de la commune ou de l'établissement public de coopération intercommunale (EPCI) : l'autorité compétente est le maire ou le président de l'EPCI. En règle générale, le silence de l'administration pendant 2 à 3 mois vaut acceptation.","src":"sujet_logement_sp_permis_autorite"},{"txt":"La loi SRU impose aux communes d'au moins 1 500 habitants dans l'unité urbaine de Paris, ou d'au moins 3 500 habitants ailleurs, situées dans une agglomération ou un EPCI de plus de 50 000 habitants comprenant au moins une commune de plus de 15 000 habitants, de compter 25 % ou 20 % de logements sociaux. Sinon, elles subissent un prélèvement sur leurs ressources fiscales, et le préfet peut prononcer la carence de la commune.","src":"sujet_logement_anil_sru"},{"txt":"Pour chaque logement social disponible, le bailleur sélectionne plusieurs dossiers de demande, puis une commission décide de l'attribution selon la situation du demandeur. La demande se fait en ligne ou au guichet et donne lieu à un numéro unique national.","src":"sujet_logement_sp_hlm"}],"jeunes":[{"txt":"Dépôt de garantie : il ne doit pas dépasser 1 mois de loyer hors charges pour un logement vide, et 2 mois de loyer hors charges pour un logement meublé. Il doit être rendu dans un délai maximum de 1 mois si l'état des lieux de sortie est conforme à celui d'entrée, de 2 mois sinon.","src":"sujet_logement_sp_depot"},{"txt":"Garantie Visale : caution gratuite d'Action Logement pour les locataires de 30 ans et moins (30 ans inclus), qui couvre les loyers impayés et les dégradations. Le loyer est plafonné à 1 940 € en Île-de-France et à 1 575 € ailleurs (ou moins selon la commune). La demande doit être faite avant la signature du bail, sur Visale.fr.","src":"sujet_logement_sp_visale"},{"txt":"Aide au logement des étudiants (APL, ALS ou ALF) : il faut être français ou étranger avec un titre de séjour en cours de validité, louer un logement décent, ne pas avoir de lien de parenté avec le propriétaire et avoir de faibles ressources. Si les parents perçoivent des allocations familiales, il faut choisir entre l'aide au logement et le fait de rester à leur charge. En colocation, chaque colocataire peut en bénéficier.","src":"sujet_logement_sp_etudiant_apl"},{"txt":"Avance Loca-Pass : prêt sans intérêts ni frais de dossier pour financer le dépôt de garantie, de 1 200 € maximum. Il est ouvert notamment aux personnes de moins de 30 ans en formation professionnelle, en recherche d'emploi ou avec un emploi non permanent, et aux étudiants boursiers d'État français. Il se rembourse sur 25 mois maximum, par mensualités d'au moins 20 €.","src":"sujet_logement_sp_locapass"}],"questions":[{"txt":"Comment relancer la construction de logements neufs ?","src":"sujet_logement_senat_avis819"},{"txt":"Comment répartir les pouvoirs entre l'État, les maires et les intercommunalités en matière de logement ?","src":"sujet_logement_senat_avis819"},{"txt":"Comment financer la production de logements sociaux pour répondre à la demande ?","src":"sujet_logement_senat_rapport_plf2026"},{"txt":"Comment répondre aux demandes d'hébergement d'urgence qui ne sont pas pourvues ?","src":"sujet_logement_senat_rapport_plf2026"}],"lire":["sujet_logement_senat_avis819","sujet_logement_senat_rapport_plf2026","sujet_logement_insee_taux_effort"]},"retraites":{"trente":{"txt":"En France, les retraites fonctionnent par répartition : les cotisations des actifs financent chaque année les pensions des retraités. L'âge légal de départ est de 64 ans pour les personnes nées à partir de 1969. La pension est à taux plein avec assez de trimestres validés ; sinon elle baisse (décote), sauf si l'on part à 67 ans.","src":["sujet_retraites_cor_repartition","sujet_retraites_sp_suspension","sujet_retraites_sp_decote"]},"chiffres":[{"v":"14,1 %","l":"part du PIB consacrée aux dépenses de retraite en 2025 (422 milliards d'euros)","src":"sujet_retraites_cor_ra2026"},{"v":"-0,2 point de PIB","l":"solde estimé du système de retraite en 2025 (déficit de 5,1 milliards d'euros) ; projection du COR : -0,9 point en 2045, -2,4 points en 2070","src":"sujet_retraites_cor_ra2026"},{"v":"2,5","l":"personnes de 20 à 64 ans pour 1 personne de 65 ans et plus en 2025, contre 3,6 en 2009","src":"sujet_retraites_cor_ra2026"},{"v":"15,4 millions","l":"retraités du seul régime général au 31 décembre 2024 (10 millions il y a 20 ans)","src":"sujet_retraites_ar_chiffres"},{"v":"62 ans 9 mois à 64 ans","l":"âge légal de départ selon la génération, depuis le 1er septembre 2026 : 62 ans et 9 mois (nés en 1964) à 63 ans et 9 mois (1968) ; 64 ans dès 1969","src":"sujet_retraites_sp_suspension"},{"v":"170 à 172","l":"trimestres requis (durée d'assurance) selon la génération, nés de 1964 à 1968, depuis le 1er septembre 2026","src":"sujet_retraites_sp_suspension"}],"recent":[{"date":"7 mai 2026","txt":"Le décret n° 2026-344 du 7 mai 2026, publié au Journal officiel du 8 mai, tire les conséquences de la loi de financement de la sécurité sociale pour 2026 sur les conditions de départ à la retraite de certains assurés. La suspension est entrée en vigueur pour les pensions prenant effet à compter du 1er septembre 2026.","src":"sujet_retraites_an_qe15271","iso":"2026-05-07"},{"date":"1er janv. 2026","txt":"Les pensions de retraite de base augmentent de 0,9 %.","src":"sujet_retraites_sp_revalo","iso":"2026-01-01"},{"date":"30 déc. 2025","txt":"La loi de financement de la sécurité sociale pour 2026 est promulguée. Elle suspend jusqu'en 2028 le relèvement de l'âge légal et l'augmentation de la durée d'assurance de la réforme de 2023. Le COR chiffre cette suspension à 1,8 milliard d'euros en moyenne en année pleine jusqu'en 2032.","src":"sujet_retraites_sp_suspension","iso":"2025-12-30"},{"date":"14 avr. 2023","txt":"La loi de financement rectificative de la sécurité sociale pour 2023 prévoit le relèvement de l'âge légal de départ à la retraite à 64 ans au lieu de 62 ans.","src":"sujet_retraites_senat_2023","iso":"2023-04-14"}],"decide":[{"txt":"L'âge légal et la durée d'assurance sont fixés par la loi, votée par le Parlement : la réforme de 2023 est passée par une loi de financement rectificative de la sécurité sociale, et sa suspension par la loi de financement de la sécurité sociale pour 2026.","src":"sujet_retraites_sp_suspension"},{"txt":"Les lois de financement de la sécurité sociale déterminent les conditions générales de l'équilibre financier de la Sécurité sociale et fixent ses objectifs de dépenses.","src":"sujet_retraites_an_fiche54"},{"txt":"Pour la retraite complémentaire des salariés du privé (Agirc-Arrco), ce sont les partenaires sociaux, c'est-à-dire les organisations d'employeurs et de salariés, qui pilotent le régime : tous les 4 ans, ils négocient un accord qui fixe notamment la valeur du point et les taux de cotisation.","src":"sujet_retraites_cor_agirc"}],"jeunes":[{"txt":"Pour valider 1 trimestre, il faut un revenu au moins égal à 150 heures de Smic horaire brut (1 803,00 € en 2026), dans la limite de 4 trimestres par année civile. Service-public prend l'exemple d'un étudiant qui travaille en août 35 heures par semaine au Smic : ces revenus peuvent lui permettre de valider un trimestre.","src":"sujet_retraites_sp_duree_assurance"},{"txt":"Pour les périodes d'apprentissage accomplies depuis 2014, les apprentis peuvent valider autant de trimestres de retraite que de trimestres d'apprentissage. Les périodes d'activité en contrat en alternance sont validées dans les mêmes conditions que celles des autres salariés de l'entreprise.","src":"sujet_retraites_ir_alternance"},{"txt":"On peut demander le rachat de ses années d'études supérieures à partir de 20 ans et avant 67 ans, à condition que ces études aient donné lieu à un diplôme. Au total, 12 trimestres au plus peuvent être rachetés, tous motifs confondus (études supérieures, années incomplètes, sportif de haut niveau, mandat local).","src":"sujet_retraites_sp_rachat"}],"questions":[{"txt":"Comment équilibrer le système de retraite : en baissant les dépenses, en augmentant les cotisations ou en reculant l'âge de départ ?","src":"sujet_retraites_cor_ra2026"},{"txt":"Quelle place donner à la répartition, aux réserves et à la capitalisation dans le financement des retraites ?","src":"sujet_retraites_cor_repartition"},{"txt":"Comment le niveau de vie des retraités doit-il évoluer par rapport à celui des actifs ?","src":"sujet_retraites_cor_ra2026"},{"txt":"Quel poids donner, dans l'avenir du système de retraite, à la croissance de la productivité et à la démographie ?","src":"sujet_retraites_cor_ra2026"}],"lire":["sujet_retraites_cor_ra2026","sujet_retraites_cor_repartition","sujet_retraites_ar_chiffres"],"story":{"s1":{"v":"64 ans","u":"C'est l'âge légal de départ à la retraite pour les personnes nées à partir de 1969.","txt":"Les cotisations de ceux qui travaillent paient chaque année les pensions des retraités : c'est la retraite par répartition. Sans assez de trimestres, la pension baisse, sauf si l'on part à 67 ans.","src":["sujet_retraites_cor_repartition","sujet_retraites_sp_suspension","sujet_retraites_sp_decote"]},"s2":{"v":"2,5","u":"personnes de 20 à 64 ans pour 1 personne de 65 ans et plus, en 2025.","barres":[["2009",3.6,"3,6"],["2025",2.5,"2,5"]],"txt":"Il y a donc moins de personnes en âge de travailler pour chaque personne de 65 ans et plus qu'en 2009.","src":["sujet_retraites_cor_ra2026"]},"s3":{"t":"La hausse de l'âge légal est suspendue jusqu'en 2028","items":[{"d":"1er septembre 2026","txt":"La suspension s'applique aux retraites qui commencent à partir de cette date. Pour les personnes nées de 1964 à 1968, l'âge légal va de 62 ans et 9 mois à 63 ans et 9 mois."},{"d":"30 décembre 2025","txt":"La loi de financement de la Sécurité sociale pour 2026 suspend jusqu'en 2028 la hausse de l'âge légal et du nombre de trimestres prévue en 2023."},{"d":"14 avril 2023","txt":"La réforme des retraites relève l'âge légal de 62 à 64 ans."}],"src":["sujet_retraites_sp_suspension","sujet_retraites_an_qe15271","sujet_retraites_senat_2023"]},"s4":{"t":"L'âge de départ proposé","age":true,"groupes":[{"big":"60 ans","c":["kazib","roussel"]},{"big":"62 ans","c":["le-pen","maurel","melenchon"]},{"big":"63 ans","c":["retailleau"]},{"big":"64 ans","ref":"La règle actuelle, pour les personnes nées à partir de 1969"},{"big":"65 ans","c":["philippe"]}],"autres":"font des propositions sans fixer d'âge légal : durée de travail, pénibilité, âge du taux plein, capitalisation, montant des pensions. Les conditions sont dans chaque proposition.","ids":["p002","p010","p022","p027","p035","p041","p051","p056","p065","p074","p084","p098","p109","p112","p119","p128","p138","p155","p156"]}}},"travail":{"trente":{"txt":"Le Smic est le salaire minimum légal : 12,31 euros brut de l'heure depuis le 1er juin 2026. La durée légale du travail est de 35 heures par semaine. Un salarié qui perd son emploi peut être indemnisé par l'assurance chômage, en général après 6 mois de travail, jusqu'à 18 mois avant 55 ans.","src":["sujet_travail_sp_smic_juin","sujet_travail_sp_duree_travail","sujet_travail_unedic_duree"]},"chiffres":[{"v":"1 477,93 €","l":"Smic mensuel net pour un temps plein depuis le 1er juin 2026 (1 867,02 € brut, soit 12,31 € brut de l'heure)","src":"sujet_travail_sp_smic_juin"},{"v":"8,3 %","l":"taux de chômage de la population active au 2e trimestre 2026 (+0,2 point sur un trimestre)","src":"sujet_travail_insee_chomage"},{"v":"21,6 %","l":"taux de chômage des 15-24 ans au 2e trimestre 2026 (+0,4 point sur un trimestre)","src":"sujet_travail_insee_chomage"},{"v":"69,0 %","l":"taux d'emploi des 15-64 ans au 2e trimestre 2026 (-0,3 point sur un trimestre)","src":"sujet_travail_insee_chomage"},{"v":"2,2 millions","l":"salariés du secteur privé ayant bénéficié directement de la hausse du Smic du 1er novembre 2024, soit 12,4 % des salariés du champ étudié","src":"sujet_travail_insee_smic"},{"v":"2 190 €","l":"salaire net médian par mois en équivalent temps plein dans le secteur privé en 2024 (la moitié des salariés gagne moins)","src":"sujet_travail_insee_salaires2024"}],"recent":[{"date":"1er sept. 2026","txt":"Pour les contrats rompus par rupture conventionnelle individuelle à partir du 1er septembre 2026, la durée maximale d'indemnisation est de 15 mois avant 55 ans et de 20,5 mois à partir de 55 ans (avenant n° 2 à la convention d'assurance chômage du 15 novembre 2024).","src":"sujet_travail_unedic_sept2026","iso":"2026-09-01"},{"date":"1er juin 2026","txt":"Le Smic horaire brut passe de 12,02 € à 12,31 € (+2,41 %), une revalorisation automatique car les prix à la consommation ont augmenté d'au moins 2 % (arrêté du 22 mai 2026).","src":"sujet_travail_sp_smic_juin","iso":"2026-06-01"},{"date":"1er avr. 2026","txt":"Les salariés privés d'emploi indemnisés pour la première fois par l'Assurance chômage peuvent y accéder avec 5 mois de travail (108 jours ou 758 heures) dans les 24 ou 36 derniers mois, s'ils n'ont pas été admis à l'allocation chômage (ARE) dans les vingt années précédentes.","src":"sujet_travail_unedic_primo","iso":"2026-04-01"},{"date":"1er janv. 2024","txt":"En application de la loi du 18 décembre 2023 pour le plein emploi, France Travail est progressivement déployé à partir du 1er janvier 2024 pour remplacer Pôle emploi.","src":"sujet_travail_sp_france_travail","iso":"2024-01-01"}],"decide":[{"txt":"Depuis 2010, le Smic est revalorisé chaque année en janvier par décret en Conseil des ministres. Il est aussi relevé automatiquement lorsque les prix à la consommation augmentent d'au moins 2 %, comme au 1er juin 2026 (arrêté du 22 mai 2026).","src":"sujet_travail_insee_smic"},{"txt":"Pour l'assurance chômage, les représentants des employeurs et des salariés négocient les règles d'indemnisation et les taux de cotisation, tous les 2 à 3 ans. Le Premier ministre agrée la convention, ce qui la rend obligatoire ; sans accord, l'État fixe la réglementation par décret.","src":"sujet_travail_unedic_qui_definit"},{"txt":"Le Parlement vote les lois qui fixent les principes fondamentaux du droit du travail, du droit syndical et de la sécurité sociale (article 34 de la Constitution) ; la loi pour le plein emploi de décembre 2023, à l'origine de France Travail, en est un exemple.","src":"sujet_travail_an_domaine_loi"}],"jeunes":[{"txt":"Un apprenti de 18 à 20 ans perçoit au minimum 43 % du Smic la 1re année de contrat (802,82 € brut par mois pour un temps plein), 51 % la 2e année et 67 % la 3e. De 21 à 25 ans, ces taux sont de 53 %, 61 % et 78 %. À partir de 26 ans, c'est 100 % du Smic ou du minimum de la branche s'il est plus élevé.","src":"sujet_travail_sp_apprentissage"},{"txt":"Depuis le 1er avril 2026, une personne indemnisée pour la première fois par l'Assurance chômage peut y accéder avec 5 mois de travail (108 jours ou 758 heures) dans les 24 ou 36 derniers mois, contre 6 mois (130 jours ou 910 heures) en règle générale. La durée d'indemnisation minimale est alors de 5 mois (152 jours).","src":"sujet_travail_unedic_primo","src_plus":["sujet_travail_unedic_duree"]},{"txt":"Le contrat d'engagement jeune s'adresse aux jeunes de 16 à 25 ans inclus (jusqu'à 29 ans inclus pour une personne reconnue travailleur handicapé) qui ne sont ni étudiants ni en formation. L'allocation est de 566,17 € par mois maximum et le programme compte 15 à 20 heures par semaine.","src":"sujet_travail_sp_cej"},{"txt":"Pour la prime d'activité, il faut avoir 18 ans ou plus, avoir une activité professionnelle et percevoir des revenus modestes, et résider en France de manière stable et effective.","src":"sujet_travail_sp_prime_activite"}],"questions":[{"txt":"Comment le Smic doit-il être revalorisé : selon quelles règles et à quel rythme ?","src":"sujet_travail_experts_smic_2024"},{"txt":"Comment concilier hausse du Smic, éventail des salaires et emploi des personnes les plus vulnérables ?","src":"sujet_travail_experts_smic_2024"},{"txt":"Quelle place donner aux allègements de cotisations des employeurs dans le soutien aux bas salaires, au regard de leur coût pour les finances publiques ?","src":"sujet_travail_experts_smic_2024"},{"txt":"Comment assurer l'équilibre financier de l'Assurance chômage : par les règles d'indemnisation, les cotisations ou les prélèvements de l'État ?","src":"sujet_travail_unedic_previsions"}],"lire":["sujet_travail_experts_smic_2024","sujet_travail_unedic_previsions","sujet_travail_insee_salaires2024"]},"social":{"trente":{"txt":"La Sécurité sociale, financée par des cotisations sociales et des impôts comme la CSG, prend en charge 78,7 % des soins et biens médicaux (2024). Les complémentaires santé (12,8 %) et les ménages (7,8 %) paient presque tout le reste. Chaque année, le Parlement vote la loi de financement de la sécurité sociale (LFSS) et ses objectifs de dépenses.","src":["sujet_sante_insee_financement","sujet_sante_insee_protection","sujet_sante_an_fiche54"]},"chiffres":[{"v":"254,8 Md€","l":"dépenses de soins et de biens médicaux en 2024, soit 8,7 % du PIB","src":"sujet_sante_insee_portrait"},{"v":"7,8 %","l":"part des dépenses payée directement par les ménages en 2024 (reste à charge : 19,9 Md€, soit 292 € par habitant)","src":"sujet_sante_insee_portrait"},{"v":"15,9 Md€","l":"déficit de la branche maladie de la Sécurité sociale en 2025","src":"sujet_sante_senat_cf_comptes2025"},{"v":"6,4 millions","l":"d'assurés sans médecin traitant en 2025","src":"sujet_sante_senat_rapport668"},{"v":"1,56 enfant","l":"par femme en 2025 (1,61 en 2024) ; 645 000 naissances en 2025","src":"sujet_sante_insee_bilan_demo"}],"recent":[{"date":"1er oct. 2026","txt":"Le plafond annuel des participations forfaitaires passe de 50 € à 70 €, et celui des franchises médicales aussi, selon l'Assurance Maladie.","src":"sujet_sante_ameli_plafonds","iso":"2026-10-01"},{"date":"1er juil. 2026","txt":"Le congé supplémentaire de naissance est effectif : il dure 1 ou 2 mois au choix, pour la mère, le père ou le conjoint ou la conjointe de la mère, et doit débuter dans les 9 mois suivant la naissance ou l'arrivée de l'enfant au foyer.","src":"sujet_sante_ameli_conge","iso":"2026-07-01"},{"date":"30 déc. 2025","txt":"La loi n° 2025-1403 de financement de la sécurité sociale pour 2026 est promulguée, après son adoption définitive par l'Assemblée nationale le 16 décembre 2025.","src":"sujet_sante_senat_lfss2026","iso":"2025-12-30"},{"date":"27 déc. 2023","txt":"La loi n° 2023-1268 visant à améliorer l'accès aux soins par l'engagement territorial des professionnels est promulguée. Elle modifie l'organisation territoriale de l'offre de soins et comporte des mesures sur les études de santé et les hôpitaux.","src":"sujet_sante_senat_loi2023","iso":"2023-12-27"}],"decide":[{"txt":"Le Parlement vote chaque année la loi de financement de la sécurité sociale (LFSS). Elle détermine les conditions générales de l'équilibre financier de la Sécurité sociale et, compte tenu des prévisions de recettes, fixe ses objectifs de dépenses. Le projet est déposé au plus tard le premier mardi d'octobre.","src":"sujet_sante_an_fiche54"},{"txt":"L'Assurance Maladie est gouvernée par le directeur général de la Cnam, le Conseil de la Cnam et l'Uncam. L'Uncam conduit la politique conventionnelle avec les professionnels de santé, définit le champ des prestations remboursables et fixe le taux de prise en charge des soins. Le directeur général négocie avec l'État une convention d'objectifs et de gestion.","src":"sujet_sante_ameli_gouvernance"},{"txt":"Les agences régionales de santé (ARS) assurent un pilotage unifié de la santé en région (prévention, organisation de l'offre de soins). Ce sont des établissements publics placés sous la tutelle des ministères chargés des affaires sociales et de la santé.","src":"sujet_sante_ars"}],"jeunes":[{"txt":"Contraception et préservatifs : pour les moins de 26 ans, la contraception et le suivi sont gratuits pour les filles (consultation, certaines méthodes comme les pilules de 1re ou 2e génération, le stérilet ou le diaphragme ; l'implant est pris en charge à 100 % de 18 ans à moins de 26 ans). Certains préservatifs, masculins et féminins, sont pris en charge à 100 % en pharmacie, sans ordonnance, pour toute personne de moins de 26 ans (marques listées par l'Assurance Maladie).","src":"sujet_sante_ameli_contraception"},{"txt":"Mon soutien psy : à partir de 3 ans, jusqu'à 12 séances par an chez un psychologue conventionné, en cas de souffrance psychique d'intensité légère à modérée. Le tarif est de 50 € par séance et l'Assurance Maladie en rembourse 60 %. Consulter un médecin avant le premier rendez-vous n'est plus obligatoire.","src":"sujet_sante_ameli_soutienpsy"},{"txt":"Mon bilan prévention : entre 18 et 25 ans, un rendez-vous de 30 à 45 minutes avec le professionnel de santé de son choix (médecin, sage-femme, infirmier, pharmacien ou masseur-kinésithérapeute), pris en charge à 100 % par l'Assurance Maladie, sans avance de frais.","src":"sujet_sante_ameli_bilanprev"},{"txt":"Complémentaire santé solidaire (C2S) : il faut être pris en charge par l'Assurance Maladie et avoir des ressources sous un plafond. Pour une personne seule en France métropolitaine, au 1er avri
