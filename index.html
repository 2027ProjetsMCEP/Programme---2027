tution. Elle programme les moyens du ministère sur la période 2023-2027.","src":"sujet_securite_senat_lopmi","iso":"2023-01-24"}],"decide":[{"txt":"Le Parlement vote la loi pénale : selon l'article 34 de la Constitution, la loi fixe les règles concernant la détermination des crimes et délits ainsi que les peines qui leur sont applicables, et la procédure pénale. Le Gouvernement détermine et conduit la politique de la nation et dispose de l'administration (article 20).","src":"sujet_securite_cc_constitution"},{"txt":"Le préfet de département a la charge de l'ordre public et de la sécurité des populations ; il dirige l'action des services de la police nationale et des unités de la gendarmerie nationale en matière d'ordre public et de police administrative.","src":"sujet_securite_gendarmerie_organisation"},{"txt":"Le Président de la République est garant de l'indépendance de l'autorité judiciaire (article 64). Avant leur promulgation, les lois peuvent être déférées au Conseil constitutionnel, qui se prononce sur leur conformité à la Constitution (article 61).","src":"sujet_securite_cc_constitution"}],"jeunes":[{"txt":"Garde à vue : sa durée est de 24 heures, mais elle peut être abrégée ou prolongée, et l'infraction reprochée doit être un crime ou un délit puni d'une peine d'emprisonnement. La personne gardée à vue peut solliciter l'aide d'un avocat dès le début et à tout moment, demander à être examinée par un médecin, faire prévenir son employeur, un proche ou toute personne de son choix, et a le droit de faire des déclarations, de répondre aux questions ou de se taire.","src":"sujet_securite_sp_gav"},{"txt":"Plainte en ligne : depuis le 15 octobre 2024, ce service permet de déposer plainte de façon entièrement dématérialisée pour les vols, cambriolages, abus de confiance, dégradations, infractions concernant le dépôt sauvage ou la collecte des ordures, et escroqueries. Il faut s'identifier avec FranceConnect (identifiants impots.gouv.fr, ameli.fr ou identité numérique La Poste) ; l'autre option est de prendre rendez-vous dans un commissariat ou une gendarmerie avec une pièce d'identité.","src":"sujet_securite_sp_plainte"},{"txt":"Bulletin n° 3 du casier judiciaire : il peut être délivré quelle que soit la nationalité. La demande se fait par le téléservice du ministère de la justice et elle est gratuite ; le délai va d'une heure à 24 heures en cas de transmission via FranceConnect ou par mail.","src":"sujet_securite_sp_casier"}],"questions":[{"txt":"Comment concilier le nombre de places en détention, le recours à l'emprisonnement et les conditions de vie en prison ?","src":"sujet_securite_cglpl_ra2025"},{"txt":"Quelle organisation et quels moyens d'enquête pour lutter contre le trafic de stupéfiants, et avec quelles garanties pour les libertés individuelles ?","src":"sujet_securite_senat_ce_narcotrafic"},{"txt":"Comment réduire le délai de jugement des affaires pénales tout en préservant les droits de la défense et ceux des victimes ?","src":"sujet_securite_justice_audiencement"},{"txt":"Comment répartir les emplois supplémentaires de la Justice entre l'administration pénitentiaire, les services judiciaires et les autres services ?","src":"sujet_securite_senat_justice_plf2026"}],"lire":["sujet_securite_cglpl_ra2025","sujet_securite_senat_ce_narcotrafic","sujet_securite_justice_audiencement"]},"immigration":{"trente":{"txt":"En 2025, 377 000 premiers titres de séjour ont été délivrés et l'Ofpra a enregistré 145 210 demandes de protection internationale. L'Insee compte 8,0 millions d'immigrés en 2025, soit 11,6 % de la population. Depuis le 12 juin 2026, les règles européennes du pacte sur la migration et l'asile s'appliquent.","src":["sujet_immigration_dgef_titres2025","sujet_immigration_ofpra_bilan2025","sujet_immigration_insee_immigres","sujet_immigration_consilium_pacte"]},"chiffres":[{"v":"377 000","l":"premiers titres de séjour délivrés à des étrangers majeurs en 2025, soit 9,2 % de plus qu'en 2024 (données provisoires) : 116 835 pour études, 90 959 familiaux, 88 001 humanitaires, 50 848 économiques et 30 819 divers","src":"sujet_immigration_dgef_titres2025"},{"v":"145 210","l":"demandes de protection internationale enregistrées par l'Ofpra en 2025, soit 5,5 % de moins qu'en 2024 ; le taux de protection de l'Ofpra est de 41,2 % en 2025 (+2,4 points)","src":"sujet_immigration_ofpra_bilan2025"},{"v":"98 139","l":"personnes ont acquis la nationalité française en 2025 (-5,3 % par rapport à 2024), dont 42 246 par décret (-13,5 %) et 17 579 à raison du mariage (+10,5 %)","src":"sujet_immigration_dgef_nationalite2025"},{"v":"8,0 millions","l":"d'immigrés (personnes nées étrangères à l'étranger et résidant en France) vivent en France en 2025, soit 11,6 % de la population totale ; la population étrangère compte 6,3 millions de personnes (9,1 %)","src":"sujet_immigration_insee_immigres"},{"v":"23 549","l":"éloignements d'étrangers en situation irrégulière mis en œuvre en 2025, soit 11,1 % de plus qu'en 2024 (données provisoires) : 14 133 forcés, 4 564 aidés et 4 852 spontanés","src":"sujet_immigration_dgef_eloignements2025"},{"v":"7 426","l":"obligations de quitter le territoire français (OQTF) exécutées pour 69 888 prononcées au premier semestre 2025, d'après la DGEF citée par le Sénat","src":"sujet_immigration_senat_plf2026_immigration"}],"recent":[{"date":"12 juin 2026","txt":"Les règles du pacte sur la migration et l'asile de l'Union européenne, adopté par le Conseil de l'Union européenne le 14 mai 2024, entrent en application.","src":"sujet_immigration_consilium_pacte","iso":"2026-06-12"},{"date":"20 mai 2026","txt":"Le Sénat adopte en première lecture le projet de loi « Mise en oeuvre du Pacte sur la migration et l'asile », qui habilite le Gouvernement à prendre par ordonnances les adaptations rendues nécessaires par l'entrée en application de règlements européens. Ce texte est encore un projet : au 18 septembre 2026, date de la dernière mise à jour de la page du Sénat, il n'était ni promulgué ni transmis au Conseil constitutionnel.","src":"sujet_immigration_senat_pacte_pjl","iso":"2026-05-20"},{"date":"11 août 2025","txt":"La loi n° 2025-796 visant à faciliter le maintien en rétention des personnes condamnées pour des faits d'une particulière gravité et présentant de forts risques de récidive est promulguée, après la décision n° 2025-895 DC du Conseil constitutionnel du 7 août 2025, qui l'a jugée partiellement conforme à la Constitution.","src":"sujet_immigration_senat_retention2025","iso":"2025-08-11"},{"date":"26 janv. 2024","txt":"La loi n° 2024-42 pour contrôler l'immigration, améliorer l'intégration est promulguée (Journal officiel du 27 janvier 2024), après l'accord de la commission mixte paritaire du 19 décembre 2023. Le Conseil constitutionnel, par sa décision n° 2023-863 DC du 25 janvier 2024, l'a jugée partiellement conforme à la Constitution.","src":"sujet_immigration_senat_loi2024","iso":"2024-01-26"}],"decide":[{"txt":"La loi fixe les règles concernant la nationalité (article 34 de la Constitution) ; avant sa promulgation, une loi peut être déférée au Conseil constitutionnel, qui se prononce sur sa conformité à la Constitution (article 61).","src":"sujet_immigration_cc_constitution"},{"txt":"Le ministère de l'Intérieur indique que le préfet de département applique les règles relatives à l'entrée et au séjour des étrangers.","src":"sujet_immigration_interieur_prefectures"},{"txt":"En matière d'asile, la préfecture doit enregistrer la demande dans un délai de 3 jours ouvrés, l'Ofpra l'étudie d'abord dans le cadre du statut de réfugié, et un recours est possible devant la CNDA dans le délai d'un mois suivant la notification de la décision.","src":"sujet_immigration_sp_asile"},{"txt":"Au niveau européen, le pacte sur la migration et l'asile, adopté par le Conseil de l'Union européenne le 14 mai 2024, couvre notamment le filtrage, une procédure commune d'asile, les conditions d'accueil et la base de données Eurodac ; ses règles s'appliquent depuis le 12 juin 2026.","src":"sujet_immigration_consilium_pacte"}],"jeunes":[{"txt":"Nationalité française à 18 ans pour un jeune né en France de parents étrangers : il faut résider en France à 18 ans et y avoir eu sa résidence habituelle pendant une période continue ou discontinue de 5 ans ou plus depuis l'âge de 11 ans. L'acquisition est automatique : aucune démarche n'est à faire. D'autres conditions existent (voir la fiche).","src":"sujet_immigration_sp_nationalite18"},{"txt":"Étudiant étranger : le visa de long séjour valant titre de séjour (VLS-TS) est délivré pour une durée de 4 mois à 1 an et doit être validé dans les 3 mois suivant l'arrivée en France. Il faut être inscrit (ou préinscrit) dans un établissement d'enseignement supérieur ou de formation initiale et justifier de ressources au moins égales à 877,5 euros par mois. Après 1 an de séjour, on peut demander une carte de séjour temporaire étudiant (valable 1 an) ou pluriannuelle étudiant.","src":"sujet_immigration_sp_etudiant"}],"questions":[{"txt":"Comment réduire la durée de la procédure d'asile et le coût de l'accueil des demandeurs d'asile, tout en garantissant l'examen de chaque demande ?","src":"sujet_immigration_senat_asile_couts"},{"txt":"Comment améliorer l'exécution des obligations de quitter le territoire français, dans le respect des droits des personnes concernées ?","src":"sujet_immigration_senat_plf2026_immigration"},{"txt":"Comment adapter le droit français aux règles du pacte européen sur la migration et l'asile, entrées en application le 12 juin 2026 ?","src":"sujet_immigration_senat_affeur_pacte"}],"lire":["sujet_immigration_senat_asile_couts","sujet_immigration_senat_plf2026_immigration","sujet_immigration_senat_affeur_pacte"]},"institutions":{"trente":{"txt":"Les institutions françaises reposent sur la Constitution du 4 octobre 1958 : les députés sont élus au suffrage direct, les sénateurs au suffrage indirect. Le Conseil constitutionnel veille à la régularité de l'élection du Président de la République, prévue les 18 avril et 2 mai 2027. Depuis la dissolution de juin 2024, plusieurs Premiers ministres se sont succédé.","src":["sujet_institutions_cc_constitution","sujet_institutions_info_pdr2027","sujet_institutions_info_dissolution"]},"chiffres":[{"v":"73,69 %","l":"de participation au 1er tour de la présidentielle du 10 avril 2022 (71,99 % au 2nd tour, le 24 avril 2022)","src":"sujet_institutions_int_pdr2022"},{"v":"66,71 %","l":"de participation au 1er tour des législatives anticipées du 30 juin 2024 (66,63 % au 2nd tour, le 7 juillet 2024)","src":"sujet_institutions_int_leg2024"},{"v":"67,2 %","l":"des inscrits de 18 à 29 ans ont voté au 1er tour de la présidentielle de 2022, contre 77,0 % des 65 ans ou plus (Insee, novembre 2022)","src":"sujet_institutions_insee_ip1929"},{"v":"577 et 348","l":"députés et sénateurs au plus : maximum fixé par l'article 24 de la Constitution (texte à jour de la révision du 8 mars 2024)","src":"sujet_institutions_cc_constitution"},{"v":"9","l":"référendums nationaux organisés depuis 1958 sur le fondement des articles 11 et 89 de la Constitution, le dernier le 29 mai 2005 (page du Conseil constitutionnel de 2020)","src":"sujet_institutions_cc_referendums"},{"v":"1,5 million","l":"de jeunes nés entre 2006 et début 2008 inscrits d'office sur les listes électorales en 2026 (50,4 millions de personnes inscrites au total, mars 2026)","src":"sujet_institutions_insee_focus378"}],"recent":[{"date":"19 janv. 2026","txt":"Le Premier ministre annonce qu'il engagera le lendemain la responsabilité du Gouvernement (article 49.3 de la Constitution) sur la partie recettes du projet de loi de finances pour 2026. Le texte est alors réputé adopté sans vote, sauf si une motion de censure est déposée dans les 24 heures.","src":"sujet_institutions_info_budget493","iso":"2026-01-19"},{"date":"10 oct. 2025","txt":"Le Président de la République nomme Sébastien Lecornu Premier ministre et le charge de former un Gouvernement ; une première nomination avait eu lieu le 9 septembre 2025, date de fin de fonctions de François Bayrou (en poste du 13 décembre 2024 au 9 septembre 2025, selon info.gouv.fr). Michel Barnier avait été nommé Premier ministre le 5 septembre 2024.","src":"sujet_institutions_elysee_lecornu_oct","iso":"2025-10-10"},{"date":"7 août 2025","txt":"Le Conseil constitutionnel déclare conformes à la Constitution les dispositions déférées de la loi visant à réformer le mode d'élection des membres du conseil de Paris et des conseils municipaux de Lyon et Marseille. Selon info.gouv.fr, les municipales des 15 et 22 mars 2026 à Paris, Lyon et Marseille comportent un double scrutin distinct : un pour élire les conseillers d'arrondissement ou de secteur, l'autre pour choisir directement les représentants des mairies centrales.","src":"sujet_institutions_cc_2025892dc","iso":"2025-08-07"},{"date":"9 juin 2024","txt":"Le chef de l'État annonce la dissolution de l'Assemblée nationale (décret publié au Journal officiel le 10 juin). Les élections législatives anticipées ont lieu les 30 juin et 7 juillet 2024.","src":"sujet_institutions_info_dissolution","iso":"2024-06-09"}],"decide":[{"txt":"Pour réviser la Constitution (article 89), l'initiative appartient au Président de la République, sur proposition du Premier ministre, et aux membres du Parlement. Le texte doit être voté par les deux assemblées en termes identiques, puis approuvé par référendum ; le Président peut aussi le soumettre au Parlement réuni en Congrès, où il faut alors la majorité des trois cinquièmes des suffrages exprimés.","src":"sujet_institutions_cc_constitution"},{"txt":"Le Président de la République peut soumettre au référendum certains projets de loi (article 11) : sur l'organisation des pouvoirs publics, sur des réformes de la politique économique, sociale ou environnementale, ou pour ratifier certains traités. Il le fait sur proposition du Gouvernement pendant les sessions ou sur proposition conjointe des deux assemblées ; un référendum peut aussi être organisé à l'initiative d'un cinquième des parlementaires, soutenue par un dixième des électeurs inscrits.","src":"sujet_institutions_cc_constitution"},{"txt":"Le Conseil constitutionnel compte neuf membres, dont le mandat dure neuf ans et n'est pas renouvelable. Il veille à la régularité de l'élection du Président de la République (article 58) et se prononce sur la conformité à la Constitution des lois organiques avant leur promulgation ; les lois peuvent aussi lui être déférées (article 61).","src":"sujet_institutions_cc_constitution"}],"jeunes":[{"txt":"Un jeune de nationalité française qui a fait son recensement citoyen à 16 ans est inscrit automatiquement sur la liste électorale à 18 ans, dans la commune où il l'a fait. Sinon, il faut s'inscrire (en ligne, en mairie ou par courrier) avec un justificatif d'identité et un justificatif de domicile de moins de 3 mois. Pour voter à un scrutin donné, la demande par courrier doit arriver au plus tard le 6e vendredi avant le 1er tour.","src":"sujet_institutions_sp_inscription"},{"txt":"La majorité civile, fixée à 18 ans, ouvre le droit de se porter candidat à l'élection présidentielle et aux élections législatives. Pour être sénateur, l'âge minimum est de 24 ans (article L.O. 296 du code électoral) ; une proposition de loi déposée au Sénat en septembre 2026 propose de le ramener à 18 ans, mais ce n'est à ce stade qu'une proposition.","src":"sujet_institutions_senat_ppl948"},{"txt":"Présidentielle 2027 : 1er tour le dimanche 18 avril, 2nd tour le dimanche 2 mai 2027. Pour voter, il faut être inscrit sur les listes électorales. Pour être candidat, il faut obtenir la signature de 500 élus habilités, représentant au moins 30 départements ou collectivités d'outre-mer différents.","src":"sujet_institutions_info_pdr2027"}],"questions":[{"txt":"Comment répartir les prérogatives entre le chef de l'État et le chef du Gouvernement ?","src":"sujet_institutions_senat_r414"},{"txt":"Faut-il faciliter le déclenchement du référendum d'initiative partagée, et à quelles conditions ?","src":"sujet_institutions_senat_r99"},{"txt":"Comment encourager les jeunes à voter et à s'engager dans la vie démocratique ?","src":"sujet_institutions_senat_r648"},{"txt":"Comment organiser l'élection présidentielle pour en garantir la régularité : transmission électronique des parrainages, date limite des procurations, publicité du dépouillement ?","src":"sujet_institutions_cc_pdr2022obs"}],"lire":["sujet_institutions_senat_r414","sujet_institutions_cc_pdr2022obs","sujet_institutions_senat_r648"]},"europe":{"trente":{"txt":"Le Président de la République est le chef des armées ; le Parlement vote les lois de programmation militaire et les lois de finances. La loi du 16 août 2026 actualise la programmation militaire 2024-2030. L'OTAN compte 32 membres, engagés en 2025 à investir 5 % du PIB dans la défense et la sécurité d'ici 2035.","src":["sujet_europe_cc_constitution","sujet_europe_senat_loi_lpm","sujet_europe_nato_members","sujet_europe_nato_hague"]},"chiffres":[{"v":"56,9 Md€","l":"de crédits pour la mission Défense hors pensions en 2026 (loi de finances initiale) ; 68,3 Md€ pour l'ensemble du ministère, pensions incluses","src":"sujet_europe_def_chiffres2026"},{"v":"436 Md€","l":"de crédits budgétaires courants pour la mission Défense sur 2024-2030 selon la loi du 16 août 2026 actualisant la programmation militaire, avec 36 Md€ de ressources supplémentaires sur 2026-2030","src":"sujet_europe_senat_loi_lpm"},{"v":"28,8 Md€","l":"de prélèvement sur recettes au profit de l'Union européenne évalué pour 2026 par le projet de loi de finances (+24,6 % par rapport à la prévision d'exécution 2025)","src":"sujet_europe_senat_psr"},{"v":"5 % du PIB","l":"d'ici 2035 : engagement des Alliés de l'OTAN au sommet de La Haye en juin 2025, dont au moins 3,5 % pour les besoins de défense de base et jusqu'à 1,5 % pour des dépenses liées à la sécurité (infrastructures critiques, réseaux, résilience civile)","src":"sujet_europe_nato_hague"},{"v":"201 016","l":"militaires du ministère (équivalents temps plein travaillés) au 31 décembre 2025, sur 264 720 personnels civils et militaires ; 49 290 réservistes sous contrat","src":"sujet_europe_def_chiffres2026"},{"v":"51,49 %","l":"de participation en France aux élections européennes de juin 2024 (50,74 % dans l'ensemble de l'Union européenne)","src":"sujet_europe_ep_results"}],"recent":[{"date":"16 août 2026","txt":"La loi actualisant la programmation militaire pour les années 2024 à 2030 est promulguée (loi n° 2026-791). Elle porte à 436 milliards d'euros courants les crédits de la mission Défense sur la période, avec 36 milliards de ressources supplémentaires sur 2026-2030. Le Parlement l'avait définitivement adoptée le 1er juillet 2026 et le Conseil constitutionnel l'a déclarée conforme à la Constitution le 6 août 2026.","src":"sujet_europe_senat_loi_lpm","iso":"2026-08-16"},{"date":"23 avr. 2026","txt":"Le Conseil de l'Union européenne finalise un prêt de 90 milliards d'euros à l'Ukraine pour 2026 et 2027, financé par de l'emprunt de l'UE sur les marchés de capitaux et garanti par la marge du budget de l'UE : 30 milliards pour le soutien macroéconomique, 60 milliards pour les capacités industrielles de défense de l'Ukraine.","src":"sujet_europe_consilium_ukraine","iso":"2026-04-23"},{"date":"27 mai 2025","txt":"Le Conseil de l'Union européenne adopte SAFE (Security Action for Europe), un instrument de prêts allant jusqu'à 150 milliards d'euros pour financer des investissements de défense des États membres. En principe, les États bénéficiaires doivent mener des achats communs impliquant au moins deux pays participants.","src":"sujet_europe_consilium_safe","iso":"2025-05-27"},{"date":"7 mars 2024","txt":"La Suède devient le 32e membre de l'OTAN, après la Finlande, 31e membre depuis le 4 avril 2023.","src":"sujet_europe_nato_members","iso":"2024-03-07"}],"decide":[{"txt":"Le Président de la République est le chef des armées (article 15 de la Constitution) et le Premier ministre est responsable de la défense nationale (article 21). Le Parlement vote les lois de programmation, qui déterminent les objectifs de l'action de l'État (article 34), et les lois de finances, qui déterminent les ressources et les charges de l'État. La déclaration de guerre est autorisée par le Parlement ; le Gouvernement l'informe de toute intervention des forces armées à l'étranger au plus tard trois jours après son début et, au-delà de quatre mois, en soumet la prolongation à son autorisation (article 35).","src":"sujet_europe_cc_constitution"},{"txt":"La programmation militaire est fixée par une loi : celle qui actualise la LPM 2024-2030 a été adoptée par le Sénat (texte de compromis du 30 juin 2026) puis par l'Assemblée nationale (1er juillet 2026), déclarée conforme à la Constitution par le Conseil constitutionnel le 6 août 2026 et promulguée le 16 août 2026.","src":"sujet_europe_senat_loi_lpm"},{"txt":"Au niveau de l'Union européenne, le Conseil vote à l'unanimité sur la politique étrangère et de sécurité commune, sauf dans certains cas précis où la majorité qualifiée s'applique. Avec l'unanimité, l'abstention d'un État n'empêche pas l'adoption d'une décision.","src":"sujet_europe_consilium_unanimity"}],"jeunes":[{"txt":"Dès 16 ans, chaque Français doit faire son recensement citoyen. Il est ensuite convoqué automatiquement à la journée défense et citoyenneté (JDC), qu'il doit faire avant 25 ans ; service-public.gouv.fr l'appelle désormais « journée de mobilisation (ex-JDC) » et indique que les jeunes y sont convoqués pendant l'année de leurs 17 ans. Le certificat de participation est demandé pour s'inscrire au permis de conduire (de 17 à 24 ans) et aux examens et concours comme le bac ou les concours administratifs (de 18 à 24 ans) ; à partir de 25 ans, aucun justificatif n'est exigé.","src":"sujet_europe_sp_jdc"},{"txt":"Le nouveau service national est volontaire et ouvert aux Français de 18 à 25 ans, avec ou sans diplôme. Il dure 10 mois (1 mois de formation initiale et 9 mois en unité), avec une solde d'au moins 800 euros brut par mois ; il est mis en place progressivement à partir de septembre 2026. Service-public.gouv.fr précise que ce service national, exclusivement militaire, est voué à remplacer le service national universel (SNU).","src":"sujet_europe_info_servicenational"},{"txt":"Pour devenir réserviste opérationnel dans les armées, il faut être français, avoir 17 ans minimum (limite d'âge : 72 ans), être apte médicalement et avoir accompli la journée de mobilisation (ex-JDC) ou le service militaire. Le contrat d'engagement dure de 1 à 5 ans, pour 5 à 120 jours d'activité par année civile.","src":"sujet_europe_sp_reserve"},{"txt":"DiscoverEU : les jeunes de 18 ans nés en 2008, citoyens d'un État membre de l'UE ou d'un pays associé à Erasmus+, peuvent candidater (candidatures ouvertes le 1er octobre 2026, jusqu'au 15 octobre) à un pass ferroviaire gratuit valable jusqu'à 30 jours entre mars 2027 et mai 2028 (près de 41 000 titres).","src":"sujet_europe_ec_discovereu"}],"questions":[{"txt":"Quel effort de défense la France peut-elle financer compte tenu de l'état de ses finances publiques ?","src":"sujet_europe_senat_avis654"},{"txt":"Quelle part de l'effort de défense doit être financée et organisée en commun au niveau européen, et quelle part doit rester nationale ?","src":"sujet_europe_ec_white"},{"txt":"Dans quels domaines l'Union européenne devrait-elle passer de l'unanimité à la majorité qualifiée, notamment avant un nouvel élargissement ?","src":"sujet_europe_ec_enlargement"},{"txt":"Quelle place donner aux jeunes dans la défense nationale : journée de mobilisation, service national volontaire, réserve ?","src":"sujet_europe_senat_r666"}],"lire":["sujet_europe_senat_avis654","sujet_europe_senat_r666","sujet_europe_ec_enlargement"]}}}</script>

const svg = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">${ICONS[k] || ""}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"/></svg>';
const EXT = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M14 5h5v5M19 5l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>';
const ARW = '<svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const isoDay = d => /^\d{4}-\d{2}-\d{2}$/.test(d);
const fmtD = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });
const fmtDM = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
const fmtM = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" });
const dt = d => new Date(d + "T12:00:00");
function fmtDate(d, short) {
  if (isoDay(d)) return (short && d.slice(0, 4) === new Date().getFullYear().toString() ? fmtDM : fmtD).format(dt(d));
  if (/^\d{4}-\d{2}$/.test(d)) return fmtM.format(dt(d + "-15"));

}
const nf1 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const md = v => nf1.format(v) + " milliard" + (v >= 2 ? "s" : "") + " d'euros";
const daysTo = d => Math.max(0, Math.ceil((new Date(d + "T08:00:00") - new Date()) / 86400000));
const daysSince = d => Math.floor((new Date() - dt(d)) / 86400000);
const ext = (u, label) => `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`;
const KIND = { officiel: "document du candidat", presse: "média", analyse: "comparateur", donnees: "source officielle", sondage: "institut de sondage" };

function prep() {
  CAND = Object.fromEntries(DATA.candidats.map(c => [c.id, c]));

  THEME_NAME = Object.fromEntries(DATA.themes);
}
const candSorted = () => DATA.candidats.slice().sort((a, b) => a.tri.localeCompare(b.tri, "fr"));
const propsOf = id => DATA.propositions.filter(p => p.c === id);
const nom = id => CAND[id] ? CAND[id].nom : id;
function initials(c) { const t = c.tri.split(" "); return t.length > 1 ? t.map(w => w[0].toUpperCase()).join("") : t[0][0].toUpperCase() + t[0][1].toLowerCase(); }
/* Photo ronde, même cadrage pour tous ; initiales quand aucune photo libre de droits n'existe */
function mono(id, size = "") {
  const c = CAND[id];
  if (c && c.photo) { const big = size === "l", px = big ? 92 : size === "s" ? 30 : 40; return `<img class="mono ${size}" src="photos/${c.id}${big ? "" : "-96"}.jpg" alt="" width="${px}" height="${px}" loading="${big ? "eager" : "lazy"}" decoding="async">`; }
  return `<span class="mono ${size}" aria-hidden="true">${c ? initials(c) : "·"}</span>`;
}
const photoCredit = c => c.photo
  ? `Photo : ${esc(c.photo.a)}, ${esc(c.photo.y)} · ${ext(c.photo.lu, esc(c.photo.l))} · ${ext(c.photo.u, "Wikimedia Commons")} · recadrée`
  : "Pas de photo libre de droits trouvée pour l'instant : l'appli n'utilise que des photos dont la licence autorise la réutilisation.";
/* « À confirmer » : la proposition ne repose que sur un comparateur, pas encore sur un document du candidat ou un média */
const onlyAnalyse = p => allSrc(p).every(s => SRC[s] && SRC[s].type === "analyse");
const allSrc = p => p.s.concat((p.plus && p.plus.src) || []).filter((s, i, a) => SRC[s] && a.indexOf(s) === i);
const tbc = p => onlyAnalyse(p) ? `<span class="tbc" title="Seule source trouvée : un comparateur. La proposition reste à confirmer sur un document du candidat ou dans un média.">À confirmer</span>` : "";
const statut = c => `<span class="pill st-${c.statut}">${esc(DATA.statuts[c.statut])}</span>`;
const isNew = p => p.aj > DATA.base && daysSince(p.aj) <= 10;
/* Date d'annonce : la plus ancienne source datée (articles, ou documents publiés à une date précise), hors pages simplement consultées le jour de la mise à jour */
const pDate = p => p.s.map(s => SRC[s]).filter(s => isoDay(s.d) && s.type !== "analyse" && (s.type === "presse" || s.d !== DATA.base)).map(s => s.d).sort()[0] || null;

function amount(a) {
  if (!a) return "";
  const lab = a.lab || { cout: "Coût annoncé", economie: "Économie annoncée", neutre: "Présenté comme neutre", dette: "Montant concerné" }[a.nature];
  const per = a.per === "an" ? " par an" : "";
  const share = v => { const x = v / DATA.reperes.depenses.v * 100; return x < 0.1 ? "moins de 0,1 %" : (x < 1 ? new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 }).format(x) : nf1.format(x)) + " %"; };
  const hab = a.per === "an" ? `<span>soit environ ${nf0.format(a.v * 1e9 / (DATA.reperes.population * 1e6))} € par habitant et ${share(a.v)} des dépenses publiques</span>` : (a.nature === "dette" || a.per === "total" ? `<span>${esc(a.h)}</span>` : "");
  return `<span class="amt ${a.nature}">${lab} : ${md(a.v)}${per}${hab}</span>`;
}
function srcLine(ids) {
  return ids.map(id => { const s = SRC[id]; return `${ext(s.u, esc(s.p))} · ${KIND[s.type]} · ${esc(fmtDate(s.d, true))}`; }).join("<br>");
}
const FIN_HELP = {
  f: "Le candidat donne le coût et dit comment il le finance.",

};
function finLabel(p) { if (p.fin === "c" && p.a && p.a.nature === "economie") return "Économie chiffrée"; return { f: "Chiffrée et financée", c: "Chiffrée, financement non trouvé", n: "Aucun chiffrage trouvé", s: "Sans dépense directe" }[p.fin] || ""; }
const finBadge = p => p.fin ? `<span class="fin fin-${p.fin}" title="${esc(FIN_HELP[p.fin])}">${esc(finLabel(p))}</span>` : "";

}

/* ---------- graphiques ---------- */
function pollBars(sd, opts = {}) {
  const rows = Object.entries(sd.scores).map(([id, v]) => [nom(id), v, id]).concat((sd.autres || []).map(([n, v]) => [n, v, null])).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "fr"));
  const list = opts.limit ? rows.slice(0, opts.limit) : rows;
  const max = Math.max(40, Math.ceil(rows[0][1] / 10) * 10);
  return `<div class="poll">${list.map(([n, v, id]) => {
    const e = 196 * Math.sqrt((v / 100) * (1 - v / 100) / sd.n);
    return `<div class="poll-row">${id ? `<a class="n" href="#c-${id}">${esc(n)}</a>` : `<span class="n">${esc(n)}</span>`}<span class="track"><span class="fill" style="width:${v / max * 100}%"></span>${opts.moe ? `<span class="moe" style="left:${Math.max(0, v - e) / max * 100}%;width:${2 * e / max * 100}%"></span>` : ""}</span><span class="v">${nf1.format(v)} %</span></div>`;
  }).join("")}</div>`;
}
function axis(cfg) {
  const pos = v => (v - cfg.min) / (cfg.max - cfg.min) * 100;
  const rows = cfg.rows.slice().sort((a, b) => CAND[a.c].tri.localeCompare(CAND[b.c].tri, "fr")).map(r => {
    const p = pos(r.v), main = r.label || nf0.format(r.v) + " " + cfg.unite;
    const hasAlt = r.alt != null, pa = hasAlt ? pos(r.alt) : p;
    const lo = Math.min(p, pa), hi = Math.max(p, pa);
    const text = hasAlt ? main + ", " + r.altLabel : main;
    const lab = lo < 50 ? `<span class="lb" style="left:${lo}%;transform:translate(${lo < 6 ? "-4px" : "-7px"}, 10px)">${esc(text)}</span>` : `<span class="lb" style="left:${hi}%;transform:translate(calc(-100% + 7px), 10px)">${esc(text)}</span>`;
    const range = hasAlt ? `<span class="rng" style="left:${lo}%;width:${hi - lo}%"></span><span class="pt alt" style="left:${pa}%"></span>` : "";
    return `<div class="axis-row"><a class="who" href="#c-${r.c}">${esc(CAND[r.c].tri)}</a><div class="axis-track" title="${esc(CAND[r.c].nom)} : ${esc(text)} (source : ${esc(SRC[r.s].p)})">${range}<span class="pt${r.hollow ? " alt" : ""}" style="left:${p}%"></span>${lab}</div></div>`;
  }).join("");
  return `<div class="axis">${rows}<div class="axis-scale"><span></span><div class="ticks">${cfg.ticks.map(t => `<span style="left:${pos(t)}%">${nf0.format(t)}</span>`).join("")}</div></div></div>`;
}

const ui = { actuC: "tous", cmpMode: "tous", cmpA: null, cmpB: null, cmpTh: "tous", feed: null, feedTh: "tous", srcG: "tous" };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

}

/* Références numérotées : chaque phrase porte un petit numéro, la liste des sources suit (même rendu partout) */
function refBox() {

  return { ref, list };
}
const KIT_ICO = {

const STACK_COL = ["#7D98FF", "#4CD0C9", "#F2C063", "#FF5C70", "#B79CFF", "#5FD39A", "#AAB3CC", "#8EA6FF", "#3a9e99", "#c9a04f"];

/* Accueil : la boîte à outils, le budget, les grands sujets, puis l'actu */

/* Actu : seulement la presse, sans les articles sur les sondages */
function screenActu(inHome) {
  const all = DATA.presse.filter(p => p.k !== "sondage");
  const cands = candSorted().filter(c => all.some(p => p.c.includes(c.id)));
  if (ui.actuC !== "tous" && !cands.some(c => c.id === ui.actuC)) ui.actuC = "tous";
  const list = all.filter(p => ui.actuC === "tous" || p.c.includes(ui.actuC)).sort((a, b) => b.d.localeCompare(a.d));
  const days = [];
  list.forEach(p => { const last = days[days.length - 1]; if (last && last.d === p.d) last.items.push(p); else days.push({ d: p.d, items: [p] }); });
  return `
  <div class="${inHome ? "sec-h col" : "page-h"}"><${inHome ? "h2" : "h1"}>L'actu de la campagne</${inHome ? "h2" : "h1"}><p class="lead">Les articles de presse sur les candidats et la campagne, du plus récent au plus ancien. À partir du dimanche 11 octobre, « L'essentiel de la semaine » résumera chaque dimanche les 10 infos à retenir.</p></div>

function screenKit(id) {
  const kit = DATA.kit || [], f = kit.find(x => x.id === id); if (!f) return screenAccueil();
  const R = refBox();
  return `
  <div class="page-h"><span class="kick">${kico(f.id, 16)} Avant de voter</span><h1>${esc(f.titre)}</h1><p class="lead">${esc(f.en_bref)}</p></div>

}

function screenBudget() {
  const B = DATA.budget, R = DATA.reperes; if (!B) return screenAccueil();
  const D = B.dep, E = B.rec, X = refBox();

  <section class="card">

    <div class="figs"><div><b>${md1(E.total)}</b><span>de recettes en ${esc(E.annee)} : impôts, cotisations…${X.ref(E.src[0])}</span></div><div><b>${md1(R.deficit.v)}</b><span>de déficit ${esc(R.deficit.quand)}, ${esc(R.deficit.pct)}${X.ref(R.deficit.s)}</span></div></div>

    <div class="bars">${D.postes.map(x => `<div class="bar-r"><span class="l">${esc(x.l)}</span><span class="tr"><i style="width:${x.pct / maxD * 100}%"></i></span><span class="v">${nf0.format(x.pct)} %</span>${x.dont ? `<span class="dont">dont ${x.dont.map(([l, v]) => `${esc(l.toLowerCase())} ${md1(v)}`).join(", ")}</span>` : ""}</div>`).join("")}</div>
    <p class="small">Le détail par poste vient de l'Office statistique de l'Union européenne, qui reprend les comptes de l'Insee.${X.ref(D.src[1])}</p>
  </section>

    <div class="bars">${E.blocs.map(([l, v]) => `<div class="bar-r in"><span class="l">${esc(l)}</span><span class="tr"><i style="width:${v / maxE * 100}%"></i></span><span class="v">${nf0.format(v / E.total * 100)} %</span></div>`).join("")}</div>
    <h3 class="sub">Les principaux impôts et cotisations</h3>

    <p class="small">Montants ${esc(E.annee)}${X.ref(E.src[1])}${X.ref(E.src[2])}. Ces lignes ne s'additionnent pas exactement au total : elles ne reprennent que les principaux prélèvements, et l'impôt sur le revenu et l'impôt sur les sociétés sont comptés avant crédits d'impôt.</p>
  </section>

}

/* Les sujets sur lesquels portent ses propositions publiées : même règle pour tous, calculée à partir des données */
function themeLine(ps) {
  if (!ps.length) return "Pas encore de proposition publiée.";
  if (ps.length === 1) return `Sa seule proposition publiée à ce jour porte sur le sujet « ${THEME_NAME[ps[0].th]} ».`;
  const n = {}; ps.forEach(p => n[p.th] = (n[p.th] || 0) + 1);
  const top = Object.entries(n).sort((a, b) => b[1] - a[1] || THEME_NAME[a[0]].localeCompare(THEME_NAME[b[0]], "fr"));
  const keep = top.filter(([, v]) => v >= Math.min(top[0][1], 2)).slice(0, 3);
  const list = (keep.length ? keep : top.slice(0, 2)).map(([k]) => `« ${THEME_NAME[k]} »`);
  const txt = list.length > 1 ? list.slice(0, -1).join(", ") + " et " + list[list.length - 1] : list[0];
  return `Ses ${ps.length} propositions publiées portent surtout sur ${list.length > 1 ? "les sujets" : "le sujet"} ${txt}.`;
}

  ${press.length ? `<section class="card"><h2>Dans l'actu</h2><div class="rows news">${press.map(p => { const s = SRC[p.s]; return `<a class="row" href="${esc(s.u)}" target="_blank" rel="noopener"><span class="txt"><b>${esc(p.txt)}</b><span><span class="src">${esc(s.p)}</span> · ${esc(fmtDate(p.d, true))}</span></span>${EXT}</a>`; }).join("")}</div></section>` : ""}`;
}

/* Vidéos : un passage par candidat dans un ordre tiré au hasard, puis on recommence.
   Une vidéo du candidat passe avant ses propositions écrites ; sans vidéo, la carte présente la proposition. */
/* Filtre par sujet : on fait défiler tous les candidats sur un même thème */
function buildFeed() {
  const th = ui.feedTh, keep = x => th === "tous" || x.th === th;
  const vids = (DATA.videos || []).filter(keep);
  const per = candSorted().map(c => ({ c: c.id, items: vids.filter(v => v.c === c.id).map(v => ({ v })).concat(propsOf(c.id).filter(keep).map(p => ({ p }))) }));
  const cards = [];
  for (let r = 0; per.some(x => x.items.length > r); r++) cards.push(...shuffle(per.filter(x => x.items.length > r).map(x => ({ c: x.c, ...x.items[r] }))));
  return cards;
}
/* Vidéo YouTube citée comme source : chargée seulement quand on touche le bouton (aucune requête vers YouTube avant) */
const ytId = u => { const m = String(u).match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/); return m ? m[1] : null; };
const ytEmbed = (id, title) => `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?playsinline=1&rel=0&autoplay=1" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
function videoMedia(v) {
  if (v.type === "youtube") return `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?playsinline=1&rel=0" title="${esc(v.titre)}" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
  if (v.type === "mp4") return `<video src="${esc(v.url)}" controls playsinline preload="metadata"></video>`;
  return `<a class="poster" href="${esc(v.url)}" target="_blank" rel="noopener"><span class="soon">Voir la vidéo</span><span class="big">${esc(v.titre)}</span></a>`;
}
const ICO = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.8 4.3-5.8 7.5-5.8s6.1 2 7.5 5.8"/>',
  cmp: '<rect x="3" y="5" width="7.5" height="14" rx="1.6"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.6"/>',
  src: '<path d="M14 5h5v5M19 5l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
  plus: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round">${ICO[k]}</svg>`;
function reel(card) {
  const c = CAND[card.c];
  const th = card.p ? card.p.th : card.v.th;
  const firstSrc = card.v ? (card.v.s ? SRC[card.v.s] : null) : SRC[card.p.s[0]];
  const yt = card.p ? allSrc(card.p).map(id => ytId(SRC[id].u)).find(Boolean) : null;
  const said = card.p && card.p.plus && card.p.plus.pourquoi ? `<span class="said">${esc(card.p.plus.pourquoi[0])}</span>` : "";
  const media = card.v ? videoMedia(card.v)
    : `<div class="poster"><span class="soon">${svg(th)}${esc(THEME_NAME[th])}</span><span class="big">${esc(card.p.t)}</span>${said}<span class="badges">${finBadge(card.p)}${tbc(card.p)}</span>${card.p.finTxt ? `<span class="fintxt">Financement prévu : ${esc(card.p.finTxt)}</span>` : ""}${yt ? `<button class="more-btn play" type="button" data-yt="${esc(yt)}" data-title="${esc(card.p.t)}">▶ Voir la vidéo source</button>` : `<span class="later">Pas encore de vidéo de ${esc(c.nom)} sur cette proposition</span>`}</div>`;
  return `<article class="reel">
    <div class="reel-media">${media}</div>
    <div class="reel-info">
      <a class="cand-h" href="#c-${c.id}">${mono(c.id, "s")}<span class="nm"><b>${esc(c.nom)}</b><small>${esc(c.parti)}</small></span></a>
      ${card.p && card.p.a ? amount(card.p.a) : ""}
      ${firstSrc ? `<p class="src">Source : ${ext(firstSrc.u, esc(firstSrc.p))} · ${esc(fmtDate(firstSrc.d, true))}</p>` : ""}
    </div>
    <div class="reel-actions">
      <a href="#c-${c.id}" aria-label="Voir la fiche de ${esc(c.nom)}"><span class="i">${ico("user")}</span>Fiche</a>
      ${card.p ? `<button type="button" data-more="${card.p.id}" aria-label="Aller plus loin sur cette proposition"><span class="i">${ico("plus")}</span>Détails</button>` : ""}
      <button type="button" data-cmpwith="${c.id}" aria-label="Comparer ${esc(c.nom)}"><span class="i">${ico("cmp")}</span>Comparer</button>
      ${firstSrc ? `<a href="${esc(firstSrc.u)}" target="_blank" rel="noopener" aria-label="Ouvrir la source"><span class="i">${ico("src")}</span>Source</a>` : ""}
    </div>
  </article>`;
}
function screenVideos() {
  const themes = DATA.themes.filter(([k]) => DATA.propositions.some(p => p.th === k));
  if (ui.feedTh !== "tous" && !themes.some(([k]) => k === ui.feedTh)) { ui.feedTh = "tous"; ui.feed = null; }
  if (!ui.feed) ui.feed = buildFeed();

        <span class="swipe">Faites glisser vers le haut</span>

  </div>
  </div>`;
}

/* Comparer : deux candidats côte à côte, ou tous les candidats sur un sujet */
function screenComparer() {
  const seg = `<div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="tous" aria-pressed="${ui.cmpMode === "tous"}">Par sujet</button><button type="button" data-mode="deux" aria-pressed="${ui.cmpMode === "deux"}">Deux candidats</button></div>`;
  const chipsFor = list => `<div class="chips" role="group" aria-label="Sujet">${list.map(([k, l]) => `<button class="chip" type="button" data-th="${k}" aria-pressed="${ui.cmpTh === k}">${esc(l)}</button>`).join("")}</div>`;
  if (ui.cmpMode === "tous") {
    const nTh = k => new Set(DATA.propositions.filter(p => p.th === k).map(p => p.c)).size;
    return `<div class="page-h"><h1>Les sujets</h1><p class="lead">Ce que propose chaque candidat, sujet par sujet. Pour comprendre la situation actuelle, voir l'onglet Accueil.</p></div>${seg}
    <div class="tiles">${DATA.themes.map(([k, l]) => { const n = nTh(k), ok = DATA.sujets && DATA.sujets[k]; const np = DATA.propositions.filter(p => p.th === k).length; return `<a class="tile" href="#t-${k}"><span class="ic">${svg(k)}</span><span class="tt"><b>${esc(l)}</b><span>${n} candidat${n > 1 ? "s" : ""} · ${np} proposition${np > 1 ? "s" : ""}</span></span></a>`; }).join("")}</div>`;
  }
  if (!ui.cmpA || !CAND[ui.cmpA] || !ui.cmpB || !CAND[ui.cmpB] || ui.cmpA === ui.cmpB) {
    const pool = shuffle(DATA.candidats.map(c => c.id).filter(id => id !== ui.cmpA && id !== ui.cmpB));
    if (!ui.cmpA || !CAND[ui.cmpA]) ui.cmpA = pool.pop();
    if (!ui.cmpB || !CAND[ui.cmpB] || ui.cmpB === ui.cmpA) ui.cmpB = pool.find(x => x !== ui.cmpA);
  }
  const opts = sel => candSorted().map(c => `<option value="${c.id}"${c.id === sel ? " selected" : ""}>${esc(c.nom)}</option>`).join("");
  const A = ui.cmpA, B = ui.cmpB;
  const themes = ui.cmpTh === "tous" || !THEME_NAME[ui.cmpTh] ? DATA.themes : DATA.themes.filter(([k]) => k === ui.cmpTh);
  const col = (id, k) => { const ps = DATA.propositions.filter(p => p.c === id && p.th === k); return `<div class="cmp-col">${ps.length ? ps.map(p => `<div class="ci"><b>${esc(p.t)}</b>${finBadge(p)}${tbc(p)}${p.a ? amount(p.a) : ""}${ext(SRC[p.s[0]].u, "Source : " + esc(SRC[p.s[0]].p))}<button class="more-lnk" type="button" data-more="${p.id}">Aller plus loin</button></div>`).join("") : `<span class="none">Rien de public pour l'instant</span>`}</div>`; };
  return `
  <div class="page-h"><h1>Les sujets</h1><p class="lead">Deux candidats côte à côte, sujet par sujet.</p></div>
  ${seg}
  <section class="card">
    <div class="pick">
      <select id="cmpA" aria-label="Premier candidat">${opts(A)}</select>
      <button class="swap" type="button" data-act="swap" aria-label="Inverser les deux candidats"><svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M8 4v15l-3-3M16 20V5l3 3"/></svg></button>
      <select id="cmpB" aria-label="Second candidat">${opts(B)}</select>
    </div>
  </section>
  ${chipsFor([["tous", "Tous les sujets"]].concat(DATA.themes))}
  <div class="cmp-head"><div>${mono(A, "s")}<span>${esc(nom(A))}</span></div><div>${mono(B, "s")}<span>${esc(nom(B))}</span></div></div>
  ${themes.map(([k, l]) => `<section class="card"><h2 class="th-h">${svg(k)}${esc(l)}</h2><div class="cmp-grid">${col(A, k)}${col(B, k)}</div></section>`).join("")}`;
}
/* « Comprendre le sujet » (onglet Accueil) : la situation aujourd'hui, même plan pour tous les sujets, sans les candidats */

  <details class="srcs card"><summary>Les sources de cette fiche</summary>${X.list()}</details>` : `<section class="card"><p class="lead">La fiche « Comprendre le sujet », avec la situation actuelle en chiffres officiels, est en préparation pour ce thème.</p></section>`}
  ${n ? `<a class="more-btn as-link" href="#t-${k}">Ce que proposent les ${n} candidats sur ce sujet${ARW}</a>` : ""}`;
}

/* Page d'un sujet (onglet Sujets) : les candidats et leurs propositions */
function screenTheme(k) {
  if (!THEME_NAME[k]) return screenComparer();

  const S = DATA.sujets && DATA.sujets[k];

  <div class="page-h"><span class="kick">${svg(k)} Sujet</span><h1>${esc(THEME_NAME[k])}</h1><p class="lead">Ce que propose chaque candidat sur ce sujet.</p></div>

const SRC_GROUPS = [
  ["officiel", "Documents des candidats", "Programmes, sites de campagne et comptes officiels des candidats et de leurs partis."],
  ["donnees", "Sources officielles", "Insee, administrations, institutions et textes de loi."],
  ["presse", "Médias", "Articles et vidéos de presse."],
  ["sondage", "Instituts de sondage", "Rapports d'enquête publiés par les instituts."],
  ["analyse", "Comparateurs et encyclopédies", "Ce ne sont pas des sources officielles. Ils servent de point de départ : une proposition qui ne repose que sur eux porte la mention « À confirmer »."]

const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
/* Combien de fois chaque source est citée, et où */
function srcUsage() {
  const u = {};
  const add = (id, k) => { if (!id || !SRC[id]) return; (u[id] = u[id] || {})[k] = (u[id][k] || 0) + 1; };
  DATA.propositions.forEach(p => { const set = new Set(allSrc(p)); if (p.plus && p.plus.pourquoi) set.add(p.plus.pourquoi[1]); set.forEach(s => add(s, "prop")); });
  DATA.candidats.forEach(c => {
    const set = new Set(); if (c.parcours) { c.parcours.chapo[1].forEach(x => set.add(x)); c.parcours.paras.forEach(([, ss]) => ss.forEach(([, x]) => set.add(x))); }
    set.forEach(s => add(s, "bio")); new Set(c.faits.map(f => f[1]).concat(c.docs)).forEach(s => add(s, "fiche"));
  });
  (DATA.kit || []).forEach(f => new Set(f.blocs.map(b => b.src)).forEach(s => add(s, "kit")));
  if (DATA.budget) DATA.budget.dep.src.concat(DATA.budget.rec.src).forEach(s => add(s, "ctx"));
  DATA.presse.forEach(p => add(p.s, "art"));
  DATA.sondages.forEach(s => new Set(s.s).forEach(x => add(x, "sond"))); add(DATA.duels.s, "sond");
  Object.values(DATA.contexte || {}).forEach(r => add(r[1], "ctx"));
  const R = DATA.reperes; ["dette", "deficit", "depenses"].forEach(k => R[k] && add(R[k].s, "ctx")); add(R.popSource, "ctx");
  Object.values(R.axes || {}).forEach(a => a.rows.forEach(r => add(r.s, "ctx")));
  return u;
}
const USE = { prop: ["proposition", "propositions"], bio: ["parcours", "parcours"], kit: ["fiche « Avant de voter »", "fiches « Avant de voter »"], fiche: ["fiche candidat", "fiches candidats"], art: ["article de l'actu", "articles de l'actu"], sond: ["sondage", "sondages"], ctx: ["chiffre de contexte", "chiffres de contexte"] };
const useText = u => u ? "Citée pour : " + Object.entries(USE).filter(([k]) => u[k]).map(([k, [one, many]]) => `${u[k]} ${u[k] > 1 ? many : one}`).join(", ") : "Consultée pour vérifier la liste des candidats";
function srcItem(id, u) {
  const s = SRC[id], dom = host(s.u);
  return `<a class="row" data-q="${esc((s.t + " " + s.p + " " + dom).toLowerCase())}" href="${esc(s.u)}" target="_blank" rel="noopener"><span class="txt"><b>${esc(s.t)}</b><span>${esc(s.p)} · ${esc(fmtDate(s.d))}${dom && !s.p.toLowerCase().includes(dom) ? " · " + esc(dom) : ""}</span><span class="use">${esc(useText(u))}</span></span>${EXT}</a>`;
}
const srcCount = t => Object.values(SRC).filter(s => s.type === t).length;

}

  ${groups.map(([k, title, help, list]) => `<section class="card src-g" data-g="${k}" ${show(k) ? "" : "hidden"}><h2>${esc(title)}<span class="cnt">${list.length}</span></h2><p class="small">${esc(help)}</p><div class="rows">${list.map(id => srcItem(id, U[id])).join("")}</div></section>`).join("")}
  ${photos.length ? `<section class="card src-g" data-g="photos" ${show("photos") ? "" : "hidden"}><h2>Photos<span class="cnt">${photos.length}</span></h2><p class="small">Photos libres de droits publiées sur Wikimedia Commons, recadrées de la même façon pour tous.</p><div class="rows">${photos.map(c => `<a class="row" data-q="${esc((c.nom + " " + c.photo.a + " photo commons").toLowerCase())}" href="${esc(c.photo.u)}" target="_blank" rel="noopener">${mono(c.id)}<span class="txt"><b>${esc(c.nom)}</b><span>${esc(c.photo.a)}, ${esc(c.photo.y)} · ${esc(c.photo.l)}</span></span>${EXT}</a>`).join("")}</div></section>` : ""}
  <p class="small" id="snone" style="padding-inline:4px" hidden>Aucune source ne correspond.</p>`;

let sheetEl = null, sheetFrom = null;
function openMore(id) {
  const p = DATA.propositions.find(x => x.id === id); if (!p) return;
  if (sheetEl) closeMore(true);
  sheetFrom = document.activeElement;
  sheetEl = document.createElement("div"); sheetEl.className = "sheet-bg"; sheetEl.innerHTML = moreHtml(p);
  document.body.appendChild(sheetEl); document.body.classList.add("locked");
  history.pushState({ sheet: id }, "");
  sheetEl.querySelector(".x").focus({ preventScroll: true });
}
function closeMore(silent) {
  if (!sheetEl) return;
  sheetEl.remove(); sheetEl = null; document.body.classList.remove("locked");
  if (!silent && history.state && history.state.sheet) history.back();
  if (sheetFrom && document.contains(sheetFrom)) sheetFrom.focus({ preventScroll: true });
}
document.addEventListener("click", e => {
  const m = e.target.closest("[data-more]"); if (m) { e.preventDefault(); openMore(m.dataset.more); return; }
  if (sheetEl && (e.target === sheetEl || e.target.closest("[data-close]"))) closeMore();
});
window.addEventListener("popstate", () => { if (sheetEl) closeMore(true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetEl) closeMore(); });

  else if (h === "methode") { html = screenMethode(); title = "Méthode"; back = "#actu"; }
  else if (h === "sources") { html = screenSources(); title = "Sources"; back = "#methode"; }
  else if (h.startsWith("kit-")) { html = screenKit(h.slice(4)); title = "Avant de voter"; back = "#actu"; }
  else if (h === "budget") { html = screenBudget(); title = "Le budget"; back = "#actu"; }
  else if (h.startsWith("comprendre-")) { html = screenComprendre(h.slice(11)); title = THEME_NAME[h.slice(11)] || "Comprendre"; back = "#actu"; }
  else if (TAB_TITLE[h]) { tab = h; html = { candidats: screenCandidats, videos: screenVideos, comparer: screenComparer, sondages: screenSondages }[h](); title = TAB_TITLE[h]; }
  else { html = screenAccueil(); title = null; }
  app.classList.toggle("full", tab === "videos");
  app.innerHTML = html;
  $("#ttl").innerHTML = title ? esc(title) : '<span class="wm">Programmes <em>2027</em></span>';
  const b = $("#back"); b.hidden = !back; b.dataset.to = back || "";
  document.querySelectorAll(".nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === tab ? "page" : "false"));
}
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { closeMore(true); route(); window.scrollTo(0, 0); });
window.addEventListener("scroll", () => $("#bar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });
$("#back").addEventListener("click", e => { location.hash = e.currentTarget.dataset.to || "#actu"; });
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.actu) { ui.actuC = t.dataset.actu; rerender(); }
  else if (t.dataset.cmpwith) { ui.cmpMode = "deux"; ui.cmpA = t.dataset.cmpwith; if (ui.cmpB === ui.cmpA) ui.cmpB = null; location.hash = "#comparer"; }
  else if (t.dataset.act === "swap") { [ui.cmpA, ui.cmpB] = [ui.cmpB, ui.cmpA]; rerender(); }
  else if (t.dataset.act === "refeed") { ui.feed = buildFeed(); route(); const f = $("#feed"); if (f) f.scrollTo(0, 0); }
  else if (t.dataset.mode) { ui.cmpMode = t.dataset.mode; if (!t.dataset.keepth && ui.cmpMode === "deux") ui.cmpTh = "tous"; if (location.hash !== "#comparer") location.hash = "#comparer"; else rerender(); }
  else if (t.dataset.th) { ui.cmpTh = t.dataset.th; rerender(); }
  else if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
  else if (t.dataset.srcg) { ui.srcG = t.dataset.srcg; rerender(); }
  else if (t.dataset.feedth) { ui.feedTh = t.dataset.feedth; ui.feed = buildFeed(); route(); const f = $("#feed"); if (f) f.scrollTo(0, 0); const c = document.querySelector(`[data-feedth="${ui.feedTh}"]`); if (c) c.scrollIntoView({ inline: "center", block: "nearest" }); }
  else if (t.dataset.yt) { const m = t.closest(".reel-media"); if (m) m.innerHTML = ytEmbed(t.dataset.yt, t.dataset.title || "Vidéo"); }
});
app.addEventListener("input", e => {
  if (e.target.id === "qs") {
    const q = e.target.value.trim().toLowerCase(); let shown = 0;
    document.querySelectorAll(".src-g").forEach(g => {
      if (q) g.hidden = false; else g.hidden = !(ui.srcG === "tous" || g.dataset.g === ui.srcG);
      let n = 0; g.querySelectorAll(".row").forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) n++; });
      if (q && !n) g.hidden = true; if (!g.hidden) shown += n;
    });
    const none = document.getElementById("snone"); if (none) none.hidden = shown > 0;
    return;
  }
  if (e.target.id !== "qc") return;
  const q = e.target.value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll("#clist .row").forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) shown++; });
  const none = document.getElementById("cnone"); if (none) none.hidden = shown > 0;
});
app.addEventListener("change", e => {
  if (e.target.id === "cmpA") { ui.cmpA = e.target.value; if (ui.cmpA === ui.cmpB) ui.cmpB = null; rerender(); }
  if (e.target.id === "cmpB") { ui.cmpB = e.target.value; if (ui.cmpB === ui.cmpA) ui.cmpA = null; rerender(); }
});

function boot() {
  prep();
  $("#jx").textContent = "J−" + daysTo("2027-04-18");
  route();
  fetch("data.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(d => {
    if (d && d.maj && d.propositions && (d.maj > DATA.maj || d.version > DATA.version)) { DATA = d; prep(); ui.feed = null; rerender(); }
  }).catch(() => {});
}
boot();
</script>
<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
</script>
