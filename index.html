la Sécurité sociale","d":"Rembourser les soins à 100 % par la Sécurité sociale.","s":["pcf_pacte"],"aj":"2026-10-01","fin":"n","id":"p059"},{"c":"roussel","th":"social","t":"Un milliard d'euros contre les violences faites aux femmes","d":"Une loi-cadre d'un milliard d'euros contre les violences faites aux femmes et pour l'égalité salariale.","s":["pcf_pacte"],"a":{"v":1,"nature":"cout","per":"nd","h":"loi-cadre violences et égalité salariale"},"aj":"2026-10-01","fin":"c","id":"p060"},{"c":"roussel","th":"travail","t":"Des salaires qui suivent l'inflation, et 10 % des embauches pour les moins de 25 ans","d":"Augmenter les salaires et les indexer sur l'inflation ; réserver 10 % des embauches aux moins de 25 ans.","s":["pcf_pacte"],"aj":"2026-10-01","fin":"n","id":"p061"},{"c":"roussel","th":"defense","t":"Quitter le commandement intégré de l'OTAN","d":"Sortir du commandement intégré de l'OTAN et rejeter les contraintes budgétaires du pacte de stabilité.","s":["pcf_pacte"],"aj":"2026-10-01","fin":"n","id":"p062"},{"c":"ruffin","th":"travail","t":"Un SMIC à 1 700 € net et une prime de 1 000 € pour les bas salaires","d":"SMIC à 1 700 € net, prime d'urgence obligatoire de 1 000 € pour les bas salaires, horaires atypiques payés double et salaires indexés sur l'inflation.","s":["orange_ruffin"],"aj":"2026-10-01","fin":"n","id":"p063"},{"c":"ruffin","th":"travail","t":"Un statut protecteur pour 7 millions de « travailleurs essentiels »","d":"Créer un statut des « travailleurs essentiels » pour 7 millions de personnes.","s":["ruffin_travail"],"aj":"2026-10-01","fin":"n","id":"p064"},{"c":"ruffin","th":"retraites","t":"Partir plus tôt quand le métier est pénible","d":"Permettre un départ anticipé selon la pénibilité du métier.","s":["orange_ruffin"],"aj":"2026-10-01","fin":"n","id":"p065"},{"c":"ruffin","th":"eco","t":"Taxer davantage les grandes entreprises","d":"Taxer davantage les grandes entreprises et convoquer des états généraux de la fiscalité et de la protection sociale.","s":["orange_ruffin"],"aj":"2026-10-01","fin":"n","id":"p066"},{"c":"ruffin","th":"institutions","t":"Se verser un salaire égal au SMIC s'il est élu","d":"Se verser, s'il est élu, une rémunération équivalente au SMIC.","s":["orange_ruffin"],"aj":"2026-10-01","fin":"s","id":"p067"},{"c":"tondelier","th":"travail","t":"Un SMIC à 2 000 € brut par mois","d":"Porter le SMIC à 2 000 € brut par mois.","s":["lci_tondelier"],"aj":"2026-10-01","fin":"n","id":"p068"},{"c":"tondelier","th":"education","t":"19 élèves par classe d'ici 2032, et les profs augmentés de 15 %","d":"19 élèves par classe d'ici 2032 (12 en REP+), salaires des enseignants +15 % en cinq ans hors inflation, création d'une filière de catégorie B pour les accompagnants d'élèves en situation de handicap.","s":["ps_ecole"],"aj":"2026-10-01","fin":"n","id":"p069"},{"c":"tondelier","th":"ecologie","t":"2 milliards par an pour isoler les écoles","d":"Consacrer 2 milliards d'euros par an à l'isolation des écoles et à des « refuges climatiques ».","s":["ps_ecole"],"aj":"2026-10-01","a":{"v":2,"nature":"cout","per":"an","h":"montant annoncé"},"fin":"c","id":"p070"},{"c":"zemmour","th":"immigration","t":"Expulser les étrangers en situation régulière après un an de chômage","d":"Expulser les étrangers en situation régulière après un an de chômage, en plus des détenus étrangers et des personnes en situation irrégulière.","s":["ps_zemmour"],"aj":"2026-10-01","fin":"n","id":"p071"},{"c":"zemmour","th":"travail","t":"Remplacer la main-d'œuvre immigrée par des robots","d":"Remplacer la main-d'œuvre immigrée par des robots, sur le modèle de la Chine et du Japon.","s":["ps_zemmour"],"aj":"2026-10-01","fin":"n","id":"p072"},{"aj":"2026-10-03","c":"lisnard","th":"eco","t":"Supprimer deux impôts sur les entreprises pour diviser par deux les impôts de production","d":"Supprimer la C3S et la CVAE (11,5 milliards d'euros) pour faire passer les impôts de production de 2 % à 1 % du PIB.","s":["ne_ambition"],"a":{"v":11.5,"nature":"cout","per":"an","h":"baisse d'impôts annoncée"},"fin":"c","id":"p073","plus":{"detail":[["« La suppression de la C3S (Contribution sociale de solidarité au bénéfice de la Sécurité Sociale) » et, « le cas échéant, de la CVAE ».","ne_ambition"],["Objectif : « une diminution de moitié des impôts de production, de 2% à 1% du PIB ».","ne_ambition"]],"pourquoi":[["Selon lui, la situation « est clairement le résultat d'un esprit général hostile à la prise de risque entrepreneurial ».","ne_ambition"]],"auj":[["En 2025, les prélèvements obligatoires représentent 43,6 % du PIB.","sujet_eco_insee_apu_2025"]],"fin_cand":[["Le coût « représenterait 11,5 milliards d'euros qui s'ajouteraient à la baisse de 10 milliards déjà prévue par le gouvernement ».","ne_ambition"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lisnard","th":"retraites","t":"Une part de retraite par capitalisation, jusqu'à 40 % des pensions","d":"Constituer progressivement une capitalisation de 116 milliards d'euros, soit environ 40 % du montant des retraites, en huit tranches successives.","s":["ne_ambition"],"fin":"n","id":"p074","plus":{"detail":[["Il veut constituer une capitalisation « par tranches successives, soit environ 8 tranches », « pour atteindre un montant de capitalisation évalué à 116 milliards d'euros ».","ne_ambition"],["Cela représenterait « environ 40% du montant total des retraites ».","ne_ambition"]],"pourquoi":[["« Un tel dispositif permettra de garantir des revenus supérieurs aux retraités. »","ne_ambition"],["Selon lui, « 34% du PIB de la France est affecté aux prestations de santé, de retraites, de chômage, de logement de handicap », « alors que la moyenne européenne est de 29% ».","ne_ambition"]],"auj":[["En 2025, les dépenses de retraite représentent 14,1 % du PIB, soit 422 milliards d'euros.","sujet_retraites_cor_ra2026"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lisnard","th":"social","t":"Un minimum vieillesse à 1 000 € par mois","d":"Porter le minimum vieillesse à 1 000 € par mois.","s":["ne_ambition"],"fin":"n","id":"p075","plus":{"detail":[["Il propose « un minimum-vieillesse à hauteur de 1000 euros par mois ».","ne_ambition"],["Nous n'avons pas trouvé de coût annoncé.",null]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lisnard","th":"logement","t":"Supprimer l'obligation de 20 à 25 % de logements sociaux par commune","d":"Supprimer l'article 55 de la loi SRU, qui impose 20 % et bientôt 25 % de logements sociaux dans certaines communes.","s":["ne_ambition"],"fin":"s","id":"p076","plus":{"detail":[["Il veut « la suppression de l'article 55 de la loi SRU », « obligeant les communes à disposer de 20% et bientôt 25% de logements sociaux ».","ne_ambition"]],"auj":[["La loi SRU impose à certaines communes 20 % ou 25 % de logements sociaux ; sinon, elles subissent un prélèvement et le préfet peut prononcer leur carence.","sujet_logement_anil_sru"],["Au 1er janvier 2025, la France compte 5,4 millions de logements sociaux, soit 15,9 % des résidences principales.","sujet_logement_sdes_rpls2025"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lisnard","th":"immigration","t":"Rétablir le délit de séjour irrégulier","d":"Rétablir le délit de séjour irrégulier, supprimé en 2012.","s":["ne_immigration","jdd_lisnard"],"fin":"s","id":"p077","plus":{"detail":[["« Rétablir le délit de séjour irrégulier », supprimé en 2012.","ne_immigration","jdd_lisnard"]],"auj":[["En 2025, 23 549 éloignements d'étrangers en situation irrégulière ont été mis en œuvre (données provisoires).","sujet_immigration_dgef_eloignements2025"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lisnard","th":"immigration","t":"Des quotas, et la primauté du droit français sur les juges européens en matière migratoire","d":"Fixer des quotas de main-d'œuvre qualifiée, diviser par huit les titres de séjour et inscrire dans la Constitution la primauté du droit national en matière migratoire, jusqu'à sortir de la CEDH en dernier recours.","s":["ne_immigration","jdd_lisnard"],"fin":"s","id":"p078","plus":{"detail":[["« Fixer des quotas de main-d'œuvre qualifiée » et « Diviser par huit la délivrance de titres de séjour ».","ne_immigration"],["« Inscrire la primauté du droit national en matière migratoire dans la Constitution » « afin de rendre inapplicables les décisions de la CJUE et de la CEDH contraires à l'intérêt national ». « Sortir de la CEDH en dernier recours. »","ne_immigration"],["Il veut aussi « Mettre fin à l'automaticité du droit du sol », « Revenir sur l'accord franco-algérien de 1968 » et allonger la rétention administrative à 24 mois.","ne_immigration"],["Il veut « conditionner le regroupement familial à des critères de ressources et des tests d'intégration ».","ne_immigration"]],"pourquoi":[["Ses mesures sont classées sous quatre axes : « Oser le rapport de force », « Maîtriser notre peuplement », « Rétablir l'autorité de l'État » et « En finir avec l'angélisme ».","ne_immigration"]],"auj":[["En 2025, 377 000 premiers titres de séjour ont été délivrés (données provisoires). Les diviser par huit les ramènerait à environ 47 000 par an (calcul de l'appli).","sujet_immigration_dgef_titres2025"],["Depuis le 12 juin 2026, les règles européennes du pacte sur la migration et l'asile s'appliquent.","sujet_immigration_consilium_pacte"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lisnard","th":"immigration","t":"Traiter les demandes de visa hors des frontières européennes","d":"Créer des centres de traitement des visas à l'extérieur des frontières de l'Union européenne, et traiter les demandes d'asile dans les consulats à l'étranger.","s":["jdd_lisnard","ne_immigration"],"fin":"n","id":"p079","plus":{"detail":[["Il propose des centres de traitement des visas à l'extérieur des frontières de l'Union européenne.","jdd_lisnard"],["Son programme prévoit aussi de « Traiter les demandes d'asiles au sein de nos consulats à l'étranger », et des mesures de rétorsion contre les pays qui ne coopèrent pas (« visas, transferts d'argent, aide publique au développement, etc. »).","ne_immigration"]],"auj":[["En 2025, l'Ofpra a enregistré 145 210 demandes d'asile ; son taux de protection est de 41,2 %.","sujet_immigration_ofpra_bilan2025"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lisnard","th":"securite","t":"Ramener les forces de l'ordre sur le terrain","d":"Porter à au moins 50 % le temps de présence des forces de sécurité sur le terrain, contre 37 % aujourd'hui, moderniser leurs outils et remettre à niveau les moyens de la police et de la justice.","s":["ne_securite","ne_destin"],"fin":"n","id":"p080","plus":{"detail":[["« Ramener les forces de sécurité sur le terrain (50 % de présence minimum, contre 37 % aujourd'hui) ».","ne_securite"],["« Donner aux préfets les moyens de commander réellement » et « moderniser les outils » (vidéoprotection, radios numériques, IA de prévention).","ne_securite"],["Il juge que « des plans de remise à niveau des moyens de la police et de la justice sont indispensables ».","ne_destin"],["Les communes volontaires pourraient armer leur police municipale : « cela doit rester une liberté, jamais une obligation ».","ne_securite"]],"pourquoi":[["« L'impunité progresse parce que l'État régresse. »","ne_securite"]],"auj":[["Environ 8 500 postes de policiers et de gendarmes doivent être créés entre 2023 et 2027.","sujet_securite_senat_securites_plf2026"]],"note":["Les pages du programme de Nouvelle Énergie ne sont pas datées : nous les avons consultées le 19 octobre 2026.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"bertrand","th":"securite","t":"Un an de prison minimum pour les agresseurs de policiers, pompiers et maires (proposé en 2021)","d":"Une peine de prison automatique d'au moins un an, sans aménagement possible, pour les agresseurs de policiers, de gendarmes, de pompiers et de maires. Il l'a proposée en 2021 ; nous n'avons pas trouvé s'il la reprend pour 2027.","s":["europe1_bertrand_peine_2021"],"fin":"s","id":"p082","plus":{"detail":[["En avril 2021, il proposait une peine de prison d'au moins un an, « sans sursis, sans aménagement de peine possible », « quand on attaque un policier, un gendarme, un pompier, un maire ».","europe1_bertrand_peine_2021"],["Il voulait modifier la Constitution pour permettre ces peines automatiques « au terme d'un procès », avec une consultation des Français à l'automne 2022.","europe1_bertrand_peine_2021"],["Nous n'avons pas trouvé de déclaration de 2026 qui reprenne cette mesure : il dit vouloir « tester » ses idées avant de présenter son projet.","nousfrance_embuscade"]],"pourquoi":[["C'était selon lui « la seule façon de casser l'impunité ».","europe1_bertrand_peine_2021"]],"auj":[["La loi pénale, et donc les peines, est votée par le Parlement (article 34 de la Constitution). Avant leur promulgation, les lois peuvent être soumises au Conseil constitutionnel (article 61).","sujet_securite_cc_constitution"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"retraites","t":"Réformer les retraites par la durée de travail plutôt que par l'âge","d":"Faire de la durée de cotisation le levier principal plutôt que le recul de l'âge légal, rétablir la pénibilité avec un droit au départ anticipé, et combler l'écart d'emploi des seniors avec les meilleurs pays européens.","s":["caz_synthese"],"fin":"n","id":"p084","plus":{"detail":[["Il pose quatre principes, dont la « durée de cotisation plutôt que recul de l'âge légal », en reprenant « la trajectoire d'allongement de 2014 ».","caz_synthese"],["« Pénibilité rétablie (postures contraignantes, port de charges, vibrations, risques chimiques) », avec un droit au départ anticipé.","caz_synthese"],["Il prévoit aussi la « liberté de travailler plus longtemps pour qui le souhaite » et une politique pour l'emploi des seniors, « gisement de huit cent mille emplois ».","caz_synthese"]],"auj":[["Depuis le 1er septembre 2026, l'âge légal va de 62 ans et 9 mois (nés en 1964) à 64 ans (nés à partir de 1969), avec 170 à 172 trimestres requis pour les générations 1964 à 1968.","sujet_retraites_sp_suspension"],["La loi de financement de la sécurité sociale pour 2026 a suspendu jusqu'en 2028 le relèvement de l'âge légal prévu par la réforme de 2023.","sujet_retraites_sp_suspension"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"budget","t":"Une « règle d'or sociale » pour équilibrer la Sécurité sociale","d":"Équilibre des branches maladie, vieillesse et autonomie sur un cycle de cinq ans (dix en cas de crise), et chaque exonération de cotisations compensée à l'euro près.","s":["caz_synthese"],"fin":"s","id":"p085","plus":{"detail":[["Il veut le « rétablissement plein et entier de la loi Veil » « à titre rétroactif depuis 2019 » : « toute exonération compensée à l'euro près, indexée sur les salaires ».","caz_synthese"],["L'équilibre des comptes serait « apprécié sur un cycle de cinq ans » (dix ans au plus en cas de crise majeure), pour les branches maladie, vieillesse et autonomie.","caz_synthese"]],"auj":[["En 2025, la branche maladie de la Sécurité sociale est en déficit de 15,9 milliards d'euros.","sujet_sante_senat_cf_comptes2025"],["Le Parlement vote chaque année la loi de financement de la sécurité sociale, qui fixe ses objectifs de dépenses.","sujet_sante_an_fiche54"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"etudes","t":"Au moins 2 000 € d'aide en plus pour les étudiants boursiers","d":"Une aide supplémentaire d'au moins 2 000 € pour les étudiants boursiers pendant leurs deux premières années.","s":["caz_synthese"],"fin":"n","id":"p086","plus":{"detail":[["« Au moins 2 000 € d'aide supplémentaire pour chaque étudiant boursier au cours de ses deux premières années ».","caz_synthese"]],"auj":[["En 2025, 668 284 étudiants recevaient une bourse sur critères sociaux (2,41 milliards d'euros versés).","sujet_etudes_crous_bourses"]],"fin_cand":[["Nous n'avons pas trouvé de coût dans sa synthèse.",null]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"travail","t":"Une avance de 3 000 € pour les 18-24 ans sans diplôme ni emploi","d":"Une « avance jeunesse » de 3 000 € pour les 18-24 ans sans diplôme ni emploi, sous conditions.","s":["caz_synthese"],"fin":"n","id":"p087","plus":{"detail":[["Une « avance jeunesse de 3 000 € pour les 18-24 ans sans diplôme ni emploi, sous conditions de ressources ».","caz_synthese"],["Nous n'avons pas trouvé si cette avance serait à rembourser.",null]],"auj":[["Au 2e trimestre 2026, le taux de chômage des 15-24 ans est de 21,6 %.","sujet_travail_insee_chomage"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"institutions","t":"Rétablir le septennat et une dose de proportionnelle","d":"Rétablir le mandat présidentiel de sept ans, introduire une dose de proportionnelle aux législatives et encadrer le recours au 49.3.","s":["caz_synthese"],"fin":"s","id":"p088","plus":{"detail":[["Il veut le « rétablissement du septennat » et une « dose de proportionnelle aux législatives ».","caz_synthese"],["Il demande une « discipline sur le 49.3, les ordonnances et les procédures accélérées ».","caz_synthese"],["Nous n'avons pas trouvé si le septennat serait renouvelable.",null]],"auj":[["Le mandat présidentiel est de cinq ans (article 6 de la Constitution). Le 49.3 permet au Gouvernement de faire adopter un texte sans vote, sauf si une motion de censure est votée.","sujet_institutions_cc_constitution","sujet_institutions_info_budget493"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"eco","t":"Taxer réellement les grandes fortunes et les plus hauts revenus","d":"Taxer réellement les grandes fortunes et les plus hauts revenus, rééquilibrer la fiscalité entre travail et capital, et baisser les impôts de production en réduisant les aides fiscales.","s":["caz_synthese"],"fin":"n","finTxt":"La baisse des impôts de production serait financée par moins d'aides fiscales aux entreprises","id":"p089","plus":{"detail":[["Il veut imposer réellement les très grandes fortunes et les rentes, et rééquilibrer la fiscalité entre travail et capital.","caz_synthese"],["La « baisse des impôts de production » serait « financée par une réduction des aides fiscales ».","caz_synthese"],["Sa méthode : « vérité budgétaire et maîtrise de la dette » et « le politique d'abord, l'expert ensuite », avec plus de cent cinquante experts.","caz_synthese"]],"auj":[["En 2025, les prélèvements obligatoires représentent 43,6 % du PIB.","sujet_eco_insee_apu_2025"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"logement","t":"Un grand plan de construction et de rénovation de logements sociaux","d":"Un grand plan de construction et de rénovation de logements, à la fois social et écologique, pour faire baisser les prix, avec des mécanismes nouveaux d'accession à la propriété.","s":["caz_synthese"],"fin":"n","id":"p090","plus":{"detail":[["« Pour faire baisser les prix, grand plan de constructions et de rénovations, à la fois social et écologique ».","caz_synthese"],["Le plan serait soutenu par des mécanismes nouveaux d'accession à la propriété. Nous n'avons pas trouvé d'objectif chiffré.","caz_synthese"]],"auj":[["En 2025, 274 611 logements ont été mis en chantier, 21,3 % de moins que la moyenne des cinq années précédentes.","sujet_logement_sdes_construction2025"],["2,8 millions de ménages attendent un logement social en 2025.","sujet_logement_senat_avis819"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"cazeneuve","th":"europe","t":"Passer à la majorité au lieu de l'unanimité dans l'Union européenne","d":"Mettre fin à la règle de l'unanimité au profit de décisions à la majorité dans l'Union européenne, avec une réforme budgétaire et une politique industrielle commune.","s":["caz_synthese"],"fin":"n","id":"p091","plus":{"detail":[["Il demande la « fin de la règle de l'unanimité au profit des décisions à la majorité ».","caz_synthese"],["Il veut aussi une réforme budgétaire de l'Union et une politique industrielle commune.","caz_synthese"]],"auj":[["Au Conseil de l'Union européenne, la politique étrangère et de sécurité commune se décide à l'unanimité, sauf exceptions.","sujet_europe_consilium_unanimity"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"maurel","th":"travail","t":"Un SMIC à 1 700 € net","d":"Porter le SMIC à 1 700 € net et indexer les salaires sur l'inflation.","s":["maurel_prog"],"fin":"n","id":"p092"},{"aj":"2026-10-03","c":"maurel","th":"travail","t":"Les salaires des fonctionnaires augmentés de 10 % en cinq ans","d":"Augmenter de 10 % la grille de la fonction publique sur le quinquennat.","s":["maurel_prog"],"fin":"n","id":"p093"},{"aj":"2026-10-03","c":"maurel","th":"social","t":"Le budget des hôpitaux augmenté d'au moins 4 % par an","d":"Augmenter le financement des hôpitaux d'au moins 4 % par an et supprimer la tarification à l'activité.","s":["maurel_prog"],"fin":"n","id":"p094"},{"aj":"2026-10-03","c":"maurel","th":"eco","t":"Un emprunt national de 300 milliards pour l'industrie","d":"Lancer un emprunt national d'investissement de 300 milliards d'euros pour l'industrie.","s":["maurel_prog"],"a":{"v":300,"nature":"cout","per":"nd","h":"montant annoncé"},"fin":" ],"note":["Son site indique que le programme 2027 est « en cours d'élaboration » ; ces mesures viennent de son premier document de campagne, non daté.","kazib_programme"],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"kazib","th":"institutions","t":"Mettre fin à la Ve République, au Sénat et à la présidence","d":"Mettre fin à la Ve République, au Sénat et à la fonction de président de la République.","s":["kazib_programme"],"fin":"s","id":"p129","plus":{"detail":[["« Fin de la Ve République, du Sénat et de la figure présidentielle. »","kazib_programme"],["Nous n'avons pas trouvé par quelles institutions il les remplacerait.",null]],"objectif":[["Son organisation veut « remettre à l'ordre du jour la perspective communiste ».","rp_kazib_campagne"]],"auj":[["Les institutions actuelles reposent sur la Constitution du 4 octobre 1958. Le Parlement compte au plus 577 députés et 348 sénateurs.","sujet_institutions_cc_constitution"]],"note":["Son site indique que le programme 2027 est « en cours d'élaboration » ; ces mesures viennent de son premier document de campagne, non daté.","kazib_programme"],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"labib","th":"travail","t":"Interdire tous les licenciements et partager le temps de travail","d":"Interdire tous les licenciements, partager le temps de travail entre tous et augmenter les salaires.","s":["lbb_labib","votons_labib"],"fin":"n","id":"p130","plus":{"detail":[["Elle défend « l'interdiction de tous les licenciements » et « le partage du temps de travail entre tous et toutes », à imposer par la lutte.","lbb_labib"],["Elle réclame des hausses de salaires : « on est dans une situation d'inflation continue et nos salaires n'augmentent pas ».","lbb_labib"],["Selon le comparateur Votons, elle a aussi demandé en septembre 2026 « pas un seul revenu sous les 2000 euros net » et 400 euros de plus par mois pour tous. Nous n'avons pas pu lire le texte d'origine.","votons_labib"]],"pourquoi":[["« C'est nous qui produisons tout, donc c'est "brusselssignal_lalanne","lalibre_lalanne"],"fin":"n","id":"p133","plus":{"detail":[["Selon Brussels Signal, son programme prévoit le « Frexit », la sortie de l'OTAN et le retour au franc.","brusselssignal_lalanne"],["Son programme met en avant la « reprise en main de la souveraineté nationale », « dans une optique souverainiste et libertarienne totalement assumée ».","lalibre_lalanne"],["Nous n'avons pas trouvé par quelle procédure ni dans quel délai.",null]],"auj":[["Un seul pays a quitté l'Union européenne : le Royaume-Uni, qui a notifié son départ le 29 mars 2017 et est sorti le 31 janvier 2020.","ue_brexit_report_2020","pref_brexit_2021"],["L'article 13 du traité de l'Atlantique Nord permet de quitter l'OTAN un an après l'avoir notifié au gouvernement des États-Unis.","nato_traite_1949"]],"note":["Son site de campagne n'a pas pu être consulté : ces mesures viennent de la presse, qui cite le programme publié lors de sa déclaration.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lalanne","th":"institutions","t":"Un référendum d'initiative citoyenne","d":"Instaurer un référendum d'initiative citoyenne.","s":["brusselssignal_lalanne","lalibre_lalanne"],"fin":"s","id":"p134","plus":{"detail":[["Son programme prévoit « l'instauration d'une démocratie plus directe et participative », avec le référendum d'initiative citoyenne.","lalibre_lalanne","brusselssignal_lalanne"],["Nous n'avons pas trouvé le nombre de signatures nécessaires ni les sujets concernés.",null]],"auj":[["Aujourd'hui, un référendum peut être organisé à l'initiative d'un cinquième des parlementaires, soutenue par un dixième des électeurs inscrits (article 11 de la Constitution).","sujet_institutions_cc_constitution"]],"note":["Son site de campagne n'a pas pu être consulté : ces mesures viennent de la presse, qui cite le programme publié lors de sa déclaration.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"lalanne","th":"institutions","t":"Abroger les lois Pleven, Gayssot et Avia sur la parole publique","d":"Abroger des lois qu'il présente comme bâillonnant le débat public : les lois Pleven (1972), Gayssot (1990) et Avia (2020).","s":["brusselssignal_lalanne"],"fin":"s","id":"p135","plus":{"detail":[["Selon Brussels Signal, il veut abroger des lois qui, selon lui, bâillonnent le débat public : la loi Pleven de 1972, la loi Gayssot de 1990 et la loi Avia de 2020.","brusselssignal_lalanne"]],"auj":[["La Déclaration de 1789 protège « la libre communication des pensées et des opinions », chacun devant « répondre de l'abus de cette liberté dans les cas déterminés par la Loi ».","eduscol_expression"]],"note":["Son site de campagne n'a pas pu être consulté : ces mesures viennent de la presse, qui cite le programme publié lors de sa déclaration.",null],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"egger","th":"institutions","t":"Un référendum d'initiative citoyenne constituant, déclenché par 700 000 signatures","d":"Rendre le référendum obligatoire pour toute révision de la Constitution, et permettre aux citoyens d'en proposer une avec 700 000 signatures recueillies en 18 mois.","s":["sd_parrainage2027","sd_calendrier"],"fin":"s","id":"p136","plus":{"detail":[["Elle veut rendre « obligatoire le référendum pour toute révision constitutionnelle ».","sd_parrainage2027"],["Une révision proposée par les citoyens « doit recueillir 700 000 signatures d'électeurs dans un délai de 18 mois », puis être soumise au référendum.","sd_parrainage2027"],["C'est l'un des deux textes qu'elle soumettrait au référendum dès 2027, en réformant l'article 89 de la Constitution.","sd_calendrier"]],"objectif":[["« Les français pourront décider des droits qu'ils se donnent à eux-mêmes. »","sd_calendrier"]],"pourquoi":[["« Le recours au référendum est inexistant depuis 2005. »","sd_parrainage2027"],["Son parti cite la Suisse et l'Uruguay comme exemples de démocratie directe.","sd_accueil"]],"auj":[["Aujourd'hui, la révision de la Constitution (article 89) est proposée par le Président ou les parlementaires, votée par les deux assemblées, puis approuvée par référendum ou par le Parlement réuni en Congrès (3/5 des voix).","sujet_institutions_cc_constitution"],["Depuis 1958, 9 référendums nationaux ont été organisés, le dernier le 29 mai 2005.","sujet_institutions_cc_referendums"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"egger","th":"etat","t":"Plus de pouvoirs pour les communes","d":"Obliger l'État à déléguer une compétence à une collectivité qui la demande, en privilégiant la plus petite (la commune), et permettre aux communes de fixer leurs propres règles électorales, jusqu'à la démocratie directe.","s":["sd_parrainage2027","sd_calendrier"],"fin":"s","id":"p137","plus":{"detail":[["« L'État doit (et non peut) déléguer une compétence à une collectivité qui lui en fait la demande. »","sd_parrainage2027"],["« En cas de conflit de compétences, l'échelon territorial le plus petit est privilégié. »","sd_parrainage2027"],["Les communes pourraient reprendre la compétence sur leurs règles électorales et introduire la démocratie directe, ou la proportionnelle, par simple délibération.","sd_calendrier"]],"pourquoi":[["« La décentralisation s'opérerait alors non plus « par le haut » mais « par le bas ». »","sd_parrainage2027"]],"auj":[["Les collectivités territoriales s'administrent librement par des conseils élus, dans les conditions prévues par la loi (article 72 de la Constitution).","sujet_institutions_cc_constitution"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"batho","th":"ecologie","t":"Faire de la décroissance un projet politique","d":"Faire de la décroissance un nouveau modèle, en rupture avec l'objectif de croissance, au sein d'une « République terrestre » qui protège les territoires et la vie quotidienne.","s":["librejournal_batho","ge_livre_batho"],"fin":"n","id":"p140","plus":{"detail":[["« Un nouveau modèle est possible : la décroissance, qui permet à tous de vivre en sécurité. »","librejournal_batho"],["Elle veut « construire une « République terrestre » qui protège nos territoires et notre vie quotidienne ».","librejournal_batho"],["Son éditeur écrit qu'elle « a rompu avec l'idéologie productiviste de la gauche française pour embrasser la cause de la décroissance ».","ge_livre_batho"],["Nous n'avons pas encore trouvé les mesures concrètes qui traduiraient ce projet (énergie, transports, consommation, fiscalité).",null]],"pourquoi":[["Selon elle, la croissance ne peut pas compenser les chocs géopolitiques et climatiques, car « la base de l'économie, c'est l'énergie et les matières premières ».","librejournal_batho"],["« L'écologie est aussi une stratégie de défense et de souveraineté, porteuse d'un autre modèle de portée mondiale. »","librejournal_batho"]],"auj":[["En 2025, le PIB de la France a augmenté de 0,8 %, après 1,5 % en 2024.","sujet_eco_insee_comptes_2025"],["En 2025, les émissions de gaz à effet de serre de la France sont pré-estimées à 359 millions de tonnes équivalent CO2, en baisse de 2,1 %.","sujet_ecologie_hcc_ra2026"]],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"asselineau","th":"europe","t":"Sortir de l'Union européenne et de l'euro","d":"Engager la sortie de l'Union européenne par l'article 50 dès la première semaine du mandat, sans référendum préalable. Son parti veut aussi « se libérer » de l'euro.","s":["upr_rentree_2026"],"fin":"n","id":"p141","plus":{"detail":[["Il s'engage à « notifier l'activation de l'article 50 du Traité sur l'Union européenne » dès la première semaine de son mandat, pour « engager une procédure de sortie sous deux ans ».","upr_rentree_2026"],["Son parti écrit qu'il « refuse l'idée d'un référendum préalable sur le sujet, estimant que son élection vaudra mandat ».","upr_rentree_2026"],["Son parti résume ce volet par la formule « se libérer de l'UE, de l'euro et de l'OTAN ». Le compte rendu ne détaille pas comment se ferait la sortie de l'euro.","upr_rentree_2026"],["En 2017, lors de sa précédente candidature, il annonçait déjà : « nous appliquerons l'article 50 pour sortir de l'UE ».","sudradio_asselineau_2017"]],"objectif":[["Son parti présente ce programme comme celui de « la Libération nationale ».","upr_rentree_2026"]],"pourquoi":[["En 2017, il expliquait : « Pour renégocier les traités, il faut l'accord des 27 autres gouvernements et des 27 autres peuples ».","sudradio_asselineau_2017"],["Il assurait aussi : « nous ne nous isolerons pas du tout du reste du monde ».","sudradio_asselineau_2017"]],"auj":[["Un seul pays a quitté l'Union européenne : le Royaume-Uni. Il a notifié son départ le 29 mars 2017. Le délai de deux ans prévu par l'article 50 a été prolongé jusqu'au 31 janvier 2020, date de sa sortie.","ue_brexit_report_2020","pref_brexit_2021"],["Les pièces et les billets en euros ont cours légal en France depuis le 1er janvier 2002.","eco_euro_20ans"]],"note":["Ses mesures viennent du compte rendu de son discours de rentrée publié par l'UPR. Ce texte résume ses propos sans les citer mot pour mot.","upr_rentree_2026"],"maj":"2026-10-19"}},{"aj":"2026-10-03","c":"villepin","th":"travail","t":"Inscrire la négociation sociale dans la Constitution","d":"Inscrire le principe de la négociation sociale dans la loi et dans la Constitution.","s":["cnews_villepin"],"fin":"s","id":"p142"},{"c":"philippe","th":"institutions","t":"Une vingtaine d'ordonnances dès juillet 2027","d":"S'il est élu, présenter « dès juillet » 2027, au début de la session extraordinaire du Parlement, une vingtaine d'ordonnances, pour qu'elles « entrent en vigueur dès l'automne ».","s":["afp_philippe_ordonnances","sudradio_philippe_hdv"],"aj":"2026-10-09","fin":"s","id":"p143","plus":{"detail":[["S'il est élu, il présenterait « dès juillet » 2027, après d'éventuelles législatives, « une vingtaine d'ordonnances », pour qu'elles « entrent en vigueur dès l'automne ».","afp_philippe_ordonnances","sudradio_philippe_hdv"]],"pourquoi":[["Il veut mettre fin à « l'indétermination » dans laquelle vit le pays, pour une France « commandée et gouvernée ».","sudradio_philippe_hdv"]],"auj":[["Le Gouvernement peut prendre des ordonnances dans des domaines de la loi, après une autorisation du Parlement (article 38 de la Constitution).","sujet_institutions_cc_constitution"]],"maj":"2026-10-19"}},{"c":"philippe","th":"immigration","t":"Diviser par deux l'immigration légale et suspendre le regroupement familial","d":"Réduire très sensiblement le nombre de titres de séjour délivrés chaque année, à un niveau « largement inférieur à 200 000 », et un moratoire sur le regroupement familial pendant la durée du quinquennat.","s":["lcp_philippe_immig","sudradio_philippe_hdv"],"aj":"2026-10-09","fin":"s","id":"p144","plus":{"detail":[["Il veut « diviser par deux l'immigration légale », en revenant à un niveau « largement inférieur à 200.000 » titres de séjour par an, comme avant 2010.","lcp_philippe_immig","sudradio_philippe_hdv"],["Il propose « un moratoire » pendant le quinquennat sur l'immigration issue de « choix individuels », en particulier le regroupement familial, avec un « protocole additionnel » à la Convention européenne des droits de l'homme.","lcp_philippe_immig"],["Il ne veut pas ramener l'immigration « à zéro » : la France a besoin, selon lui, de « dizaines de milliers de personnes qui viennent travailler en France ».","lcp_philippe_immig"]],"pourquoi":[["« Notre politique d'intégration ne fonctionne pas », et « un certain nombre de nos services publics sont saturés ».","lcp_philippe_immig"],["« Il faut donc admettre que l'immigration est trop importante ».","sudradio_philippe_hdv"]],"auj":[["En 2025, 377 000 premiers titres de séjour ont été délivrés, dont 90 959 pour motif familial (données provisoires).","sujet_immigration_dgef_titres2025"]],"maj":"2026-10-19"}},{"c":"philippe","th":"social","t":"Une allocation familiale unique de 350 euros dès le premier enfant","d":"Une allocation familiale unique de 350 euros, versée dès le premier enfant à toutes les familles, y compris monoparentales, et une baisse d'impôt sur le revenu pendant les trois années qui suivent une naissance.","s":["lcp_philippe_alloc","orange_philippe_alloc","sudradio_philippe_hdv"],"aj":"2026-10-09","fin":"n","id":"p145","plus":{"detail":[["Une allocation familiale unique de 350 euros par mois, dès le premier enfant, pour toutes les familles, y compris monoparentales.","lcp_philippe_alloc"],["Pour les familles qui travaillent, une réduction d'impôt d'environ 3 000 euros pendant les trois années suivant une naissance.","lcp_philippe_alloc","sudradio_philippe_hdv"]],"pourquoi":[["« Aujourd'hui, on les aide beaucoup, mais à partir du deuxième et encore plus à partir du troisième. »","lcp_philippe_alloc"]],"auj":[["En 2025, la France compte 1,56 enfant par femme et 645 000 naissances.","sujet_sante_insee_bilan_demo"]],"fin_cand":[["Nous n'avons pas trouvé de coût ni de financement annoncés.",null]],"maj":"2026-10-19"}},{"c":"zemmour","th":"securite","t":"Rétablir la loi anti-casseurs et faire payer les parents des casseurs","d":"Rétablir la loi anti-casseurs supprimée en 1981 et faire payer les parents des casseurs, « quitte à leur prendre sur leurs allocations sociales ».","s":["e1_zemmour_casseurs"],"aj":"2026-10-09","fin":"s","id":"p146"},{"c":"le-pen","th":"pouvoir","t":"Le permis de conduire gratuit pour les jeunes","d":"Rendre le permis de conduire gratuit pour les jeunes dont le casier judiciaire est vierge.","s":["lcp_rn_jeunes"],"aj":"2026-10-09","a":{"v":0.7,"nature":"cout","per":"an","h":"estimation du parti"},"fin":"c","id":"p147","plus":{"detail":[["Le permis serait réservé aux jeunes présentant « un casier judiciaire vierge » qui en feraient la demande « dans leur dix-huitième année ».","lcp_rn_jeunes"]],"pourquoi":[["« Cette trajectoire éclaircit l'avenir [des jeunes] et assure que notre modèle social durera toute leur vie. »","lcp_rn_jeunes"]],"fin_cand":[["Le RN estime le coût à « une enveloppe estimée de 700 millions d'euros chaque année », soit environ 700 000 jeunes à 1 000 € en moyenne.","lcp_rn_jeunes"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"pouvoir","t":"Pas d'impôt sur le revenu avant 30 ans, jusqu'à quatre fois le SMIC","d":"Exonérer d'impôt sur le revenu les jeunes de moins de 30 ans, jusqu'à quatre fois le SMIC.","s":["lcp_rn_jeunes"],"aj":"2026-10-09","a":{"v":2,"nature":"cout","per":"an","lab":"Coût selon LCP","h":"coût indiqué par LCP"},"fin":"c","id":"p148","plus":{"detail":[["« Exonérer les jeunes de moins de 30 ans d'impôt sur le revenu, jusqu'à quatre fois le Smic. » Elle la proposait déjà en 2022.","lcp_rn_jeunes"]],"auj":[["En 2025, 47 % des foyers fiscaux ont payé un impôt sur le revenu.","sujet_eco_dgfip_ir2024"]],"fin_ind":[["Selon LCP, la mesure coûterait « 2 milliards d'euros aux finances publiques chaque année ».","lcp_rn_jeunes"]],"maj":"2026-10-19"}},{"c":"roussel","th":"education","t":"Rénover les lycées : 5 milliards tout de suite, puis 5 milliards par an","d":"Un budget rectificatif de 5 milliards d'euros pour rénover les lycées, puis 5 milliards d'euros par an pendant cinq ans pour moderniser les bâtiments scolaires.","s":["pw_roussel"],"aj":"2026-10-09","a":{"v":5,"nature":"cout","per":"an","h":"pendant cinq ans"},"fin":"f","finTxt":"Une partie des 211 milliards d'euros d'aides publiques reçues par les entreprises, et une partie du budget de la défense","id":"p149"},{"c":"roussel","th":"education","t":"Recruter 90 000 enseignants pour alléger les classes","d":"3,5 milliards d'euros pour recruter les 90 000 enseignants nécessaires pour réduire les effectifs par classe, et un remplacement de tout professeur absent en 24 heures.","s":["pw_roussel"],"aj":"2026-10-09","a":{"v":3.5,"nature":"cout","per":"nd","h":"montant annoncé"},"fin":"f","finTxt":"Une partie des 211 milliards d'euros d'aides publiques reçues par les entreprises, et une partie du budget de la défense","id":"p150"},{"c":"glucksmann","th":"eco","t":"Taxer les très gros héritages pour augmenter les salaires nets","d":"Taxer les « méga héritages » au-delà de deux mi ","th":"ecologie","t":"Mettre fin à la chasse et à la corrida","d":"Mettre fin à la chasse et à la corrida.","s":["markovic_pa_communique","huff_markovic"],"aj":"2026-10-09","fin":"s","id":"p165","plus":{"detail":[["Mettre fin à la chasse et à la corrida.","markovic_pa_communique","huff_markovic"],["Nous n'avons pas trouvé s'il s'agirait d'une interdiction immédiate ou progressive.",null]],"maj":"2026-10-19"}},{"c":"markovic","th":"securite","t":"Les animaux intégrés aux plans de secours ORSEC","d":"Intégrer les animaux aux plans ORSEC, qui organisent les secours en cas de catastrophe.","s":["markovic_pa_communique"],"aj":"2026-10-09","fin":"n","id":"p166","plus":{"detail":[["Intégrer les animaux aux plans ORSEC, qui organisent les secours en cas de catastrophe.","markovic_pa_communique"]],"auj":[["Le préfet de département a la charge de l'ordre public et de la sécurité des populations.","sujet_securite_gendarmerie_organisation"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"ecologie","t":"Supprimer l'objectif « zéro artificialisation nette » (ZAN)","d":"Supprimer l'objectif de zéro artificialisation nette des sols (ZAN), qu'elle qualifie de « norme idéologique ».","s":["batiweb_lepen_logement","sudradio_lepen_logement"],"aj":"2026-10-12","fin":"s","id":"p167","plus":{"detail":[["Elle veut supprimer le ZAN, qu'elle qualifie de « norme idéologique ».","sudradio_lepen_logement","batiweb_lepen_logement"]],"auj":[["En 2024, 15 119 hectares d'espaces naturels, agricoles et forestiers ont été consommés, le plus bas niveau depuis 2011. La loi vise à diviser ce rythme par deux sur 2021-2031, puis le ZAN en 2050.","sujet_env_portail_enaf_2011_2025","sujet_env_zan_fascicule_1"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"ecologie","t":"Un plan massif de climatisation face aux canicules","d":"« Si je suis élue présidente de la République, je mettrai en place un plan massif de climatisation. »","s":["lcp_climatisation"],"aj":"2026-10-12","fin":"n","id":"p168","plus":{"detail":[["« Si je suis élue présidente de la République, je mettrai en place un plan massif de climatisation. »","lcp_climatisation"],["Nous n'avons pas trouvé de montant ni de lieux visés (écoles, Ehpad, logements).",null]],"maj":"2026-10-19"}},{"c":"le-pen","th":"ecologie","t":"Faciliter le stockage de l'eau pour les agriculteurs","d":"Faciliter le stockage de l'eau pour les exploitations agricoles (annonce au Sommet de l'élevage, en octobre 2026).","s":["lid_philippe_rn_agri"],"aj":"2026-10-12","fin":"n","id":"p169","plus":{"detail":[["Elle veut faciliter le stockage de l'eau pour les exploitations agricoles ; elle l'a annoncé au Sommet de l'élevage, en octobre 2026.","lid_philippe_rn_agri"]],"auj":[["Le Conseil constitutionnel a validé en 2025, avec deux réserves, les mesures de la loi « Duplomb » sur les ouvrages de stockage d'eau.","sujet_env_cc_2025_891"]],"maj":"2026-10-19"}},{"c":"retailleau","th":"ecologie","t":"Supprimer l'Office français de la biodiversité (OFB)","d":"Supprimer l'OFB, l'Office français de la biodiversité.","s":["ps_congres_ja"],"aj":"2026-10-12","fin":"s","id":"p170"},{"c":"retailleau","th":"ecologie","t":"Abroger le « zéro artificialisation nette » (ZAN) par une loi d'urgence","d":"Une loi d'urgence pour « rendre la liberté de bâtir aux maires » en abrogeant le zéro artificialisation nette des sols (ZAN).","s":["e1_retailleau_immobilier"],"aj":"2026-10-12","fin":"s","id":"p171"},{"c":"retailleau","th":"ecologie","t":"Retirer le principe de précaution de la Constitution","d":"Modifier la Constitution « pour supprimer le principe de précaution ».","s":["ps_congres_ja"],"aj":"2026-10-12","fin":"s","id":"p172"},{"c":"attal","th":"ecologie","t":"Une « chasse au gâchis d'eau » : 1 000 milliards de litres d'ici 2035","d":"Lancer « la plus grande chasse au gâchis d'eau jamais menée », notamment contre les fuites des réseaux, pour récupérer 1 000 milliards de litres d'ici 2035. L'autorisation de réutiliser les eaux usées deviendrait automatique quand les normes sont respectées.","s":["lid_attal_eau"],"aj":"2026-10-12","fin":"n","finTxt":"redéployer les 400 millions d'euros de l'actuel « plan eau » et 200 millions du fonds vert, et des prêts à très long terme de la Banque des Territoires pour les investissements plus lourds. Le coût total n'est pas chiffré.","id":"p173","plus":{"detail":[["« Je m'engage à lancer la plus grande chasse au gâchis d'eau jamais menée. » Objectif : « d'ici à 2035, de récupérer 1.000 milliards de litres d'eau ».","lid_attal_eau"],["Les réseaux les moins performants seraient ciblés en priorité, avec un diagnostic et un plan de financement proposés aux communes ou intercommunalités.","lid_attal_eau"],["La réutilisation des eaux usées serait autorisée automatiquement si les normes sont respectées, avec des contrats d'eau recyclée pour l'agriculture et l'industrie.","lid_attal_eau"]],"pourquoi":[["« Un litre d'eau sur cinq se perd dans des fuites, c'est le gâchis du siècle. »","lid_attal_eau"],["« La non-réutilisation des eaux usées est un autre scandale. L'Espagne réutilise son eau 14 fois plus que nous. »","lid_attal_eau"],["Pour lui, « la maîtrise de l'eau est un enjeu existentiel pour la France ».","lid_attal_eau"]],"auj":[["Au 10 septembre 2026, 93 départements de l'Hexagone avaient des restrictions d'usage de l'eau, dont 74 au niveau « crise ».","sujet_env_bsh_2026_09"]],"fin_cand":[["Il veut redéployer « les 400 millions d'euros du +plan eau+ actuel, les 200 millions du fonds vert ». « Les investissements les plus lourds seront financés par des prêts à très long terme de la Banque des Territoires. »","lid_attal_eau"]],"maj":"2026-10-19"}},{"c":"attal","th":"ecologie","t":"Un tarif bas et fixe pour les premiers litres d'eau","d":"Garantir un tarif bas et fixe pour les premiers litres d'eau essentiels, selon la taille du foyer.","s":["lid_attal_eau"],"aj":"2026-10-12","fin":"n","id":"p174","plus":{"detail":[["« Garantir un tarif bas et fixe pour les premiers litres essentiels en fonction de la taille du foyer ».","lid_attal_eau"],["Nous n'avons pas trouvé le niveau de ce tarif ni le nombre de litres concernés.",null]],"pourquoi":[["Pour lui, « la maîtrise de l'eau est un enjeu existentiel pour la France ».","lid_attal_eau"]],"maj":"2026-10-19"}},{"c":"attal","th":"ecologie","t":"3 000 € d'amende en cas de non-respect d'un arrêté sécheresse","d":"Rendre la violation d'un arrêté sécheresse passible de 3 000 euros d'amende pour un particulier et de 15 000 euros pour une entreprise.","s":["lid_attal_eau"],"aj":"2026-10-12","fin":"s","id":"p175","plus":{"detail":[["« Violer un arrêté sécheresse sera passible de 3.000 euros d'amende pour un particulier et 15.000 pour une entreprise. »","lid_attal_eau"],["Selon l'AFP, c'est le double du montant actuel.","lid_attal_eau"]],"auj":[["En cas de sécheresse, ce sont les préfets de département qui restreignent les usages de l'eau par arrêté, selon quatre niveaux : vigilance, alerte, alerte renforcée et crise.","sujet_env_guide_secheresse_2026"]],"maj":"2026-10-19"}},{"c":"philippe","th":"ecologie","t":"Un fonds unique d'adaptation au changement climatique","d":"Réunir le Fonds Barnier (prévention des risques naturels) et le Fonds vert dans un « fonds unique d'adaptation au changement climatique », doté de 2 milliards d'euros par an.","s":["lid_philippe_climat"],"aj":"2026-10-12","a":{"v":2,"nature":"cout","per":"an","lab":"Dotation annoncée","h":"montant annoncé"},"fin":"c","id":"p176","plus":{"detail":[["Il veut réunir le Fonds Barnier et le Fonds vert dans un « fonds unique d'adaptation au changement climatique », doté de 2 milliards d'euros par an.","lid_philippe_climat"],["Il propose aussi une « journée nationale d'alerte » et de former « chaque jeune Français » aux « gestes de premiers secours ».","lid_philippe_climat"]],"pourquoi":[["Il compare ce montant aux « 5 milliards d'euros que coûtent chaque année les catastrophes naturelles ».","lid_philippe_climat"]],"maj":"2026-10-19"}},{"c":"philippe","th":"ecologie","t":"Produire un « Canadair français » pendant le quinquennat","d":"Se fixer l'objectif de produire un avion bombardier d'eau français, un « Canadair français », au cours du quinquennat, pour lutter contre les incendies.","s":["lid_philippe_climat"],"aj":"2026-10-12","fin":"n","id":"p177","plus":{"detail":[["Il se fixe l'objectif de produire un « Canadair français » pendant le quinquennat.","lid_philippe_climat"]],"pourquoi":[["Pour « ne plus attendre, quand la France brûle, qu'un autre pays veuille bien nous vendre des avions pour l'éteindre ».","lid_philippe_climat"]],"maj":"2026-10-19"}},{"c":"philippe","th":"ecologie","t":"Réutiliser 10 % des eaux usées, comme l'Italie","d":"Lutter contre le gaspillage de l'eau, avec l'objectif de réutiliser 10 % des eaux usées, comme en Italie.","s":["lid_philippe_climat"],"aj":"2026-10-12","fin":"n","id":"p178","plus":{"detail":[["Atteindre 10 % de réutilisation des eaux usées, sur le modèle de l'Italie, et lutter contre le gaspillage de l'eau.","lid_philippe_climat"]],"auj":[["Au 10 septembre 2026, 93 départements de l'Hexagone avaient des restrictions d'usage de l'eau.","sujet_env_bsh_2026_09"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"ecologie","t":"Rénover et adapter les écoles face aux canicules","d":"Faire du « grand plan de rénovation thermique et d'adaptation » des écoles face aux canicules une « priorité nationale ».","s":["lid_glucksmann_ecoles"],"aj":"2026-10-12","fin":"n","id":"p179","plus":{"detail":[["Il promet un « grand plan de rénovation thermique et d'adaptation » des écoles, érigé en « priorité nationale ».","lid_glucksmann_ecoles"],["Nous n'avons pas trouvé de montant.",null]],"pourquoi":[["« Tout était prévisible, prévu, et si peu a été anticipé, planifié, investi, réalisé. »","lid_glucksmann_ecoles"],["Selon lui, la climatisation ne remplace pas l'isolation des logements et la végétalisation des villes.","lid_glucksmann_ecoles"]],"auj":[["Les communes, les départements et les régions sont chargés de la construction et de la rénovation des écoles, collèges et lycées.","sujet_education_men_collectivites"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"ecologie","t":"Une institution de préparation aux catastrophes, comme en Finlande","d":"Créer, comme en Finlande, une institution centralisée de préparation aux chocs et aux catastrophes.","s":["lid_glucksmann_ecoles"],"aj":"2026-10-12","fin":"s","id":"p180","plus":{"detail":[["Il propose de « créer comme en Finlande une institution centralisée de préparation aux chocs et catastrophes ».","lid_glucksmann_ecoles"]],"auj":[["En cas de sécheresse, ce sont aujourd'hui les préfets de département qui restreignent les usages de l'eau par arrêté.","sujet_env_guide_secheresse_2026"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"ecologie","t":"Une loi de programmation pour la transformation écologique","d":"Mettre en place « l'équivalent de la loi de programmation militaire pour la transformation écologique ».","s":["lid_glucksmann_ecoles"],"aj":"2026-10-12","fin":"n","id":"p181","plus":{"detail":[["Il veut « mettre en place l'équivalent de la loi de programmation militaire pour la transformation écologique ».","lid_glucksmann_ecoles"],["Il défend une « révolution écologique ».","lcp_primaire_oppositions"]],"auj":[["Selon le Haut Conseil pour le climat, les émissions doivent baisser de plus de 4 % par an en 2026, 2027 et 2028 ; le rythme « a ralenti en 2025 ».","sujet_ecologie_hcc_ra2026"]],"maj":"2026-10-19"}},{"c":"melenchon","th":"ecologie","t":"Une « conscription écologique » contre les incendies","d":"Instaurer une « conscription écologique », notamment contre les incendies, avec une garde régionale de la sécurité civile pour renforcer les équipes permanentes pendant les crises.","s":["lid_melenchon_conscription"],"aj":"2026-10-12","fin":"n","id":"p182","plus":{"detail":[["« Nous envisageons une garde régionale de la sécurité civile », « une garde constituée par conscription », pour « venir en renfort efficace des équipes permanentes dans les épisodes de crise ».","lid_melenchon_conscription"],["Il l'a annoncée le 23 août 2026 à Châteauneuf-sur-Isère (Drôme), en clôture des universités d'été de La France insoumise, après les incendies de l'été.","lid_melenchon_conscription"],["Nous n'avons trouvé ni durée, ni âge concerné, ni coût annoncés.",null]],"objectif":[["« Garantir de pouvoir mobiliser en masse une réserve nombreuse et formée ».","lid_melenchon_conscription"]],"pourquoi":[["Il a vanté les mérites d'une « culture écologique pratique ».","lid_melenchon_conscription"],["« Nous allons tous bientôt débarquer sur une autre planète en sortant de chez nous » ; « Pour s'y adapter, il est vital de tout changer dans nos manières de vivre, de produire et d'échanger ».","lid_melenchon_conscription"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"etat","t":"Remplacer les régions par 13 « écorégions »","d":"Remplacer les régions actuelles par treize « écorégions » dessinées selon les grands bassins des fleuves, chargées notamment de l'eau, de la biodiversité, des forêts et de la qualité de l'air.","s":["ps_ecoregions"],"aj":"2026-10-12","fin":"s","id":"p183","plus":{"detail":[["Les 13 régions issues de la réforme de 2015 seraient remplacées par 13 « écorégions » dessinées selon les grands bassins des fleuves.","ps_ecoregions"],["Elles géreraient le cycle de l'eau et les politiques liées : qualité de l'eau, protection des sols, biodiversité, forêts, qualité de l'air, mobilités et prévention des risques climatiques.","ps_ecoregions"],["S'il est élu, « les écorégions figureront parmi les premières mesures » destinées à transformer la Constitution de la Ve République.","ps_ecoregions"]],"objectif":[["En faire « la première ligne d'alerte, de propositions et de mise en œuvre de la planification écologique », pour ruffin_travaillisme"],"aj":"2026-10-12","fin":"s","id":"p187"},{"c":"roussel","th":"ecologie","t":"Des réserves stratégiques de fourrage face à la sécheresse","d":"Organiser des « réserves stratégiques » de fourrage pour nourrir les animaux l'hiver, avec un achat de foin par l'État hors de France si les volumes manquent.","s":["cde_roussel_fourrage"],"aj":"2026-10-12","fin":"n","id":"p188"},{"c":"zemmour","th":"ecologie","t":"Six nouveaux réacteurs nucléaires EPR d'ici 2035","d":"Relancer le nucléaire au nom de la souveraineté énergétique : six nouveaux réacteurs EPR d'ici 2035, et quatorze d'ici 2045.","s":["jdd_ecologie_droite"],"aj":"2026-10-12","fin":"n","id":"p189"},{"c":"polony","th":"travail","t":"Augmenter les salaires de 20 à 30 %","d":"Augmenter les salaires de 20 à 30 %.","s":["lcp_polony"],"aj":"2026-10-15","fin":"n","id":"p190"},{"c":"polony","th":"eco","t":"Un « état d'urgence de la production »","d":"Décréter « un état d'urgence de la production » : la production française en priorité dans la commande publique, et la suppression des aides aux entreprises qui ne sont pas conditionnées à une production sur le sol national.","s":["lcp_polony"],"aj":"2026-10-15","fin":"n","id":"p191"},{"c":"le-pen","th":"europe","t":"Maintenir l'aide à l'Ukraine six mois, puis l'arrêter","d":"Maintenir l'aide financière à l'Ukraine pendant six mois après son élection, « pour ne mettre personne au pied du mur », puis l'arrêter, « car nous n'avons plus les moyens de le faire ».","s":["bfm_lepen_ukraine"],"aj":"2026-10-15","fin":"n","id":"p192","plus":{"detail":[["Elle maintiendrait l'aide financière à l'Ukraine six mois après son élection, « pour ne mettre personne au pied du mur », puis l'arrêterait, « car nous n'avons plus les moyens de le faire ».","bfm_lepen_ukraine"]],"auj":[["Le 23 avril 2026, le Conseil de l'Union européenne a finalisé un prêt de 90 milliards d'euros à l'Ukraine pour 2026 et 2027.","sujet_europe_consilium_ukraine"]],"maj":"2026-10-19"}},{"c":"attal",
