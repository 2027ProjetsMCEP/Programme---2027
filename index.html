0, 500 euros d'augmentation », et demande « une augmentation massive des salaires, des allocations et des pensions ».","lo_brochure_2026"]],"objectif":[["Pouvoir « gagner au moins 2 200 euros net par mois pour s'en sortir ».","lo_brochure_2026"]],"pourquoi":[["« C'est en prenant sur les profits qu'on pourra répartir le travail entre tous » et « permettre à chaque travailleur de s'en sortir ».","lo_journal_3031"]],"auj":[["Le Smic net mensuel pour un temps plein est de 1 477,93 € depuis le 1er juin 2026.","sujet_travail_sp_smic_juin"],["Passer à 2 200 € net ferait environ 722 € de plus par mois, soit +49 % (calcul de l'appli à partir de ce montant).","sujet_travail_sp_smic_juin"]],"fin_cand":[["Elle ne donne pas de coût. Selon elle, l'argent doit être pris « sur les profits ».","lo_journal_3031"]],"maj":"2026-10-19"}},{"c":"arthaud","th":"retraites","t":"Aucune retraite en dessous de 2 200 € net par mois","d":"Aucune pension de retraite inférieure à 2 200 € net par mois.","s":["lbb_arthaud","lo_journal_3031"],"aj":"2026-10-01","fin":"n","id":"p002","plus":{"detail":[["Elle met sur le même plan « un salaire, un revenu ou une pension d'au moins 2 200 euros net ».","lo_journal_3031"],["Elle demande aussi que les pensions soient indexées « sur la hausse des prix ».","lo_brochure_2026"]],"objectif":[["Que chacun, actif ou retraité, ait au moins 2 200 euros net par mois.","lo_journal_3031"]],"pourquoi":[["Son journal, Lutte ouvrière, écrit : « Les retraites ne doivent pas baisser, car elles sont bien inférieures au salaire, déjà bas, de toute une vie. »","lo_journal_3031"]],"auj":[["Fin 2023, la pension moyenne de droit direct était de 1 607 euros brut par mois.","drees_pensions_2025"]],"fin_cand":[["Elle ne donne pas de coût. Son journal écrit que la retraite « devrait être financée intégralement par le patronat ».","lo_journal_3031"]],"maj":"2026-10-19"}},{"c":"arthaud","th":"travail","t":"Des salaires qui suivent les prix, et le travail réparti entre tous","d":"Indexer les salaires sur la hausse des prix (« quand les prix montent, notre salaire doit suivre ! ») et « imposer que le travail soit réparti entre tous ».","s":["lo_brochure_2026"],"aj":"2026-10-01","fin":"n","id":"p003","plus":{"detail":[["Indexer les salaires sur les prix : « quand les prix montent, notre salaire doit suivre ! », et sur leur hausse réelle, « pas ceux de l'inflation officielle qui sous-estime toujours la réalité ».","lo_brochure_2026"],["« Imposer que le travail soit réparti entre tous » et « baisser le temps et la charge de travail sans perte de salaire ».","lo_brochure_2026"],["Faire établir par les salariés « une liste d'embauches dont ils auraient besoin », ce qui donnerait selon elle « des centaines de milliers d'emplois à créer tout de suite ! ».","lo_brochure_2026"],["Son journal, Lutte ouvrière, écrit aussi qu'« il faut interdire les licenciements sous toutes les formes ».","lo_journal_3031"]],"objectif":[["Faire en sorte que « personne ne soit condamné au chômage ».","lo_brochure_2026"]],"pourquoi":[["Il faut selon elle baisser le temps de travail sans perte de salaire « pour permettre à tous de vivre ».","lo_brochure_2026"]],"auj":[["Le Smic est revalorisé chaque année en janvier, et automatiquement en cours d'année quand les prix augmentent d'au moins 2 %.","sujet_travail_insee_smic"],["La durée légale du travail est de 35 heures par semaine.","sujet_travail_sp_duree_travail"]],"fin_cand":[["Nous n'avons pas trouvé de coût annoncé.",null]],"maj":"2026-10-19"}},{"c":"arthaud","th":"immigration","t":"Régulariser tous les sans-papiers","d":"Régulariser tous les sans-papiers.","s":["lo_brochure_2026"],"aj":"2026-10-01","fin":"s","id":"p004","plus":{"detail":[["« Régularisation de tous les sans-papiers, liberté de circulation et d'installation pour chaque être humain de cette planète ! »","lo_brochure_2026"],["Elle dénonce l'« Europe-forteresse ».","lo_brochure_2026"]],"pourquoi":[["« Refusons de nous barricader contre des travailleurs plus pauvres que nous. »","lo_brochure_2026"]],"auj":[["En 2025, 28 610 personnes ont été régularisées (-10,1 %) et 384 230 premiers titres de séjour ont été délivrés, selon le ministère de l'Intérieur.","ps_titres_2025"]],"maj":"2026-10-19"}},{"c":"arthaud","th":"defense","t":"Contre la hausse du budget de l'armée","d":"S'opposer à la hausse des dépenses militaires.","s":["lo_brochure_2026"],"aj":"2026-10-01","fin":"n","id":"p005","plus":{"detail":[["Elle s'oppose aux « 36 milliards de rallonge pour l'armée » votés selon elle « quasiment sans discussion ».","lo_brochure_2026"],["Elle veut ces milliards « pour les hôpitaux, les écoles, pas pour la guerre ! ».","lo_brochure_2026"]],"objectif":[["Refuser « l'unité nationale derrière les dirigeants irresponsables ».","lo_brochure_2026"]],"pourquoi":[["« La seule guerre que les travailleurs doivent se préparer à mener, c'est celle contre le capitalisme »","lo_brochure_2026"],["Elle veut financer « les hôpitaux, les écoles ou la lutte contre les incendies plutôt que les marchands d'armes ».","lo_journal_3031"]],"auj":[["La loi d'août 2026 sur la programmation militaire prévoit 436 milliards d'euros pour la défense sur 2024-2030, dont 36 milliards de ressources supplémentaires sur 2026-2030.","sujet_europe_senat_loi_lpm"],["En 2026, la mission Défense dispose de 56,9 milliards d'euros hors pensions.","sujet_europe_def_chiffres2026"]],"fin_cand":[["Nous n'avons pas trouvé de coût ni d'économie chiffrés de sa part.",null]],"maj":"2026-10-19"}},{"c":"attal","th":"immigration","t":"Des quotas d'immigration votés chaque année par le Parlement","d":"Fixer chaque année des quotas d'immigration votés par le Parlement, les besoins de main-d'œuvre étant définis avec les partenaires sociaux.","s":["orange_attal","ps_meeting_attal"],"aj":"2026-10-01","fin":"s","id":"p006","plus":{"detail":[["Il propose une « préférence travail pour l'immigration » : « Les partenaires sociaux définiront donc les besoins en immigration pour notre économie », besoins « qui seront ensuite votés sous forme de quotas au Parlement ».","orange_attal"],["Lors de son meeting du 30 mai 2026, il a parlé de « quotas d'immigration de travail, que nous fixerons, et votés par le Parlement ».","ps_meeting_attal"]],"pourquoi":[["« L'immigration zéro, ce n'est ni possible, ni souhaitable, pas plus que le fantasme des portes grandes ouvertes. »","ps_meeting_attal"]],"auj":[["En 2025, 377 000 premiers titres de séjour ont été délivrés, dont 50 848 pour motif économique (données provisoires).","sujet_immigration_dgef_titres2025"]],"maj":"2026-10-19"}},{"c":"attal","th":"numerique","t":"Former 20 millions d'actifs à l'intelligence artificielle en cinq ans","d":"Former 20 millions d'actifs à l'intelligence artificielle en cinq ans.","s":["orange_attal","x_attal_ia"],"aj":"2026-10-01","fin":"n","id":"p007","plus":{"detail":[["Il annonce un chantier sur l'intelligence artificielle « visant à former 20 millions de salariés en cinq ans ».","orange_attal"]],"objectif":[["Que « la France sera la patrie de l'intelligence artificielle ».","ps_meeting_attal"]],"pourquoi":[["Pour lui, l'intelligence artificielle, « c'est une question de puissance et d'avenir ».","ps_meeting_attal"]],"auj":[["En 2025, 48 % des personnes de 12 ans et plus utilisaient des services d'IA générative, 15 points de plus qu'en un an.","sujet_numerique_arcep_cp"],["Depuis le 2 février 2025, le règlement européen sur l'IA impose aux organisations qui utilisent l'IA des obligations de formation (« AI literacy »).","sujet_numerique_ec_ai_act"]],"maj":"2026-10-19"}},{"c":"attal","th":"travail","t":"Réduire l'écart entre salaire brut et salaire net, et réformer le chômage","d":"Réduire l'écart entre salaire brut et salaire net (« droit au brut ») et réformer l'assurance chômage.","s":["orange_attal","ps_meeting_attal"],"aj":"2026-10-01","fin":"n","id":"p008","plus":{"detail":[["« Ma priorité sera les salaires. » Il veut un « droit au brut » : « Avec ce \"droit au brut\", nous pouvons atteindre une hausse inédite des salaires sur cinq ans. »","orange_attal"],["Lors de son meeting, il a promis « un choc des salaires » et de « rapprocher le net du brut, en baissant les charges ».","ps_meeting_attal"],["« Cela passera par des économies sur les dépenses sociales qui plombent nos comptes publics » « et par une réforme de l'assurance chômage ».","orange_attal"],["Nous n'avons pas trouvé le détail de la réforme de l'assurance chômage qu'il propose.",null]],"pourquoi":[["« Nos dépenses sociales ne peuvent plus autant reposer sur les Français qui travaillent. »","ps_meeting_attal"]],"auj":[["Au Smic, un salarié à temps plein touche 1 867,02 € brut par mois, soit 1 477,93 € net, depuis le 1er juin 2026.","sujet_travail_sp_smic_juin"],["Les règles de l'assurance chômage sont négociées par les représentants des employeurs et des salariés ; sans accord, l'État les fixe par décret.","sujet_travail_unedic_qui_definit"]],"fin_cand":[["Il ne donne pas de coût. Il veut financer la mesure par « des économies sur les dépenses sociales » et une réforme de l'assurance chômage.","orange_attal"]],"maj":"2026-10-19"}},{"c":"attal","th":"securite","t":"Un état d'urgence contre le narcotrafic","d":"Mettre en place un état d'urgence contre le narcotrafic, une mesure dans laquelle il dit « se retrouver ».","s":["orange_attal"],"aj":"2026-10-01","fin":"s","id":"p009","plus":{"detail":[["Selon Le Parisien, cité par Orange, il dit « se retrouver » dans la mise en place d'un état d'urgence contre le narcotrafic, « une mesure plébiscitée par Bruno Retailleau (Les Républicains) et Édouard Philippe (Horizons) ».","orange_attal"],["Nous n'avons pas trouvé de sa part le détail de ce que permettrait cet état d'urgence.",null]],"auj":[["La loi « visant à sortir la France du piège du narcotrafic » a été promulguée en juin 2025, après une décision du Conseil constitutionnel du 12 juin 2025.","sujet_securite_senat_narcotrafic_loi"]],"maj":"2026-10-19"}},{"c":"attal","th":"retraites","t":"Plus d'âge légal : on part selon ses années de travail","d":"Ne plus fixer d'âge légal mais une durée de cotisation, avec une décote si l'on part tôt et une surcote si l'on part tard. Ajouter une part de capitalisation, avec 1 000 euros versés par l'État à chaque naissance, et confier la gestion du système aux partenaires sociaux.","s":["ps_retraites","ps_meeting_attal"],"aj":"2026-10-01","fin":"n","id":"p010","plus":{"detail":[["« On n'en est plus à bouger les paramètres ou les curseurs. » « Je propose qu'on prenne la durée de cotisation. »","ps_retraites"],["« Vous avez une vraie décote si vous partez tôt, une vraie surcote si vous partez tard. »","ps_retraites"],["Il propose un « vrai pilier de capitalisation », avec « 1.000 euros donnés par l'Etat à la naissance de chaque enfant ».","ps_retraites","ps_meeting_attal"],["Il veut « confier la gestion de notre système de retraite aux partenaires sociaux ».","ps_meeting_attal"]],"pourquoi":[["Selon lui, « ce système objectivement ne tient plus ».","ps_retraites"]],"auj":[["Depuis le 1er septembre 2026, l'âge légal va de 62 ans et 9 mois (nés en 1964) à 64 ans (nés à partir de 1969), avec 170 à 172 trimestres requis pour les générations 1964 à 1968.","sujet_retraites_sp_suspension"],["Les retraites complémentaires des salariés du privé (Agirc-Arrco) sont déjà pilotées par les partenaires sociaux.","sujet_retraites_cor_agirc"],["En 2025, les dépenses de retraite représentent 14,1 % du PIB, soit 422 milliards d'euros.","sujet_retraites_cor_ra2026"]],"fin_cand":[["Nous n'avons pas trouvé de chiffrage de sa part, ni pour la capitalisation ni pour les 1 000 euros par naissance.",null]],"maj":"2026-10-19"}},{"c":"attal","th":"education","t":"Moins de 20 élèves par classe en primaire, et les profs augmentés","d":"Moins de 20 élèves par classe en primaire et une hausse de 200 à 500 € net par mois pour les enseignants.","s":["ps_ecole_attal_philippe","ps_ecole","ps_meeting_attal"],"aj":"2026-10-01","a":{"v":2.5,"nature":"cout","per":"nd","h":"coût annoncé de la hausse des salaires"},"fin":"f","finTxt":"Notamment des économies sur les dépenses sociales","id":"p011","plus":{"detail":[["Il fixe « l'objectif de passer sous la barre des 20 élèves par classe en primaire ».","ps_ecole"],["Il promet « une augmentation de 200 euros nets par mois, pouvant atteindre 500 euros en milieu de carrière », et veut « inscrire ces engagements dans une loi de programmation pour l'Éducation nationale dès 2027 ».","ps_ecole_attal_philippe"],["Il veut aussi « recruter et mieux payer les AESH (accompagnants d'élèves en situation de handicap), essentiels à l'école inclusive ».","ps_meeting_attal"]],"objectif":[["Avoir « moins de 20 élèves par classe », « comme dans les meilleurs systèmes éducatifs européens ».","ps_meeting_attal"]],"pourquoi":[["« Le métier a été progressivement smicardisé. »","ps_ecole_attal_philippe"]],"auj":[["À la rentrée 2025, il y a en moyenne 21,1 élèves par classe en élémentaire et 21,7 en maternelle.","sujet_education_depp_enc2026"],["En 2025-2026, 366 100 enseignants travaillent dans le premier degré.","sujet_education_depp_enc2026"]],"fin_cand":[["« Le coût, évalué à 2,5 milliards d'euros par son entourage », « serait notamment financé par des économies sur les dépenses sociales ».","ps_ecole_attal_philippe"]],"maj":"2026-10-19"}},{"c":"attal","th":"education","t":"Un certificat d'études avant le collège, le brevet obligatoire pour le lycée","d":"Rétablir un certificat d'études à l'entrée en 6e, avec une année passerelle pour les élèves les plus en difficulté, et rendre le brevet obligatoire pour entrer en seconde.","s":["ps_ecole_attal_philippe","ps_ecole","orange_attal"],"aj":"2026-10-01","fin":"n","id":"p012","plus":{"detail":[["« Il propose un certificat d'études à l'entrée en sixième » et « une année passerelle pour les élèves les plus en difficulté ».","ps_ecole_attal_philippe"],["Ce certificat serait « destiné à vérifier que les élèves maîtrisent les connaissances fondamentales ».","ps_ecole"],["Il veut aussi « un brevet obligatoire pour accéder à la seconde » : « Je pense notamment au brevet obligatoire pour passer au lycée ».","ps_ecole_attal_philippe","orange_attal"],["Il « veut aussi généraliser les groupes de niveau en français et en mathématiques ».","ps_ecole_attal_philippe"]],"auj":[["Depuis la rentrée 2024, le français et les mathématiques sont enseignés en groupes de besoins en 6e et en 5e.","sujet_education_men_college"]],"maj":"2026-10-19"}},{"c":"attal","th":"budget","t":"Supprimer 100 000 postes de fonctionnaires d'État","d":"Supprimer 100 000 postes de fonctionnaires d'État par des départs à la retraite non remplacés et un plan de départs volontaires, en préservant l'Éducation nationale, les Armées, la Justice et l'Intérieur.","s":["ps_attal_fonctionnaires","acteurspublics_attal"],"aj":"2026-10-01","a":{"v":7,"nature":"economie","per":"nd","h":"économie annoncée"},"fin":"c","id":"p013","plus":{"detail":[["Il propose « la suppression de 100 000 postes de fonctionnaires d'État ».","ps_attal_fonctionnaires"],["Pour cela, il veut « assumer le non-remplacement de certains départs à la retraite » et lancer « un plan de départs volontaires ».","ps_attal_fonctionnaires"],["Il « préserve l'Éducation nationale, les Armées, la Justice et l'Intérieur des suppressions de poste ».","ps_attal_fonctionnaires"],["Il l'a annoncé dans un entretien au Parisien, en juillet 2026.","ps_attal_fonctionnaires","acteurspublics_attal"]],"pourquoi":[["Selon lui, « la clé, ce sont les dépenses sociales ».","ps_attal_fonctionnaires"]],"auj":[["Fin 2024, la fonction publique d'État compte 2,59 millions d'agents, sur 5,9 millions dans les trois fonctions publiques.","sujet_etat_insee_fp2024"]],"fin_cand":[["Il annonce une économie de « sept milliards d'euros ».","ps_attal_fonctionnaires"]],"maj":"2026-10-19"}},{"c":"attal","th":"logement","t":"Une loi de programmation pluriannuelle pour le logement","d":"Voter une loi de programmation pluriannuelle pour le logement, avec une simplification du ZAN, un statut renforcé pour le bailleur privé et une garantie publique ou un prêt à taux zéro pour les primo-accédants solvables.","s":["gazette_logement_2026"],"aj":"2026-10-01","fin":"n","id":"p014","plus":{"detail":[["Il propose de conjuguer un « choc d'offre et de demande » grâce à une « loi de programmation pluriannuelle garante de stabilité ».","gazette_logement_2026"],["Cette loi contiendrait « une simplification du Zan, un approfondissement du statut du bailleur privé ».","gazette_logement_2026"],["Elle prévoirait aussi « la mise en place d'une garantie publique ou d'un prêt à taux zéro pour les primo-accédants solvables ».","gazette_logement_2026"],["Sur la rénovation, il dit : « je défends MaPrime Renov' », en l'élargissant aux travaux d'un seul type (mono-gestes). Il ajoute : « j'étudie le fait de décentraliser le pilotage, y compris de la distribution d'aides ».","gazette_logement_2026"]],"pourquoi":[["Il qualifie le logement de « grand plantage économique dans le macronisme ».","gazette_logement_2026"]],"auj":[["En 2025, 274 611 logements ont été mis en chantier, 21,3 % de moins que la moyenne des cinq années précédentes.","sujet_logement_sdes_construction2025"]],"note":["Une ancienne version de cette fiche indiquait un objectif de 400 000 logements par an, repris d'un comparateur. Nous ne l'avons trouvé dans aucune déclaration de 2026 : il a été retiré.",null],"maj":"2026-10-19"}},{"c":"dupont-aignan","th":"immigration","t":"10 000 agents de plus aux frontières et la sortie de l'espace Schengen","d":"Recruter 10 000 agents spécialisés pour le contrôle des frontières et sortir de l'espace Schengen.","s":["dlf_immigration"],"aj":"2026-10-01","fin":"n","id":"p015","plus":{"detail":[["Recruter 10 000 agents spécialisés pour le contrôle des frontières.","dlf_immigration"],["Sortir de l'espace Schengen, pour contrôler les frontières nationales.","dlf_immigration"]],"auj":[["En 2025, 377 000 premiers titres de séjour ont été délivrés et 145 210 demandes d'asile ont été enregistrées par l'Ofpra (données provisoires).","sujet_immigration_dgef_titres2025","sujet_immigration_ofpra_bilan2025"],["Depuis le 12 juin 2026, les règles européennes du pacte sur la migration et l'asile s'appliquent.","sujet_immigration_consilium_pacte"]],"note":["Debout la France indique actualiser son programme pour 2027 : seules les pages marquées « Projet 2027 » sont reprises ici.","dlf_projet"],"maj":"2026-10-19"}},{"c":"dupont-aignan","th":"immigration","t":"Suspendre le regroupement familial","d":"Suspendre le regroupement familial et supprimer les aides sociales non contributives pour les étrangers.","s":["dlf_immigration"],"aj":"2026-10-01","fin":"n","id":"p016","plus":{"detail":[["Suspendre le regroupement familial.","dlf_immigration"],["Supprimer les aides sociales non contributives (celles versées sans avoir cotisé) pour les étrangers.","dlf_immigration"]],"auj":[["En 2025, 90 959 premiers titres de séjour ont été délivrés pour motif familial, sur 377 000 (données provisoires).","sujet_immigration_dgef_titres2025"]],"note":["Debout la France indique actualiser son programme pour 2027 : seules les pages marquées « Projet 2027 » sont reprises ici.","dlf_projet"],"maj":"2026-10-19"}},{"c":"dupont-aignan","th":"immigration","t":"Supprimer le droit du sol par référendum","d":"Supprimer le droit du sol par référendum ; exiger 10 ans de résidence pour la naturalisation, avec un plafond annuel voté par le Parlement ; quotas d'étudiants étrangers par filière et par pays.","s":["dlf_immigration"],"aj":"2026-10-01","fin":"s","id":"p017","plus":{"detail":[["Supprimer le droit du sol par référendum.","dlf_immigration"],["Exiger 10 ans de résidence pour être naturalisé, avec un plafond annuel voté par le Parlement.","dlf_immigration"],["Fixer des quotas d'étudiants étrangers par filière et par pays.","dlf_immigration"]],"auj":[["En 2025, 98 139 personnes ont acquis la nationalité française, dont 42 246 par décret (naturalisation).","sujet_immigration_dgef_nationalite2025"],["La loi fixe les règles de la nationalité (article 34 de la Constitution).","sujet_immigration_cc_constitution"]],"note":["Debout la France indique actualiser son programme pour 2027 : seules les pages marquées « Projet 2027 » sont reprises ici.","dlf_projet"],"maj":"2026-10-19"}},{"c":"dupont-aignan","th":"pouvoir","t":"Baisser les taxes sur l'essence de 50 centimes par litre","d":"Baisser le prix des carburants de 50 centimes par litre, en supprimant les certificats d'économie d'énergie, la TVA sur la taxe et 20 centimes d'accises.","s":["sudradio_nda_0920","nda_site"],"aj":"2026-10-01","fin":"n","id":"p018","plus":{"detail":[["« Je supprime les certificats d'économie d'énergie inventés par une directive européenne : 15 centimes. »","sudradio_nda_0920"],["« Je supprime la TVA sur la taxe. » Puis : « Et je supprime les accises de 20 centimes : 50 centimes, pour arriver au niveau de l'Espagne. »","sudradio_nda_0920"],["Son site de campagne évoquait auparavant une baisse de 40 centimes par litre.","nda_site"]],"pourquoi":[["« Donc il y a de l'argent, il est mal dépensé. »","sudradio_nda_0920"]],"auj":[["En septembre 2026, les prix de l'énergie ont augmenté de 21,2 % sur un an (estimation provisoire de l'Insee).","sujet_pouvoir_insee_ipc_sept"]],"fin_cand":[["Il ne chiffre pas le coût de cette baisse pour l'État. Selon lui, « il y a de l'argent, il est mal dépensé ».","sudradio_nda_0920"]],"maj":"2026-10-19"}},{"c":"dupont-aignan","th":"europe","t":"Arrêter les aides financières à l'Ukraine et négocier la paix","d":"Mettre fin aux aides financières à l'Ukraine et faire la paix, avec une Ukraine neutre.","s":["nda_site","sudradio_nda_0920","entrevue_nda_0916"],"aj":"2026-10-01","fin":"n","id":"p019","plus":{"detail":[["« Je veux faire la paix en Ukraine. » « Faisons-en un pays neutre, défendons sa souveraineté. »","sudradio_nda_0920"],["Selon lui, « les Français sont appauvris parce qu'on donne de l'argent à l'Ukraine ».","entrevue_nda_0916"]],"pourquoi":[["Il affirme que « Ukrainiens et Russes se sont entendus sur un plan de paix ».","sudradio_nda_0920"]],"auj":[["Le 23 avril 2026, le Conseil de l'Union européenne a finalisé un prêt de 90 milliards d'euros à l'Ukraine pour 2026 et 2027.","sujet_europe_consilium_ukraine"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"education","t":"Les profs augmentés d'au moins 10 %, jusqu'à 25 % en milieu de carrière","d":"Augmenter d'au moins 10 % le salaire de tous les enseignants, jusqu'à 25 % selon la carrière, réduire les effectifs en primaire et rénover les écoles, dans un « plan de sauvetage de l'école publique » sur cinq ans.","s":["ps_ecole","ps_glucksmann_propositions","lcp_debat3"],"aj":"2026-10-01","a":{"v":6,"nature":"cout","per":"nd","h":"coût annoncé de la hausse des salaires"},"fin":"c","id":"p020","plus":{"detail":[["Il veut augmenter « tous les enseignants » de 10 %, avec une hausse pouvant atteindre 25 % selon la carrière.","ps_ecole"],["C'est l'un des trois volets d'un « plan de sauvetage de l'école publique » sur cinq ans : salaires, moins d'élèves par classe en primaire, rénovation des écoles.","ps_glucksmann_propositions","ps_ecole"],["Il veut inscrire ces mesures dans une loi de programmation sur cinq ans, son « premier acte » s'il est élu.","lcp_debat3"]],"objectif":[["« Rattraper les moyennes européennes » de salaire des enseignants.","ps_ecole"]],"pourquoi":[["Selon lui, l'école française « reproduit le plus les inégalités en Europe » et « maltraite le plus les enseignants ».","ps_ecole"],["Il affirme qu'un enseignant du primaire en France gagne moins qu'un enseignant portugais ou slovène.","ps_glucksmann_propositions"]],"auj":[["En 2025-2026, 851 500 enseignants travaillent dans les écoles et établissements. À la rentrée 2025, il y a en moyenne 21,1 élèves par classe en élémentaire.","sujet_education_depp_enc2026"]],"fin_cand":[["« Le coût annoncé est annoncé à six milliards d'euros. » L'article ne précise pas sur quelle durée.","ps_ecole"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"eco","t":"Faire davantage contribuer les plus grandes fortunes","d":"Rééquilibrer l'impôt entre travail, capital, retraites et successions pour faire davantage contribuer les plus grandes fortunes.","s":["lcp_glucksmann","ps_glucksmann_propositions"],"aj":"2026-10-01","fin":"n","id":"p021","plus":{"detail":[["Il veut rééquilibrer la « taxation entre le travail, le capital, la retraite et l'héritage ».","lcp_glucksmann"],["Il veut « mettre fin à toute forme de sécession des ultrariches » et un « nouveau contrat social et fiscal favorable aux travailleurs ».","lcp_glucksmann"]],"pourquoi":[["Il veut lutter contre une « société de rentiers ». Il décrit la France comme « une société de privilèges comme sous l'Ancien Régime ».","lcp_glucksmann","ps_glucksmann_propositions"]],"auj":[["En 2025, les prélèvements obligatoires représentent 43,6 % du PIB.","sujet_eco_insee_apu_2025"],["Depuis 2026, une contribution différentielle impose au moins 20 % aux foyers dont le revenu fiscal dépasse 250 000 € (personne seule) ou 500 000 € (couple).","sujet_eco_ecogouv_lfi2026_particuliers"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"retraites","t":"Abroger la réforme de 2023 et un départ selon la pénibilité","d":"Abroger la réforme des retraites de 2023, sans revenir à 60 ans, et faire partir plus tôt les carrières hachées et les métiers pénibles, plus tard ceux qui ont une espérance de vie en bonne santé plus longue.","s":["lcp_glucksmann","lcp_debat3","ps_retraites","ps_glucksmann_propositions"],"aj":"2026-10-01","fin":"n","id":"p022","plus":{"detail":[["« Nous abrogerons la réforme injuste de 2023. » Il exclut le retour à 60 ans et s'en tient à 62 ans.","lcp_debat3"],["« L'équité exige que ceux qui ont les carrières les plus hachées et les métiers les plus difficiles puissent partir » plus tôt ; les cadres « devront en revanche partir plus tard ».","lcp_glucksmann"],["Nous n'avons pas trouvé de chiffrage ni de critères précis de pénibilité.",null]],"auj":[["La loi de financement de la sécurité sociale pour 2026 a suspendu jusqu'en 2028 le relèvement de l'âge légal prévu par la réforme de 2023. Le COR chiffre cette suspension à 1,8 milliard d'euros par an en moyenne jusqu'en 2032.","sujet_retraites_sp_suspension"],["Depuis le 1er septembre 2026, l'âge légal va de 62 ans et 9 mois (nés en 1964) à 64 ans (nés à partir de 1969).","sujet_retraites_sp_suspension"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"immigration","t":"Une convention citoyenne tirée au sort sur l'immigration","d":"Confier la définition de la politique d'immigration à une convention citoyenne tirée au sort.","s":["lcp_glucksmann","ps_glucksmann_propositions"],"aj":"2026-10-01","fin":"s","id":"p023","plus":{"detail":[["Des citoyens tirés au sort débattraient, confrontés aux données démographiques, économiques et sécuritaires ; leurs propositions seraient ensuite soumises au vote du Parlement.","ps_glucksmann_propositions","lcp_glucksmann"],["« Non, l'immigration zéro n'est ni souhaitable, ni possible. Et non, s'installer en France n'est pas un droit universel. »","lcp_glucksmann"]],"pourquoi":[["« Au lieu de fuir le débat migratoire, nous l'assumerons. »","lcp_glucksmann"],["Il critique l'incapacité de l'État à faire appliquer les obligations de quitter le territoire (OQTF).","ps_glucksmann_propositions"]],"auj":[["Des conventions citoyennes tirées au sort ont déjà été organisées sur le climat et sur la fin de vie.","lcp_glucksmann"],["Au premier semestre 2025, 7 426 OQTF ont été exécutées pour 69 888 prononcées, d'après la DGEF citée par le Sénat.","sujet_immigration_senat_plf2026_immigration"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"institutions","t":"Un service civique obligatoire de 10 mois pour les jeunes","d":"Créer un service civique obligatoire de 10 mois pour les jeunes (Ehpad, écoles, services publics, missions d'intérêt général).","s":["lcp_glucksmann","ps_glucksmann_propositions"],"aj":"2026-10-01","fin":"n","id":"p024","plus":{"detail":[["Les jeunes « consacreront dix mois de leur vie à la nation » : plusieurs semaines de regroupement, puis des missions dans les Ehpad, les écoles, les services publics ou les associations.","ps_glucksmann_propositions"],["La dimension militaire resterait volontaire.","lcp_glucksmann"],["Nous n'avons pas trouvé de coût ni de date de mise en place.",null]],"objectif":[["« Retisser le lien civique ».","lcp_glucksmann"]],"auj":[["Aujourd'hui, les jeunes Français participent à une Journée défense et citoyenneté (JDC).","sujet_europe_sp_jdc"]],"maj":"2026-10-19"}},{"c":"glucksmann","th":"europe","t":"Un grand emprunt européen et la fin du droit de veto dans l'Union européenne","d":"Plan de souveraineté européenne financé par un grand emprunt européen et suppression du droit de veto au sein de l'Union.","s":["lcp_glucksmann"],"aj":"2026-10-01","fin":"n","id":"p025","plus":{"detail":[["Il défend un grand emprunt européen et la suppression du droit de veto dans l'Union européenne, « afin de lever les freins existants ».","lcp_glucksmann"],["Il se dit « partisan d'une Europe fédérale » et soutient « la construction d'une défense européenne ».","lcp_primaire_oppositions"]],"pourquoi":[["Il dénonce le « déni » de ceux qui refusent de voir la menace russe.","lcp_glucksmann"]],"auj":[["Au Conseil de l'Union européenne, la politique étrangère et de sécurité commune se décide à l'unanimité, sauf exceptions.","sujet_europe_consilium_unanimity"],["L'Union a adopté en 2025 SAFE, un instrument de prêts allant jusqu'à 150 milliards d'euros pour les investissements de défense des États membres.","sujet_europe_consilium_safe"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"budget","t":"140 milliards d'euros d'économies d'ici 2032 et une règle d'or dans la Constitution","d":"Réaliser 140 milliards d'euros d'économies d'ici 2032, pour ramener la dette publique de 121 % du PIB en 2027 à 112 % en 2032, et inscrire une règle d'or budgétaire dans la Constitution par référendum, dans les douze mois suivant l'élection.","s":["ps_lepen_budget","gazette_lepen_140","sudradio_lepen"],"aj":"2026-10-01","a":{"v":140,"nature":"economie","per":"total","h":"d'ici 2032, soit 15 milliards de plus que le chiffre annoncé fin août"},"fin":"c","id":"p026","plus":{"detail":[["Le RN vise « 140 milliards d'euros nets » d'économies en 2032 par rapport à 2026, et une dette qui passerait de « 121 % en 2027 à 112 % en 2032 ».","gazette_lepen_140","ps_lepen_budget"],["Principales économies : réorganisation de l'État (20,7 milliards dès 2027), immigration (15 milliards en 2027), collectivités (8,2 milliards), contribution à l'Union européenne (-8,9 milliards nets), retraites (15 à 20 milliards à terme).","ps_lepen_budget","gazette_lepen_140"],["Une partie servirait à 30 milliards d'euros de baisses d'impôts.","gazette_lepen_140"],["La règle d'or serait inscrite dans la Constitution par référendum « dans les douze mois » suivant l'élection.","ps_lepen_budget"]],"pourquoi":[["« Le premier qui doit faire un effort, c'est l'Etat. »","sudradio_lepen"],["Le RN invoque la hausse des taux d'intérêt et un budget du gouvernement qu'il juge « indigent ».","ps_lepen_budget"]],"auj":[["Le projet de budget pour 2027 prévoit un déficit public de 5,0 % du PIB et une dette de 121,7 % du PIB en 2027.","sujet_budget_ecogouv_plf2027","sujet_budget_an_plf2027"]],"fin_cand":[["Elle annonce 140 milliards d'euros nets d'économies d'ici 2032, dont une partie finance 30 milliards de baisses d'impôts.","gazette_lepen_140"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"retraites","t":"Retour de la retraite à 62 ans, et à 60 ans pour qui a commencé avant 20 ans","d":"Ramener l'âge légal à 62 ans avec 42 annuités, et à 60 ans avec 40 annuités pour ceux qui ont commencé à travailler avant 20 ans.","s":["sudradio_lepen","ps_retraites"],"aj":"2026-10-01","a":{"v":9,"nature":"cout","per":"an","h":"en année pleine, montant annoncé"},"fin":"c","id":"p027","plus":{"detail":[["Retour de l'âge légal à 62 ans, avec 42 annuités requises hors carrières longues.","ps_retraites"],["Ceux qui ont commencé à travailler « avant 20 ans » partiraient à 60 ans après 40 ans de cotisation.","sudradio_lepen","ps_retraites"],["Le RN prévoit aussi un « pilier de capitalisation ».","gazette_lepen_140"]],"pourquoi":[["Elle présente la retraite à 60 ans pour les carrières longues comme un « choix de société ».","sudradio_lepen"]],"auj":[["Depuis le 1er septembre 2026, l'âge légal va de 62 ans et 9 mois (nés en 1964) à 64 ans (nés à partir de 1969), avec 170 à 172 trimestres requis pour les générations 1964 à 1968.","sujet_retraites_sp_suspension"],["Le système de retraite est estimé en déficit de 5,1 milliards d'euros en 2025.","sujet_retraites_cor_ra2026"]],"fin_cand":[["Elle chiffre la mesure à 9 milliards d'euros par an en année pleine.","sudradio_lepen","ps_retraites"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"travail","t":"Plus de cotisations retraite ni chômage pour qui travaille après l'âge de départ","d":"Supprimer les cotisations retraite et chômage pour les personnes qui continuent à travailler après l'âge de départ.","s":["sudradio_lepen"],"aj":"2026-10-01","fin":"n","id":"p028","plus":{"detail":[["Pour inciter les seniors qui ont droit à la retraite à continuer, elle propose de supprimer « les cotisations retraite et les cotisations chômage » pour ces travailleurs.","sudradio_lepen"]],"auj":[["Au 2e trimestre 2026, le taux d'emploi des 15-64 ans est de 69,0 %.","sujet_travail_insee_chomage"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"logement","t":"Les logements sociaux et les APL en priorité aux Français","d":"Donner aux Français la priorité d'accès au logement social, leur réserver les aides au logement (APL) et vendre des HLM à des Français.","s":["sudradio_lepen_logement","ps_jacobelli","bs_lepen"],"aj":"2026-10-01","fin":"s","id":"p029","plus":{"detail":[["Elle veut « donner la priorité d'accès au logement social aux Français » et « réserver » les APL aux Français.","sudradio_lepen_logement"],["À dossier équivalent, une famille française passerait avant une famille étrangère ; le RN juge que ce n'est « pas anticonstitutionnel » car ce serait « une condition supplémentaire sur la nationalité ».","ps_jacobelli"],["Elle prévoit aussi la vente « d'un certain nombre de HLM aux Français » et « l'expulsion des familles délinquantes » des logements sociaux.","sudradio_lepen_logement"]],"pourquoi":[["« Nous allons garantir à tous les Français, comme cela se pratique dans tous les pays du monde, un droit naturel et juste. »","sudradio_lepen_logement"]],"auj":[["2,8 millions de ménages attendent un logement social en 2025.","sujet_logement_senat_avis819"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"logement","t":"Alléger les normes pour construire plus de logements","d":"Abroger la loi SRU, supprimer le ZAN, alléger les normes de construction, mettre gratuitement des terrains publics à disposition des constructeurs en échange de logements à loyer modéré, rendre le prêt immobilier transférable et transformer des bureaux vides en logements.","s":["sudradio_lepen_logement","ps_jacobelli"],"aj":"2026-10-01","fin":"s","id":"p030","plus":{"detail":[["Elle veut « abroger » la loi SRU et supprimer le ZAN, qu'elle qualifie de « norme idéologique ».","sudradio_lepen_logement"],["Les terrains publics « seront mis gratuitement à disposition des constructeurs », en échange de logements à loyer modéré.","sudradio_lepen_logement"],["Le RN veut rendre le taux du prêt immobilier transférable d'un logement à l'autre, et modifier la fiscalité pour transformer des bureaux en logements.","ps_jacobelli"]],"objectif":[["« Libérer la construction, valoriser le parc existant, encourager et protéger la propriété ».","sudradio_lepen_logement"]],"auj":[["En 2025, 274 611 logements ont été mis en chantier, 21,3 % de moins que la moyenne des cinq années précédentes.","sujet_logement_sdes_construction2025"],["La loi SRU impose à certaines communes 20 % ou 25 % de logements sociaux, sous peine de prélèvement.","sujet_logement_anil_sru"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"pouvoir","t":"La TVA sur le gaz, l'électricité et le fioul ramenée de 20 % à 5,5 %","d":"Ramener la TVA sur le gaz, l'électricité et le fioul de 20 % à 5,5 %.","s":["bs_lepen"],"aj":"2026-10-01","fin":"n","id":"p031","plus":{"detail":[["Selon Brussels Signal, elle veut ramener la TVA sur le gaz, l'électricité et le fioul de 20 % à 5,5 %.","bs_lepen"],["Nous n'avons pas trouvé de coût annoncé.",null]],"auj":[["En septembre 2026, les prix de l'énergie ont augmenté de 21,2 % sur un an (estimation provisoire).","sujet_pouvoir_insee_ipc_sept"],["L'Union européenne impose un taux normal de TVA d'au moins 15 % ; chaque État fixe ses taux réduits dans ce cadre.","sujet_pouvoir_ue_tva"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"institutions","t":"Un référendum pour interdire le voile islamique dans tout l'espace public","d":"Organiser un référendum pour interdire le voile islamique dans l'ensemble de l'espace public.","s":["bs_lepen"],"aj":"2026-10-01","fin":"s","id":"p032","plus":{"detail":[["Selon Brussels Signal, elle propose un référendum pour interdire le voile islamique dans tous les espaces publics.","bs_lepen"],["Nous n'avons pas trouvé la question qui serait posée ni la base constitutionnelle choisie.",null]],"auj":[["Le Président peut soumettre au référendum certains projets de loi (article 11 de la Constitution), sur l'organisation des pouvoirs publics ou des réformes de la politique économique, sociale ou environnementale.","sujet_institutions_cc_constitution"]],"maj":"2026-10-19"}},{"c":"le-pen","th":"education","t":"Les élèves perturbateurs orientés vers des structures spécialisées (projet RN de 2024)","d":"Orienter vers des structures spécialisées les élèves exclus deux fois, rétablir les séries au bac et afficher en classe une carte de France et une frise chronologique. Ces mesures viennent du projet du RN pour les législatives de 2024 : son programme 2027 n'est pas encore publié.","s":["ps_ecole"],"aj":"2026-10-01","fin":"n","id":"p033","plus":{"detail":[["Public Sénat s'appuie sur les propositions du RN pour les législatives de 2024, car son programme pour 2027 n'est pas encore publié.","ps_ecole"],["Les élèves ayant fait l'objet de deux exclusions seraient orientés vers des structures spécialisées.","ps_ecole"],["Le projet prévoit aussi le retour des séries au bac, l'affichage d'une carte de France et d'une frise chronologique du « récit national », l'abrogation du Pacte enseignant et le remplacement obligatoire des professeurs absents.","ps_ecole"]],"pourquoi":[["Le parti place « le rétablissement de l'autorité au cœur de son projet ».","ps_ecole"]],"maj":"2026-10-19"}},{"c":"melenchon","th":"travail","t":"Un SMIC à 1 700 € net par mois","d":"Porter le SMIC à 1 700 € net par mois (2 176 € brut). C'est ce que prévoient une proposition de loi des députés insoumis déposée en septembre 2026 et le plan budgétaire présenté par son équipe le 14 octobre 2026.","s":["an_ppl3176","lcp_contrebudget_2027"],"aj":"2026-10-01","fin":"n","id":"p034","plus":{"detail":[["La proposition de loi des députés insoumis, déposée le 15 septembre 2026, fixe le Smic à au moins « 2 176 euros brut mensuel », soit 1 700 € net selon son exposé des motifs.","an_ppl3176"],["Le même texte prévoit que chaque salaire du secteur privé soit revalorisé au moins autant que les prix à la consommation.","an_ppl3176"],["Le plan budgétaire pour 2027 présenté par son équipe le 14 octobre 2026 reprend « la hausse du Smic à 1700 euros nets », selon Éric Coquerel, député insoumis et président de la commission des finances.","lcp_contrebudget_2027"],["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Augmenter le SMIC », dans la partie « Créer un état d'urgence sociale ».","lfi_synthese"],["En 2024, le contre-budget de son parti prévoyait 1 600 € net.","lfi_contrebudget_2025"]],"objectif":[["« Augmenter les salaires et réduire les inégalités salariales dans l'entreprise » : c'est le titre de la partie du programme où figure la mesure.","lfi_synthese"]],"pourquoi":[["Dans l'exposé des motifs de la proposition de loi : « Car c'est le travail qui crée la richesse. » « Il n'y a pas d'argument purement technique ou de rationalité économique pour refuser la hausse des salaires. »","an_ppl3176"],["« L'augmentation générale des salaires est donc un impératif social, afin de lutter contre les inégalités et la pauvreté »","lfi_contrebudget_2025"]],"auj":[["Le Smic net mensuel pour un temps plein est de 1 477,93 € depuis le 1er juin 2026 (1 867,02 € brut).","sujet_travail_sp_smic_juin"],["Passer à 1 700 € net ferait environ 222 € de plus par mois, soit +15 % (calcul de l'appli à partir de ce montant).","sujet_travail_sp_smic_juin"]],"fin_cand":[["Nous n'avons pas trouvé de coût annoncé pour 1 700 € net, ni dans la proposition de loi ni dans les comptes rendus du plan budgétaire du 14 octobre 2026.",null],["Pour 1 600 € net, son parti chiffrait en novembre 2024 un coût de 1,6 milliard d'euros, compensé en partie par 1,2 milliard de cotisations en plus (400 millions d'euros net), et 5 milliards pour un fonds d'aide aux TPE et PME.","lfi_contrebudget_2025"]],"fin_ind":[["Pour le Smic à 1 600 € net du programme du Nouveau Front populaire, l'Institut Montaigne estimait en juin 2024 le coût pour les finances publiques à 19 milliards d'euros par an (entre 17 et 21 milliards). Nous n'avons pas trouvé de chiffrage extérieur pour 1 700 €.","montaigne_nfp_smic"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"retraites","t":"Retour de la retraite à 62 ans, puis objectif 60 ans","d":"Abroger la réforme de 2023 : retour à 62 ans dans un premier temps, puis objectif de retraite à 60 ans.","s":["lfi_aec","ps_retraites"],"aj":"2026-10-01","a":{"v":10.4,"nature":"cout","per":"an","h":"coût estimé de l'abrogation à l'horizon 2035","lab":"Coût estimé"},"fin":"c","id":"p035","plus":{"detail":[["Abroger la réforme des retraites de 2023 et ramener l'âge légal à 62 ans « dans un premier temps ».","ps_retraites"],["Puis revenir « le plus vite possible » à la retraite à 60 ans avec 40 années de cotisation. Il l'a redit à son premier meeting de campagne, à Saint-Denis en juin 2026.","lcp_retraites_sept"],["Le plan budgétaire pour 2027 présenté par son équipe le 14 octobre 2026 prévoit de « rétablir l'âge de départ à la retraite à 62 ans (avant un éventuel retour à 60 ans) ».","lcp_contrebudget_2027"],["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Revaloriser les pensions de retraite a minima au niveau du SMIC revalorisé ».","lfi_synthese"]],"objectif":[["Son équipe présente la retraite à 60 ans comme la « mesure phare de l'Avenir en commun depuis 2017 ».","lfi_synthese"]],"pourquoi":[["Lors du débat organisé par le Medef fin août 2026 : « Le temps libre des retraités, c'est du travail civique, du temps familial. Ce n'est pas du temps perdu. »","lcp_retraites_sept"],["Son parti veut « restituer la retraite à 60 ans avec 40 annuités » et défend « le renforcement du système de retraite par répartition et la solidarité intergénérationnelle ».","lfi_contrebudget_2025"]],"auj":[["L'âge légal de départ va de 62 ans et 9 mois (personnes nées en 1964) à 64 ans (nées à partir de 1969). Le relèvement prévu par la réforme de 2023 est suspendu jusqu'en 2028.","sujet_retraites_sp_suspension"],["Les dépenses de retraite représentent 14,1 % du PIB en 2025 (422 milliards d'euros), avec un déficit estimé à 5,1 milliards d'euros.","sujet_retraites_cor_ra2026"]],"fin_cand":[["Dans le plan budgétaire pour 2027 présenté par son équipe le 14 octobre 2026, le retour à 62 ans est chiffré à 9 milliards d'euros, « la retraite promise à 60 ans » venant plus tard dans le quinquennat, selon Public Sénat.","ps_contrebudget_2027"],["Dans son contre-budget 2025 (novembre 2024), La France insoumise chiffre l'abrogation de la réforme et le retour à 60 ans avec 40 annuités à un « coût net de 26,5 milliards d'euros ».","lfi_contrebudget_2025"],["Nous n'y avons pas trouvé de financement propre à cette mesure. Le document pose le principe que les droits à la retraite « sont garantis par les cotisations des travailleurs », annonce « Nous financerons notre protection sociale en soumettant les revenus du capital aux cotisations » et prévoit d'« augmenter de 0,25 point par an pendant cinq ans les cotisations vieillesse ».","lfi_contrebudget_2025"]],"fin_ind":[["Pierre Moscovici, premier président de la Cour des comptes, a chiffré en mars 2025 l'abrogation de la réforme de 2023 à 10,4 milliards d'euros en 2035.","ps_moscovici"],["L'Institut Montaigne a chiffré en 2024 la mesure du Nouveau Front populaire, plus large (retour à 60 ans, minimum de pension au niveau du Smic, années de RSA comptées comme cotisées) : 58 milliards d'euros par an à l'horizon 2027 (entre 49 et 67 milliards), dont 8,2 milliards pour l'annulation de la réforme de 2023 et 27 milliards pour l'annulation du recul de l'âge décidé en 2010.","montaigne_nfp_retraites"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"institutions","t":"Passer à une VIe République","d":"Passer à une VIe République.","s":["lfi_aec"],"aj":"2026-10-01","fin":"s","id":"p036","plus":{"detail":[["Première étape : « Réunir une assemblée constituante pour passer à la 6e République », c'est-à-dire une assemblée chargée d'écrire une nouvelle Constitution.","lfi_synthese"],["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « La validation du projet de Constitution proposé par l'Assemblée constituante par référendum ».","lfi_synthese"],["Le programme prévoit aussi d'« instaurer le référendum révocatoire des élus » : un vote qui permettrait de mettre fin au mandat d'un élu avant son terme.","lfi_synthese"]],"objectif":[["Une République « permettant l'intervention populaire » : c'est le titre de la partie du programme où figure le référendum révocatoire.","lfi_synthese"]],"pourquoi":[["En mars 2017, lors de sa précédente campagne, il disait vouloir « mettre fin à la monarchie présidentielle et à sa collusion intime avec les puissances de l'argent ». Il jugeait la Constitution de 1958 « taillée sur mesure pour un homme exceptionnel, dans des conditions exceptionnelles ».","sudradio_6e_2017"],["Nous n'avons pas trouvé de déclaration de 2026 qui détaille davantage ses arguments.",null]],"auj":[["La Constitution de la Ve République date de 1958. Depuis, 9 référendums nationaux ont été organisés sur la base de ses articles 11 et 89, le dernier le 29 mai 2005.","sujet_institutions_cc_referendums"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"budget","t":"Annuler la dette française détenue par la Banque centrale européenne","d":"Annuler la part de la dette publique détenue par la Banque centrale européenne (18 % du total) en la convertissant en obligations perpétuelles à taux zéro.","s":["orange_melenchon","insee_dette"],"aj":"2026-10-01","a":{"v":647,"nature":"dette","per":"total","h":"calcul du site : 18 % de la dette publique de fin juin 2026"},"fin":"n","id":"p037","plus":{"detail":[["Il vise « les 18 % de dette française détenus par la Banque de France pour le compte de la Banque centrale européenne (BCE) », selon la description de Public Sénat.","ps_dette_melenchon"],["Le 23 août 2026, il a déclaré que la BCE « peut et doit mettre au congélateur les dettes des États », « en commençant par celles de la période Covid ».","ps_dette_melenchon"],["Cette dette serait convertie en obligations perpétuelles à taux zéro, c'est-à-dire jamais remboursées et sans intérêts.","orange_melenchon"],["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Faire racheter la dette par la Banque centrale européenne (BCE) et sortir la dette des marchés ».","lfi_synthese"]],"objectif":[["« Sortir la dette des marchés » : la mesure figure dans la partie « Refuser le chantage : annuler la dette publique ».","lfi_synthese"]],"pourquoi":[["Il affirme que l'opération « ne coûterait rien à personne » et n'aurait « aucun impact économique et aucun impact financier », car ce serait un « jeu d'écriture dans le bilan de la banque centrale ».","ps_dette_melenchon"],["À Clermont-Ferrand, le 11 octobre 2026 : « Si vous baissez la quantité de dette que nous avons, la confiance reviendra ».","sudradio_clermont"]],"auj":[["La dette publique atteint 3 595,5 milliards d'euros fin juin 2026, soit 119,0 % du PIB.","insee_dette"]],"fin_cand":[["Il ne donne pas de coût : selon lui, l'opération n'aurait « aucun impact financier ».","ps_dette_melenchon"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"eco","t":"Créer un pôle bancaire public","d":"Créer un pôle public bancaire.","s":["orange_melenchon"],"aj":"2026-10-01","fin":"n","id":"p038","plus":{"detail":[["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Créer un pôle public bancaire » et « Socialiser certaines banques de détail et les intégrer au pôle public bancaire ».","lfi_synthese"]],"objectif":[["La mesure figure dans les parties « Mettre au pas la finance » et « Pour des banques au service de l'intérêt général » du programme.","lfi_synthese"]],"pourquoi":[["Nous n'avons pas trouvé, pour l'instant, d'explication détaillée de sa part sur cette mesure.",null]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"education","t":"19 élèves par classe, 160 000 profs recrutés et la cantine gratuite","d":"Viser 19 élèves par classe en moyenne d'ici la fin du quinquennat, recruter 160 000 enseignants pour y parvenir et rendre la cantine gratuite avec des produits bio et paysans.","s":["ps_ecole","ps_contrebudget_2027"],"aj":"2026-10-01","fin":"c","id":"p039","plus":{"detail":[["Atteindre « 19 élèves en moyenne à la fin du quinquennat » par classe, avec « le recrutement de 160 000 enseignants ».","ps_ecole"],["Rendre la cantine gratuite et « porter à 100 % la part des produits issus de l'agriculture paysanne et biologique, en privilégiant autant que possible les produits locaux ».","ps_ecole"],["Son équipe classe parmi les mesures « déjà présentes dans le programme » : « Garantir la gratuité réelle de l'école (cantines, transports, sorties, manuels et fournitures) » et « Revaloriser les salaires des enseignants et fin du Pacte enseignant ».","lfi_synthese"]],"objectif":[["Faire de l'école « un véritable levier de réduction des inégalités », selon la présentation de Public Sénat.","ps_ecole"]],"pourquoi":[["Pour son parti, « il est urgent de garantir un accès égal de l'enfant à l'instruction par la gratuité réelle et intégrale de l'école publique ».","lfi_contrebudget_2025"],["Le recrutement doit permettre de « combler les postes manquants » et d'« atteindre à terme un objectif de 19 élèves par classe ».","lfi_contrebudget_2025"]],"auj":[["À la rentrée 2025, une classe compte en moyenne 21,7 élèves en maternelle et 21,1 en élémentaire (25,7 au collège).","sujet_education_depp_enc2026"],["L'Éducation nationale compte 851 500 enseignants en 2025-2026 : 366 100 dans le premier degré et 485 450 dans le second degré.","sujet_education_depp_enc2026"]],"fin_cand":[["Dans le plan budgétaire pour 2027 présenté par son équipe le 14 octobre 2026 : la cantine gratuite pour 3,6 milliards d'euros et 10 000 postes d'enseignants pour 500 millions d'euros, selon Public Sénat.","ps_contrebudget_2027"],["Dans son contre-budget 2025 (novembre 2024), La France insoumise chiffre la « gratuité intégrale à l'école : cantine scolaire, fournitures, transports, et activités périscolaires » à 6,2 milliards d'euros.","lfi_contrebudget_2025"],["Nous n'avons pas trouvé de chiffrage du recrutement de 160 000 enseignants.",null]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"melenchon","th":"ecologie","t":"Mettre en place une planification écologique","d":"Mettre en place une planification écologique (chapitre 12 du programme).","s":["lfi_aec"],"aj":"2026-10-01","fin":"c","id":"p040","plus":{"detail":[["La planification écologique est le chapitre 12 de son programme, L'Avenir en commun.","lfi_aec"],["Depuis septembre 2026, son équipe publie des « plans d'investissement » qui « présentent nos objectifs de production dans une série de filières stratégiques », « dans le cadre de la planification écologique ». Les premiers portent sur le BTP et le logement, et sur l'automobile.","lfi_plans_invest"],["Il veut aussi confier une partie de cette planification à 13 « écorégions », qui en seraient « la première ligne d'alerte, de propositions et de mise en œuvre ».","ps_ecoregions"],["Son parti prévoit une « loi énergie-climat prévoyant plan climat, outil de la planification écologique ».","lfi_contrebudget_2025"]],"objectif":[["« Atteindre la neutralité carbone en 2050 et respecter nos engagements internationaux de réduction des gaz à effet de serre ».","lfi_contrebudget_2025"]],"pourquoi":[["Le 23 août 2026 : « nous allons tous bientôt débarquer sur une autre planète en sortant de chez nous » ; « Pour s'y adapter, il est vital de tout changer dans nos manières de vivre, de produire et d'échanger ».","lid_melenchon_conscription"]],"auj":[["Les émissions de gaz à effet de serre de la France sont pré-estimées à 359 millions de tonnes équivalent CO2 en 2025, soit -2,1 % sur un an.","sujet_ecologie_hcc_ra2026"],["Selon le Haut Conseil pour le climat, il faudrait les baisser de plus de 4 % par an en moyenne en 2026, 2027 et 2028.","sujet_ecologie_hcc_ra2026"]],"fin_cand":[["Dans son contre-budget 2025 (novembre 2024), La France insoumise consacre 24,6 milliards d'euros à « organiser la bifurcation écologique » : 11,4 milliards pour la transition énergétique, 5,5 milliards pour l'adaptation au changement climatique, 7,9 milliards pour les transports publics et 800 millions pour l'eau, moins 1 milliard d'économies sur la pollution et la biodiversité.","lfi_contrebudget_2025"],["Les plans d'investissement publiés en 2026 ne donnent pas encore de montant.","lfi_plans_invest"]],"note":["Son programme est en cours de réactualisation : la nouvelle version doit être présentée les 6 et 7 novembre 2026. Cette fiche sera alors mise à jour.","lcp_melenchon_programme"],"maj":"2026-10-18"}},{"c":"philippe","th":"retraites","t":"La retraite à 65 ans, complétée par de l'épargne retraite","d":"Porter l'âge légal à 65 ans en moins de dix ans avec 45 annuités ; créer un fonds de capitalisation collectif obligatoire et généraliser le plan d'épargne retraite, abondé de 500 € au premier contrat.","s":["ps_retraites","sudradio_philippe_hdv"],"aj":"2026-10-01","a":{"v":30,"nature":"economie","per":"an","h":"en année pleine, montant annoncé"},"fin":"c","id":"p041","plus":{"detail":[["Il vise un âge légal à 65 ans en « moins de dix ans », et propose « d'étendre la durée de cotisation à 45 ans, soit deux années de plus que le cadre actuel ».","ps_retraites"],["Il veut un fonds de capitalisation « collectif obligatoire », « neutre sur le coût du travail », et généraliser le plan d'épargne retraite, abondé par l'État « de 500 euros lors de la signature du premier contrat de travail ».","ps_retraites"],["Il prévoit une concertation préalable avec les partenaires sociaux.","sudradio_philippe_hdv"]],"pourquoi":[["Il assume de faire travailler plus longtemps, et affirme qu'un Français sur trois pourra partir entre 60 et 64 ans, grâce aux carrières longues ou aux métiers pénibles.","ps_retraites"]],"auj":[["Depuis le 1er septembre 2026, l'âge légal va de 62 ans et 9 mois (nés en 1964) à 64 ans (nés à partir de 1969), avec 170 à 172 trimestres requis pour les générations 1964 à 1968.","sujet_retraites_sp_suspension"],["La loi de financement de la sécurité sociale pour 2026 a suspendu jusqu'en 2028 le relèvement de l'âge légal prévu par la réforme de 2023.","sujet_retraites_sp_suspension"]],"fin_cand":[["Sa réforme pourrait rapporter 30 milliards d'euros en année pleine, selon ses estimations.","ps_retraites"]],"maj":"2026-10-19"}},{"c":"philippe","th":"travail","t":"Le chômage indemnisé 12 mois au maximum pour les moins de 50 ans","d":"Limiter l'indemnisation du chômage à 12 mois pour les moins de 50 ans (18 mois aujourd'hui avant 55 ans), et instaurer deux jours de carence non indemnisés pour les arrêts maladie ponctuels.","s":["lcp_philippe"],"aj":"2026-10-01","fin":"n","id":"p042","plus":{"detail":[["Il veut une indemnisation de « douze mois maximum pour les moins de 50 ans », pour « faire comme l'Allemagne ».","lcp_philippe"],["Pour les arrêts maladie, il veut « mettre fin à l'open bar » : deux jours non indemnisés pour les arrêts ponctuels, comme en Espagne, et trois à six mois de délai entre un arrêt maladie et une rupture conventionnelle.","lcp_philippe"]],"pourquoi":[["Il dénonce une hausse d'environ 40 % des arrêts maladie entre 2019 et 2025, « une dérive préoccupante », soit environ 17 milliards d'euros par an.","lcp_philippe"]],"auj":[["Aujourd'hui, un chômeur peut être indemnisé jusqu'à 18 mois avant 55 ans ; depuis septembre 2026, 15 mois après une rupture conventionnelle.","sujet_travail_unedic_duree","sujet_travail_unedic_sept2026"]],"maj":"2026-10-19"}},{"c":"philippe","th":"eco","t":"50 milliards d'impôts en moins pour les entreprises, compensés par moins d'aides","d":"Supprimer 50 milliards d'euros d'impôts de production, compensés par une baisse équivalente des aides aux entreprises.","s":["lcp_philippe"],"aj":"2026-10-01","a":{"v":50,"nature":"neutre","per":"nd","h":"baisse d'impôts compensée par autant d'aides en moins"},"fin":"f","finTxt":"Une baisse équivalente des aides aux entreprises","id":"p043","plus":{"detail":[["Il veut supprimer 50 milliards d'euros d'impôts de production, compensés par une baisse équivalente des aides aux entreprises. Il défend une politique de l'offre.","lcp_philippe"],["Il veut aussi défendre le pacte Dutreil, qui allège la fiscalité des transmissions d'entreprises familiales.","lcp_philippe"]],"auj":[["En 2025, les prélèvements obligatoires représentent 43,6 % du PIB.","sujet_eco_insee_apu_2025"]],"maj":"2026-10-19"}},{"c":"philippe","th":"eco","t":"Pouvoir donner davantage, et plus tôt, à ses enfants et petits-enfants","d":"Relever les plafonds de donation aux enfants et petits-enfants pour transmettre plus tôt.","s":["lcp_philippe"],"aj":"2026-10-01","fin":"n","id":"p044","plus":{"detail":[["Il veut relever fortement les plafonds de donation pendant les trois premières années du quinquennat, pour transmettre le patrimoine « beaucoup plus vite » et aider la jeunesse.","lcp_philippe"],["Il se dit en « désaccord frontal » avec les propositions de hausse de la fiscalité des successions.","lcp_philippe"]],"maj":"2026-10-19"}},{"c":"philippe","th":"institutions","t":"Dissoudre l'Assemblée et organiser trois référendums après l'élection (annoncé en 2025)","d":"En mars 2025, il annonçait vouloir dissoudre l'Assemblée après l'élection et organiser trois référendums : retraites, règle d'or budgétaire, ordonnances pour réformer justice, école et santé. En octobre 2026, il n'a pas précisé par quelle voie passerait sa réforme des retraites.","s":["e1_philippe","sudradio_philippe_hdv"],"aj":"2026-10-01","fin":"s","id":"p045","plus":{"detail":[["En mars 2025, il présentait cette méthode : dissolution de l'Assemblée après la présidentielle et référendums sur les retraites, une règle d'or budgétaire et des ordonnances.","e1_philippe"],["En octobre 2026, il n'a pas précisé si sa réforme des retraites passerait par le Parlement, un référendum ou des ordonnances.","sudradio_philippe_hdv"]],"pourquoi":[["Il estime qu'« un président doit présider et non gouverner ».","sudradio_philippe_hdv"]],"auj":[["Le Président peut dissoudre l'Assemblée nationale ; la dernière dissolution date de juin 2024.","sujet_institutions_cc_constitution","sujet_institutions_info_dissolution"]],"maj":"2026-10-19"}},{"c":"philippe","th":"education","t":"Les profs augmentés de 20 % en cinq ans","d":"Augmenter de 20 % le salaire des enseignants sur le quinquennat, créer une « amende de responsabilisation scolaire » pour les parents et laisser les établissements imposer l'uniforme.","s":["ps_ecole"],"aj":"2026-10-01","fin":"n","id":"p046","plus":{"detail":[["Augmenter de 20 % la rémunération moyenne des enseignants sur le quinquennat, pour « redonner de la dignité à leur métier ».","ps_ecole"],["Une « amende de responsabilisation scolaire » pour certains parents d'enfants harceleurs, absentéistes ou très perturbateurs ; les établissements pourraient imposer l'uniforme.","ps_ecole"],["Plus d'autonomie pour les établissements (méthodes, horaires, discipline, choix des enseignants), en échange de la publication de leurs résultats.","ps_ecole"]],"objectif":[["« L'intérêt de nos enfants sera la boussole du quinquennat. »","ps_ecole"]],"auj":[["En 2025-2026, 851 500 enseignants travaillent dans les écoles et établissements.","sujet_education_depp_enc2026"]],"maj":"2026-10-19"}},{"c":"philippe","th":"ecologie","t":"Un gra
