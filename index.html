l 2026, le plafond est de 10 421 € par an (C2S sans participation) ou de 14 069 € par an (C2S avec participation, de 8 € par mois jusqu'à 29 ans).","src":"sujet_sante_ameli_c2s"}],"questions":[{"txt":"Comment faire venir des médecins dans les territoires où il en manque ?","src":"sujet_sante_senat_rapport668"},{"txt":"Comment ramener les comptes de l'Assurance maladie à l'équilibre ?","src":"sujet_sante_senat_avis126"},{"txt":"Comment prendre en charge les maladies chroniques au bon endroit et au bon moment ?","src":"sujet_sante_assurance_maladie_cp2027"},{"txt":"Comment répartir le coût des soins entre l'Assurance maladie, les complémentaires santé et les assurés ?","src":"sujet_sante_senat_complementaires"}],"lire":["sujet_sante_senat_rapport668","sujet_sante_assurance_maladie_cp2027","sujet_sante_senat_complementaires"]},"education":{"trente":{"txt":"L'école est un service public national : l'État fixe les programmes et gère les enseignants, tandis que les communes, les départements et les régions s'occupent des bâtiments des écoles, collèges et lycées. En 2025-2026, on compte 12,46 millions d'élèves et d'apprentis et 851 500 enseignants.","src":["sujet_education_men_etat","sujet_education_men_collectivites","sujet_education_depp_enc2026"]},"chiffres":[{"v":"12,46 millions","l":"d'élèves et d'apprentis en 2025-2026 (dont 6,15 millions d'écoliers, 3,36 millions de collégiens et 2,26 millions de lycéens)","src":"sujet_education_depp_enc2026"},{"v":"851 500","l":"enseignants dans les écoles et établissements en 2025-2026 (366 100 dans le 1er degré, 485 450 dans le second degré)","src":"sujet_education_depp_enc2026"},{"v":"21,1 à 21,7","l":"élèves par classe en moyenne à la rentrée 2025 en école (21,7 en préélémentaire, 21,1 en élémentaire) ; 25,7 en collège","src":"sujet_education_depp_enc2026"},{"v":"9 080 € et 11 660 €","l":"dépense annuelle par élève en 2024, respectivement dans le 1er degré et dans le 2d degré (élève ou apprenti)","src":"sujet_education_depp_enc2026_pdf"},{"v":"458 points","l":"score de la France en mathématiques à PISA 2025, en baisse de 16 points par rapport à 2022 (moyenne OCDE : 463) ; 36 % des élèves sous le niveau 2, contre 29 % en 2022","src":"sujet_education_depp_pisa2025"},{"v":"7,2 %","l":"des 18-24 ans sont sortants précoces de l'éducation et de la formation en 2025","src":"sujet_education_depp_enc2026_pdf"}],"recent":[{"date":"Rentrée 2026","txt":"Le ministère indique que l'utilisation d'un téléphone portable par les élèves est interdite dans l'ensemble des écoles, collèges et lycées : dès la rentrée 2026, la scolarité se déroule sans téléphone portable, de la maternelle au lycée. Depuis la rentrée 2025, chaque collège définit dans son règlement intérieur les modalités de mise à l'écart des téléphones (dispositif « Portable en pause »).","src":"sujet_education_men_telephone","iso":"2026-09-01"},{"date":"2026","txt":"La session 2026 des concours de recrutement des professeurs est la première étape de la réforme de la formation initiale et du recrutement : recrutement à bac+3, suivi de deux années de formation initiale rémunérée. En 2026, une double session est organisée, avec de nouveaux concours à bac+3 et des concours à bac+5 pour les étudiants déjà engagés en master.","src":"sujet_education_men_concours2026","iso":"2026"},{"date":"Rentrée 2024","txt":"Depuis la rentrée 2024, les enseignements de français et de mathématiques en 6e et en 5e sont organisés en groupes de besoins. Les programmes sont identiques pour tous les élèves, quel que soit leur groupe, et la composition des groupes est réexaminée régulièrement au cours de l'année.","src":"sujet_education_men_college","iso":"2024-09-01"}],"decide":[{"txt":"L'État fixe les programmes nationaux, définit et délivre les diplômes nationaux, recrute et gère les personnels enseignants et répartit les moyens consacrés à l'éducation.","src":"sujet_education_men_etat"},{"txt":"Les communes pour les écoles, les départements pour les collèges et les régions pour les lycées s'occupent de la construction, de la rénovation et des grosses réparations des bâtiments, et gèrent une partie des personnels non enseignants (agents des écoles maternelles, adjoints techniques).","src":"sujet_education_men_collectivites"}],"jeunes":[{"txt":"La bourse sur critères sociaux de l'enseignement supérieur 2026-2027 va de 1 454 € par an (échelon 0 bis, soit 145,40 € par mois) à 6 335 € par an (échelon 7, soit 633,50 € par mois). Elle est versée sur 10 mois et ses montants sont inchangés par rapport à 2025-2026.","src":"sujet_education_sp_bourses2026"},{"txt":"La contribution de vie étudiante et de campus (CVEC) est de 105 € pour l'année universitaire 2026-2027. Chaque étudiant inscrit en formation initiale dans l'enseignement supérieur doit obtenir son attestation d'acquittement avant son inscription.","src":"sujet_education_cvec"},{"txt":"Le ministère de l'Enseignement supérieur indique que le repas à 1 euro au restaurant universitaire est désormais accessible à tous les étudiants sans distinction. Les boursiers ne paient ni les frais d'inscription à l'université ni la CVEC.","src":"sujet_education_esr_cout_rentree"},{"txt":"Pour Parcoursup, la dernière session publiée est celle de 2026 : la phase d'inscription s'est tenue du lundi 19 janvier au jeudi 12 mars 2026, et la phase d'admission a débuté le mardi 2 juin 2026. Le calendrier de la session 2027 n'était pas encore affiché sur la page officielle au moment de la consultation : il est à vérifier sur parcoursup.gouv.fr.","src":"sujet_education_parcoursup_calendrier"}],"questions":[{"txt":"Comment relever le niveau des élèves en mathématiques et en compréhension de l'écrit, alors que le score de la France à PISA a baissé entre 2022 et 2025 ?","src":"sujet_education_depp_pisa2025"},{"txt":"Comment réduire les écarts de résultats entre les élèves de l'éducation prioritaire et les autres, qui d'après la Cour des comptes « peinent à se résorber » ?","src":"sujet_education_senat_prioritaire"},{"txt":"Comment adapter le nombre de postes à la baisse démographique tout en rendant le métier d'enseignant attractif, notamment en milieu de carrière ?","src":"sujet_education_senat_plf2026"},{"txt":"Comment recruter et former les enseignants alors que la Cour des comptes relève une « difficulté croissante de recrutement, particulièrement sur certains territoires et dans certaines disciplines » ?","src":"sujet_education_cc_devenir_enseignant"}],"lire":["sujet_education_depp_pisa2025","sujet_education_senat_prioritaire","sujet_education_senat_plf2026"],"story":{"s1":{"v":"12,46","u":"millions d'élèves et d'apprentis en 2025-2026","barresTitre":"Dont","barres":[["6,15 millions d'écoliers",6.15],["3,36 millions de collégiens",3.36],["2,26 millions de lycéens",2.26]],"txt":"L'État fixe les programmes et gère les 851 500 enseignants. Les communes, les départements et les régions s'occupent des bâtiments.","src":["sujet_education_men_etat","sujet_education_men_collectivites","sujet_education_depp_enc2026"]},"s2":{"v":"458","u":"points en maths pour la France à l'enquête PISA 2025","chips":[["16 points de moins qu'en 2022",true],["Moyenne des pays de l'OCDE : 463",false]],"points":{"a":29,"b":36,"big":"36 sur 100","txt":"élèves sous le niveau 2, le seuil des compétences de base de l'enquête","la":"29 sur 100 en 2022","lb":"7 de plus en 2025"},"src":["sujet_education_depp_pisa2025"]},"s3":{"t":"Plus de téléphone portable à l'école, de la maternelle au lycée","items":[{"d":"Rentrée 2026","txt":"Le téléphone portable des élèves est interdit dans toutes les écoles, tous les collèges et tous les lycées."},{"d":"Concours 2026","txt":"Les premiers concours de professeurs à bac+3, suivis de deux années de formation payée."},{"d":"Rentrée 2024","txt":"En 6e et en 5e, le français et les maths se font en groupes de besoins, avec le même programme pour tous."}],"src":["sujet_education_men_telephone","sujet_education_men_concours2026","sujet_education_men_college"]},"s4":{"t":"Les idées qui reviennent le plus souvent","groupes":[{"l":"Moins d'élèves par classe","c":["attal","faure","glucksmann","melenchon","roussel","tondelier"]},{"l":"Des professeurs mieux payés","c":["attal","faure","glucksmann","philippe","tondelier"]},{"l":"Un examen avant l'entrée en 6e","c":["attal","retailleau"]}],"aussi":"Et aussi : repas gratuits, écoles rénovées, fin de la carte scolaire, structures pour élèves perturbateurs, groupes de niveau, uniforme, bac pro en 4 ans, gestion locale des profs.","ids":["p011","p012","p020","p033","p039","p046","p053","p069","p083","p102","p103","p104","p149","p150","p207","p210"]}}},"ecologie":{"trente":{"txt":"La France applique un cadre européen (marché du carbone SEQE-UE, cible de -55 % d'émissions en 2030) et sa propre programmation de l'énergie, la PPE 3, adoptée par décret en février 2026. En 2025, ses émissions de gaz à effet de serre sont pré-estimées à 359 Mt (-2,1 %). Côté nature, 18 % des espèces évaluées dans la Liste rouge nationale sont éteintes ou menacées (2024), et au 10 septembre 2026, 93 départements de l'Hexagone avaient des restrictions d'usage de l'eau.","src":["sujet_ecologie_hcc_ra2026","sujet_ecologie_senat_ppe3","sujet_env_sdes_biodiv_2025","sujet_env_bsh_2026_09"]},"chiffres":[{"v":"359 Mt CO2e","l":"émissions brutes de gaz à effet de serre de la France en 2025 (pré-estimation), contre 367 Mt en 2024, soit -2,1 %","src":"sujet_ecologie_hcc_ra2026"},{"v":"plus de 4 % par an","l":"rythme moyen de baisse des émissions brutes à atteindre en 2026, 2027 et 2028 selon le Haut Conseil pour le climat (HCC), qui note que le rythme « a ralenti en 2025 » et doit « au moins doubler » (rapport de juillet 2026)","src":"sujet_ecologie_hcc_ra2026"},{"v":"23,0 %","l":"part des énergies renouvelables dans la consommation finale brute d'énergie en 2024 (données provisoires ; objectif 2030 : 33 %) ; 30,8 % pour l'électricité","src":"sujet_ecologie_sdes_enr2024"},{"v":"68,1 %","l":"part du nucléaire dans la production d'électricité en 2025 (373,0 TWh sur 547,5 TWh) ; l'électricité bas-carbone représente 95,2 % de la production","src":"sujet_ecologie_rte_bilan2025"},{"v":"18 %","l":"des espèces évaluées dans la Liste rouge nationale sont éteintes ou menacées en France (2024)","src":"sujet_env_sdes_biodiv_2025"},{"v":"93 départements","l":"de l'Hexagone avaient des restrictions d'usage de l'eau au 10 septembre 2026, dont 74 au niveau « crise », le plus élevé des quatre","src":["sujet_env_bsh_2026_09","sujet_env_guide_secheresse_2026"]},{"v":"2,69 millions d'hectares","l":"cultivés en bio en 2025, soit environ 10 % de la surface agricole ; en légère baisse pour la troisième année de suite (-1,1 %)","src":"sujet_env_agencebio_2025"},{"v":"70 100 tonnes","l":"de substances phytosanitaires (pesticides) vendues pour l'agriculture en 2024, soit 8 % de plus qu'en 2023 ; 38 % sont des substances utilisables en agriculture biologique ou de biocontrôle","src":"sujet_env_sdes_ventes_phyto_2024"},{"v":"15 119 hectares","l":"d'espaces naturels, agricoles et forestiers consommés en 2024 (donnée provisoire), le plus bas niveau depuis 2011 ; la loi vise à diviser ce rythme par deux sur 2021-2031, puis le « zéro artificialisation nette » (ZAN) en 2050","src":["sujet_env_portail_enaf_2011_2025","sujet_env_zan_fascicule_1"]},{"v":"près de 40 000","l":"décès par an attribuables aux particules fines (PM2,5) chez les 30 ans et plus, selon Santé publique France (estimation sur 2016-2019)","src":["sujet_env_spf_air_2025","sujet_env_spf_air_2016_2019"]}],"recent":[{"date":"1er août 2026","txt":"Les tarifs réglementés de vente de l'électricité augmentent en moyenne de 2,5 % : le Gouvernement a accepté la proposition de la Commission de régulation de l'énergie (CRE). Cela représente environ 26 € TTC de plus par an en moyenne.","src":"sujet_ecologie_sp_tarifs_aout2026","iso":"2026-08-01"},{"date":"21 mai 2026","txt":"Le Conseil constitutionnel censure l'article 37 de la loi de simplification de la vie économique, qui visait à supprimer la faculté ou l'obligation, pour certaines collectivités territoriales, de mettre en place une zone à faibles émissions mobilité (ZFE). Il juge cet article adopté selon une procédure contraire à la Constitution, faute de lien suffisant avec les dispositions du texte initial.","src":"sujet_ecologie_cc_2026903","iso":"2026-05-21"},{"date":"13 févr. 2026","txt":"La troisième programmation pluriannuelle de l'énergie (PPE 3) est adoptée par décret. À l'horizon 2035, elle prévoit la mise en service de 55 à 80 GW de capacités photovoltaïques, 35 à 40 GW d'éolien terrestre et 15 GW d'éolien en mer.","src":"sujet_ecologie_senat_ppe3","iso":"2026-02-13"},{"date":"12 juin 2026","iso":"2026-06-12","txt":"Une loi affirme la responsabilité de l'État dans les préjudices causés par le chlordécone, un pesticide utilisé en Guadeloupe et en Martinique. Elle fixe un objectif de dépollution des sols et des eaux et ouvre la voie à l'indemnisation des victimes.","src":"sujet_env_senat_chlordecone"},{"date":"7 août 2025","iso":"2025-08-07","txt":"Le Conseil constitutionnel censure la disposition de la loi dite « Duplomb » qui permettait de déroger par décret à l'interdiction des produits contenant des néonicotinoïdes, au nom du droit de vivre dans un environnement équilibré et respectueux de la santé. Il valide, avec deux réserves, les mesures sur les ouvrages de stockage d'eau.","src":["sujet_env_cc_2025_891","sujet_env_senat_duplomb"]},{"date":"18 mars 2025","iso":"2025-03-18","txt":"Le Sénat adopte en première lecture la proposition de loi « TRACE », qui assouplit la trajectoire de réduction de l'artificialisation des sols pour 2021-2031, sans toucher à l'objectif de zéro artificialisation nette en 2050. Le 24 juin 2026, le Gouvernement disait attendre un accord entre l'Assemblée nationale et le Sénat avant de l'inscrire à l'ordre du jour de l'Assemblée.","src":["sujet_env_senat_trace","sujet_env_senat_qag_zan_2026"]},{"date":"27 févr. 2025","iso":"2025-02-27","txt":"Une loi interdit, à partir du 1er janvier 2026, de fabriquer, d'importer, d'exporter et de vendre des cosmétiques, des farts, des vêtements et des chaussures grand public contenant des PFAS, les « polluants éternels » (hors équipements de protection). Elle crée aussi une redevance sur les rejets de PFAS dans l'eau.","src":"sujet_env_loi_pfas_2025"}],"decide":[{"txt":"Au niveau national, la troisième programmation pluriannuelle de l'énergie (PPE 3) a été adoptée par décret, le 13 février 2026.","src":"sujet_ecologie_senat_ppe3"},{"txt":"Le cadre européen s'impose aussi : selon le HCC, le Pacte vert européen s'articule autour du système d'échange de quotas d'émissions de l'Union européenne (SEQE-UE), avec une cible de -55 % en 2030, et l'Union a fixé un objectif de -90 % d'émissions en 2040 par rapport à 1990.","src":"sujet_ecologie_hcc_ra2026"},{"txt":"Les collectivités, à travers leurs outils de planification et d'aménagement du territoire, sont des acteurs majeurs des politiques climatiques.","src":"sujet_ecologie_hcc_ra2026"},{"txt":"En cas de sécheresse, ce sont les préfets de département qui restreignent les usages de l'eau par arrêté, selon quatre niveaux : vigilance, alerte, alerte renforcée et crise.","src":"sujet_env_guide_secheresse_2026"},{"txt":"L'Union européenne fixe des objectifs de restauration de la nature (règlement entré en vigueur le 18 août 2024) : chaque État, dont la France, doit préparer un plan national de restauration, dont une première version était à transmettre à la Commission avant le 1er septembre 2026.","src":"sujet_env_ofb_rrn"},{"txt":"L'objectif national de réduction de l'artificialisation des sols descend en cascade : les régions l'intègrent dans leurs schémas, puis les intercommunalités et les communes doivent rendre leurs documents d'urbanisme (SCoT, PLU) compatibles.","src":"sujet_env_zan_fascicule_1"}],"jeunes":[{"txt":"Chèque énergie : le foyer fiscal doit avoir un revenu fiscal de référence inférieur à 11 000 € par unité de consommation, d'après l'avis d'imposition de l'année N-2. Son montant varie de 48 € à 277 € selon les revenus et la composition du foyer.","src":"sujet_ecologie_sp_cheque_energie"},{"txt":"Pour un salarié, l'employeur doit prendre en charge au moins 50 % du prix des abonnements de transports publics utilisés pour les trajets entre le domicile et le lieu de travail.","src":"sujet_ecologie_sp_transports_employeur"},{"txt":"Le forfait mobilités durables est facultatif pour l'employeur. Il peut financer les trajets domicile-travail en vélo personnel (électrique compris) ou en covoiturage, entre autres, et il est exonéré d'impôt sur le revenu jusqu'à 600 € par an et par salarié (dont 300 € au maximum de prime carburant), ou 900 € au total pour les salariés qui bénéficient aussi de la prise en charge des abonnements de transports publics.","src":"sujet_ecologie_sp_fmd"}],"questions":[{"txt":"Comment accélérer la baisse des émissions de gaz à effet de serre, alors que son rythme a ralenti en 2025 et que, selon le HCC, la baisse 2024-2025 est surtout liée à moins de gaz naturel consommé ?","src":"sujet_ecologie_hcc_ra2026"},{"txt":"Comment financer la rénovation énergétique des logements, notamment des copropriétés, et à quels ménages destiner en priorité les aides ?","src":"sujet_ecologie_hcc_ra2026"},{"txt":"Comment accélérer l'électrification des usages pour réduire la dépendance aux énergies fossiles, alors que la consommation d'électricité est restée stable en 2025 ?","src":"sujet_ecologie_rte_cp2025"},{"txt":"Comment protéger les ménages les plus dépendants des énergies fossiles, face à la précarité mobilité (15 millions de personnes) et à la précarité énergétique (10,8 % des ménages), tout en réduisant les émissions ?","src":"sujet_ecologie_hcc_ra2026"},{"txt":"Faut-il assouplir la trajectoire de réduction de l'artificialisation des sols fixée pour 2021-2031, tout en gardant l'objectif de zéro artificialisation nette en 2050 ?","src":"sujet_env_senat_trace"},{"txt":"Faut-il passer d'une gestion des pollutions diffuses (pesticides, engrais, plastiques…) qui répare après coup à une politique de prévention à la source, comme le propose le CESE ?","src":"sujet_env_cese_pollutions_diffuses"}],"lire":["sujet_ecologie_hcc_ra2026","sujet_ecologie_rte_bilan2025","sujet_ecologie_citepa_secten2026","sujet_env_sdes_biodiv_2025","sujet_env_sdes_bilan_chiffres_cles"]},"eco":{"trente":{"txt":"En 2025, le PIB de la France a augmenté de 0,8 % ; il est resté stable au deuxième trimestre 2026. Les prix ont augmenté de 3,0 % sur un an en septembre 2026 (estimation provisoire de l'Insee). Les prélèvements obligatoires (impôts et cotisations) représentent 43,6 % du PIB en 2025.","src":["sujet_eco_insee_comptes_2025","sujet_eco_insee_pib_t2_2026","sujet_eco_insee_ipc_sept2026","sujet_eco_insee_apu_2025"]},"chiffres":[{"v":"0,0 %","l":"variation du PIB en volume au 2e trimestre 2026, après -0,2 % au 1er trimestre (acquis de croissance de +0,3 % pour 2026)","src":"sujet_eco_insee_pib_t2_2026"},{"v":"+0,8 %","l":"croissance du PIB en volume en 2025, après +1,5 % en 2024","src":"sujet_eco_insee_comptes_2025"},{"v":"3,0 %","l":"hausse des prix à la consommation sur un an en septembre 2026 (estimation provisoire de l'Insee ; 2,4 % en août 2026)","src":"sujet_eco_insee_ipc_sept2026"},{"v":"43,6 %","l":"du PIB : taux de prélèvements obligatoires en 2025, en hausse de 0,9 point par rapport à 2024","src":"sujet_eco_insee_apu_2025"},{"v":"47 %","l":"des foyers fiscaux ont payé un impôt net sur le revenu en 2025, au titre des revenus 2024 (19,6 millions sur 41,5 millions)","src":"sujet_eco_dgfip_ir2024"},{"v":"-58,0 Md€","l":"solde des échanges de biens de la France en 2025, après -61,4 Md€ en 2024 (balance des paiements ; les services dégagent un excédent de 45,4 Md€)","src":"sujet_eco_bdf_bdp2025"}],"recent":[{"date":"1er oct. 2026","txt":"Le projet de loi de finances pour 2027 est présenté. Il n'est pas encore adopté : le Parlement doit le voter. Il prévoit de ne pas augmenter de manière générale les principaux impôts, d'indexer le barème de l'impôt sur le revenu sur l'inflation et de réduire de 30 % la surtaxe d'impôt sur les sociétés applicable aux grandes entreprises.","src":"sujet_eco_ecogouv_plf2027","iso":"2026-10-01"},{"date":"25 juin 2026","txt":"La loi n° 2026-534 du 25 juin 2026 relative à la lutte contre les fraudes sociales et fiscales est promulguée. Elle crée notamment une procédure de « flagrance sociale » qui permet de geler les actifs d'entreprises lors d'un contrôle de l'Urssaf, pour lutter contre le travail dissimulé.","src":"sujet_eco_ecogouv_fraudes","iso":"2026-06-25"},{"date":"19 févr. 2026","txt":"La loi de finances pour 2026 (loi n° 2026-103 du 19 février 2026) revalorise le barème de l'impôt sur le revenu de 0,9 %, au rythme de l'inflation. Elle prévoit la contribution différentielle sur les hauts revenus (taux d'imposition minimal de 20 % pour les foyers dont le revenu fiscal de référence 2025 dépasse 250 000 € pour un célibataire ou 500 000 € pour un couple) et reconduit pour une nouvelle année la contribution exceptionnelle sur les grandes entreprises.","src":"sujet_eco_ecogouv_lfi2026_particuliers","iso":"2026-02-19"}],"decide":[{"txt":"Le Parlement vote les lois de finances, qui déterminent les ressources et les charges de l'État : l'article 47 de la Constitution lui laisse 70 jours pour examiner, amender et voter le projet de loi de finances déposé par le Gouvernement.","src":"sujet_eco_an_fiche53"},{"txt":"Le Gouvernement saisit aussi le Haut Conseil des finances publiques, qui émet un avis sur le cadrage économique du projet de loi, sa cohérence avec la loi de programmation des finances publiques en vigueur et le réalisme des prévisions de recettes et de dépenses.","src":"sujet_eco_ecogouv_plf_comment"},{"txt":"Au niveau européen, la France fait l'objet d'une procédure de déficit excessif (décision du Conseil du 26 juillet 2024). Les taux d'intérêt directeurs de la zone euro sont fixés par l'Eurosystème, c'est-à-dire la Banque centrale européenne et les banques centrales nationales des pays de la zone euro.","src":"sujet_eco_ec_edp_france"}],"jeunes":[{"txt":"Job étudiant : les salaires d'un étudiant qui a 25 ans ou moins au 1er janvier de l'année d'imposition sont exonérés d'impôt sur le revenu dans la limite de 3 fois le montant mensuel du Smic, soit 5 405 € pour les revenus perçus en 2025. Cette exonération peut se cumuler avec celle des gratifications de stage.","src":"sujet_eco_ecogouv_job"},{"txt":"Stage et apprentissage : l'exonération d'impôt sur le revenu des gratifications de stage et des salaires d'apprentis est limitée au montant annuel du Smic, soit 21 622 € pour les revenus perçus en 2025. Les bourses d'études accordées par l'État ou les collectivités locales sur critères sociaux sont exonérées d'impôt sur le revenu.","src":"sujet_eco_ecogouv_job"},{"txt":"Rattachement aux parents : un enfant majeur peut être rattaché au foyer fiscal de ses parents s'il a moins de 21 ans au 1er janvier de l'année d'imposition (1er janvier 2025 pour la déclaration faite en 2026), ou moins de 25 ans s'il poursuit ses études. Le jeune majeur peut aussi faire sa propre déclaration.","src":"sujet_eco_impots_majeur"}],"questions":[{"txt":"Quels effets le niveau, la complexité et l'instabilité des prélèvements obligatoires ont-ils sur la compétitivité des entreprises, l'investissement et les salaires ?","src":"sujet_eco_senat_r942"},{"txt":"Comment soutenir la croissance et le pouvoir d'achat des ménages alors que l'inflation remonte ?","src":"sujet_eco_insee_ndc_sept2026"},{"txt":"Comment réduire le déficit public : par moins de dépenses, par plus de recettes, ou par une combinaison des deux ?","src":"sujet_eco_cour_juin2026"},{"txt":"Comment mieux connaître et imposer les hauts patrimoines tout en limitant l'optimisation fiscale ?","src":"sujet_eco_senat_r760"}],"lire":["sujet_eco_senat_r942","sujet_eco_insee_ndc_sept2026","sujet_eco_senat_r760"],"tuile":3},"budget":{"trente":{"txt":"La loi de finances définit chaque année les recettes et les dépenses de l'État ; le Parlement la vote. Le projet de budget pour 2027, présenté le 1er octobre 2026, prévoit de ramener le déficit public à 5 % du PIB (5,4 % attendu en 2026), avec un effort de redressement de 54 milliards d'euros. Il n'est pas encore adopté.","src":["sujet_budget_ecogouv_plf2027","sujet_budget_an_plf2027"]},"chiffres":[{"v":"5,0 %","l":"du PIB : déficit public visé en 2027 par le projet de budget, contre 5,4 % attendu en 2026","src":"sujet_budget_ecogouv_plf2027"},{"v":"54 Md€","l":"effort de redressement des comptes publics prévu en 2027, dont 43 Md€ de mesures dans le projet de loi de finances et le projet de loi de financement de la Sécurité sociale","src":"sujet_budget_ecogouv_plf2027"},{"v":"121,7 %","l":"du PIB : niveau de la dette publique attendu en 2027 selon le projet de loi de finances","src":"sujet_budget_an_plf2027"},{"v":"-156,4 Md€","l":"solde budgétaire de l'État prévu en 2027 dans le projet de loi de finances (-137,2 Md€ estimé pour 2026)","src":"sujet_budget_an_plf2027"},{"v":"2029","l":"année visée par le Gouvernement pour ramener le déficit public sous 3 % du PIB (rapport d'avancement annuel d'avril 2026) ; la procédure de déficit excessif contre la France a été ouverte le 26 juillet 2024","src":"sujet_budget_tresor_raa2026"}],"recent":[{"date":"1er oct. 2026","txt":"Le projet de loi de finances pour 2027 est présenté et enregistré à l'Assemblée nationale. Il n'est pas encore adopté : le Parlement doit le voter. Il prévoit un déficit public de 5,0 % du PIB en 2027.","src":"sujet_budget_ecogouv_plf2027","iso":"2026-10-01"},{"date":"19 févr. 2026","txt":"La loi de finances pour 2026 (loi n° 2026-103 du 19 février 2026) est promulguée. La Cour des comptes indique qu'elle inscrit une cible de déficit public de 5,0 % du PIB pour 2026.","src":"sujet_budget_ecogouv_lfi2026","iso":"2026-02-19"},{"date":"26 déc. 2025","txt":"La loi spéciale (loi n° 2025-1316 du 26 décembre 2025) est promulguée : elle autorise la perception des impôts et des ressources publiques nécessaires au financement des dépenses publiques essentielles et assure le fonctionnement des services publics dès le 1er janvier 2026, en attendant le vote du budget 2026.","src":"sujet_budget_ecogouv_loi_speciale","iso":"2025-12-26"},{"date":"26 juil. 2024","txt":"Le Conseil de l'Union européenne décide qu'il existe un déficit excessif en France : la procédure de déficit excessif est ouverte. Une recommandation du Conseil pour mettre fin à cette situation est adoptée le 21 janvier 2025.","src":"sujet_budget_ec_edp_france","iso":"2024-07-26"}],"decide":[{"txt":"Le Gouvernement dépose le projet de loi de finances sur le bureau de l'Assemblée nationale au plus tard le premier mardi d'octobre. Le Parlement dispose de 70 jours pour l'examiner, l'amender et le voter (article 47 de la Constitution). Si la loi n'est pas votée à temps, le Gouvernement dépose un projet de loi spéciale l'autorisant à continuer à percevoir les impôts, comme pour 2026.","src":"sujet_budget_ecogouv_plf_comment"},{"txt":"Le Gouvernement saisit le Conseil d'État et le Haut Conseil des finances publiques, qui émet un avis sur le cadrage économique du projet de loi, sa cohérence avec la loi de programmation des finances publiques en vigueur et le réalisme des prévisions de recettes et de dépenses.","src":"sujet_budget_ecogouv_plf_comment"},{"txt":"Au niveau européen, la France fait l'objet d'une procédure de déficit excessif (décision du Conseil du 26 juillet 2024). Les taux d'intérêt directeurs de la zone euro sont fixés par l'Eurosystème, c'est-à-dire la Banque centrale européenne et les banques centrales nationales de la zone euro.","src":"sujet_budget_ec_edp_france"}],"jeunes":[{"txt":"Restaurants universitaires : la loi de finances pour 2026 instaure, pour tous les étudiants, le repas (entrée, plat et dessert) à un euro dans les restaurants universitaires gérés par le Crous, à partir du 1er mai 2026.","src":"sujet_budget_ecogouv_lfi2026"}],"questions":[{"txt":"Comment réduire le déficit public : par des économies, par des recettes supplémentaires, ou par les deux ?","src":"sujet_budget_cour_juin2026"},{"txt":"Comment faire face à la hausse de la charge de la dette, qui réduit les marges de manœuvre de l'État ?","src":"sujet_budget_cour_juin2026"},{"txt":"Comment associer les collectivités territoriales à l'effort de redressement des comptes publics, et selon quelle trajectoire ?","src":"sujet_budget_cour_locales"},{"txt":"Comment financer la hausse des crédits de la défense dans un contexte de réduction du déficit ?","src":"sujet_budget_senat_defense_plf2026"}],"lire":["sujet_budget_cour_juin2026","sujet_budget_cour_locales","sujet_budget_an_plf2027"]},"securite":{"trente":{"txt":"En 2025, la police et la gendarmerie ont enregistré plus de violences physiques (+5 %) et de violences sexuelles (+8 %) qu'en 2024, et moins de cambriolages de logement (-3 %). Au 1er août 2026, 89 668 personnes étaient détenues pour 63 303 places opérationnelles. Le Parlement vote la loi pénale ; des juges indépendants jugent.","src":["sujet_securite_ssmsi_bilan2025","sujet_securite_justice_detention_202608","sujet_securite_cc_constitution"]},"chiffres":[{"v":"472 400","l":"victimes de violences physiques enregistrées par la police et la gendarmerie en 2025, soit 5 % de plus qu'en 2024","src":"sujet_securite_ssmsi_bilan2025"},{"v":"132 100","l":"victimes de violences sexuelles enregistrées en 2025 (+8 % par rapport à 2024), dont 50 100 victimes de viols et tentatives de viol (+9 %)","src":"sujet_securite_ssmsi_bilan2025"},{"v":"89 668","l":"personnes détenues au 1er août 2026 pour 63 303 places opérationnelles, soit une densité carcérale de 141,6 % (7 956 matelas au sol)","src":"sujet_securite_justice_detention_202608"},{"v":"environ 8 500","l":"postes de policiers et de gendarmes dont la création est prévue entre 2023 et 2027 ; le projet de loi de finances pour 2026 prévoit en outre +1 000 emplois pour la police nationale et +400 pour la gendarmerie nationale","src":"sujet_securite_senat_securites_plf2026"},{"v":"13,1 Md€","l":"de crédits de paiement pour la mission Justice dans le projet de loi de finances pour 2026, avec 1 600 emplois supplémentaires prévus","src":"sujet_securite_senat_justice_plf2026"},{"v":"12,2 mois","l":"de délai moyen en 2025 entre l'arrivée d'une affaire et la première décision au fond du tribunal correctionnel, identique à 2024","src":"sujet_securite_justice_rsj2026_delais"}],"recent":[{"date":"23 juin 2025","txt":"La loi n° 2025-568 visant à renforcer l'autorité de la justice à l'égard des mineurs délinquants et de leurs parents est promulguée, après la décision n° 2025-886 DC du Conseil constitutionnel du 19 juin 2025, qui l'a jugée partiellement conforme à la Constitution.","src":"sujet_securite_senat_mineurs_loi","iso":"2025-06-23"},{"date":"13 juin 2025","txt":"La loi n° 2025-532 visant à sortir la France du piège du narcotrafic est promulguée, après la décision n° 2025-885 DC du Conseil constitutionnel du 12 juin 2025, qui l'a jugée partiellement conforme à la Constitution.","src":"sujet_securite_senat_narcotrafic_loi","iso":"2025-06-13"},{"date":"20 nov. 2023","txt":"La loi n° 2023-1059 d'orientation et de programmation du ministère de la justice 2023-2027 est promulguée, après la décision n° 2023-855 DC du Conseil constitutionnel du 16 novembre 2023, qui l'a jugée partiellement conforme à la Constitution.","src":"sujet_securite_senat_lopj","iso":"2023-11-20"},{"date":"24 janv. 2023","txt":"La loi n° 2023-22 d'orientation et de programmation du ministère de l'intérieur (LOPMI) est promulguée, après la décision n° 2022-846 DC du Conseil constitutionnel du 19 janvier 2023, qui l'a jugée partiellement conforme à la Constitution. Elle programme les moyens du ministère sur la période 2023-2027.","src":"sujet_securite_senat_lopmi","iso":"2023-01-24"}],"decide":[{"txt":"Le Parlement vote la loi pénale : selon l'article 34 de la Constitution, la loi fixe les règles concernant la détermination des crimes et délits ainsi que les peines qui leur sont applicables, et la procédure pénale. Le Gouvernement détermine et conduit la politique de la nation et dispose de l'administration (article 20).","src":"sujet_securite_cc_constitution"},{"txt":"Le préfet de département a la charge de l'ordre public et de la sécurité des populations ; il dirige l'action des services de la police nationale et des unités de la gendarmerie nationale en matière d'ordre public et de police administrative.","src":"sujet_securite_gendarmerie_organisation"},{"txt":"Le Président de la République est garant de l'indépendance de l'autorité judiciaire (article 64). Avant leur promulgation, les lois peuvent être déférées au Conseil constitutionnel, qui se prononce sur leur conformité à la Constitution (article 61).","src":"sujet_securite_cc_constitution"}],"jeunes":[{"txt":"Garde à vue : sa durée est de 24 heures, mais elle peut être abrégée ou prolongée, et l'infraction reprochée doit être un crime ou un délit puni d'une peine d'emprisonnement. La personne gardée à vue peut solliciter l'aide d'un avocat dès le début et à tout moment, demander à être examinée par un médecin, faire prévenir son employeur, un proche ou toute personne de son choix, et a le droit de faire des déclarations, de répondre aux questions ou de se taire.","src":"sujet_securite_sp_gav"},{"txt":"Plainte en ligne : depuis le 15 octobre 2024, ce service permet de déposer plainte de façon entièrement dématérialisée pour les vols, cambriolages, abus de confiance, dégradations, infractions concernant le dépôt sauvage ou la collecte des ordures, et escroqueries. Il faut s'identifier avec FranceConnect (identifiants impots.gouv.fr, ameli.fr ou identité numérique La Poste) ; l'autre option est de prendre rendez-vous dans un commissariat ou une gendarmerie avec une pièce d'identité.","src":"sujet_securite_sp_plainte"},{"txt":"Bulletin n° 3 du casier judiciaire : il peut être délivré quelle que soit la nationalité. La demande se fait par le téléservice du ministère de la justice et elle est gratuite ; le délai va d'une heure à 24 heures en cas de transmission via FranceConnect ou par mail.","src":"sujet_securite_sp_casier"}],"questions":[{"txt":"Comment concilier le nombre de places en détention, le recours à l'emprisonnement et les conditions de vie en prison ?","src":"sujet_securite_cglpl_ra2025"},{"txt":"Quelle organisation et quels moyens d'enquête pour lutter contre le trafic de stupéfiants, et avec quelles garanties pour les libertés individuelles ?","src":"sujet_securite_senat_ce_narcotrafic"},{"txt":"Comment réduire le délai de jugement des affaires pénales tout en préservant les droits de la défense et ceux des victimes ?","src":"sujet_securite_justice_audiencement"},{"txt":"Comment répartir les emplois supplémentaires de la Justice entre l'administration pénitentiaire, les services judiciaires et les autres services ?","src":"sujet_securite_senat_justice_plf2026"}],"lire":["sujet_securite_cglpl_ra2025","sujet_securite_senat_ce_narcotrafic","sujet_securite_justice_audiencement"]},"immigration":{"trente":{"txt":"En 2025, 377 000 premiers titres de séjour ont été délivrés et l'Ofpra a enregistré 145 210 demandes de protection internationale. L'Insee compte 8,0 millions d'immigrés en 2025, soit 11,6 % de la population. Depuis le 12 juin 2026, les règles européennes du pacte sur la migration et l'asile s'appliquent.","src":["sujet_immigration_dgef_titres2025","sujet_immigration_ofpra_bilan2025","sujet_immigration_insee_immigres","sujet_immigration_consilium_pacte"]},"chiffres":[{"v":"377 000","l":"premiers titres de séjour délivrés à des étrangers majeurs en 2025, soit 9,2 % de plus qu'en 2024 (données provisoires) : 116 835 pour études, 90 959 familiaux, 88 001 humanitaires, 50 848 économiques et 30 819 divers","src":"sujet_immigration_dgef_titres2025"},{"v":"145 210","l":"demandes de protection internationale enregistrées par l'Ofpra en 2025, soit 5,5 % de moins qu'en 2024 ; le taux de protection de l'Ofpra est de 41,2 % en 2025 (+2,4 points)","src":"sujet_immigration_ofpra_bilan2025"},{"v":"98 139","l":"personnes ont acquis la nationalité française en 2025 (-5,3 % par rapport à 2024), dont 42 246 par décret (-13,5 %) et 17 579 à raison du mariage (+10,5 %)","src":"sujet_immigration_dgef_nationalite2025"},{"v":"8,0 millions","l":"d'immigrés (personnes nées étrangères à l'étranger et résidant en France) vivent en France en 2025, soit 11,6 % de la population totale ; la population étrangère compte 6,3 millions de personnes (9,1 %)","src":"sujet_immigration_insee_immigres"},{"v":"23 549","l":"éloignements d'étrangers en situation irrégulière mis en œuvre en 2025, soit 11,1 % de plus qu'en 2024 (données provisoires) : 14 133 forcés, 4 564 aidés et 4 852 spontanés","src":"sujet_immigration_dgef_eloignements2025"},{"v":"7 426","l":"obligations de quitter le territoire français (OQTF) exécutées pour 69 888 prononcées au premier semestre 2025, d'après la DGEF citée par le Sénat","src":"sujet_immigration_senat_plf2026_immigration"}],"recent":[{"date":"12 juin 2026","txt":"Les règles du pacte sur la migration et l'asile de l'Union européenne, adopté par le Conseil de l'Union européenne le 14 mai 2024, entrent en application.","src":"sujet_immigration_consilium_pacte","iso":"2026-06-12"},{"date":"20 mai 2026","txt":"Le Sénat adopte en première lecture le projet de loi « Mise en oeuvre du Pacte sur la migration et l'asile », qui habilite le Gouvernement à prendre par ordonnances les adaptations rendues nécessaires par l'entrée en application de règlements européens. Ce texte est encore un projet : au 18 septembre 2026, date de la dernière mise à jour de la page du Sénat, il n'était ni promulgué ni transmis au Conseil constitutionnel.","src":"sujet_immigration_senat_pacte_pjl","iso":"2026-05-20"},{"date":"11 août 2025","txt":"La loi n° 2025-796 visant à faciliter le maintien en rétention des personnes condamnées pour des faits d'une particulière gravité et présentant de forts risques de récidive est promulguée, après la décision n° 2025-895 DC du Conseil constitutionnel du 7 août 2025, qui l'a jugée partiellement conforme à la Constitution.","src":"sujet_immigration_senat_retention2025","iso":"2025-08-11"},{"date":"26 janv. 2024","txt":"La loi n° 2024-42 pour contrôler l'immigration, améliorer l'intégration est promulguée (Journal officiel du 27 janvier 2024), après l'accord de la commission mixte paritaire du 19 décembre 2023. Le Conseil constitutionnel, par sa décision n° 2023-863 DC du 25 janvier 2024, l'a jugée partiellement conforme à la Constitution.","src":"sujet_immigration_senat_loi2024","iso":"2024-01-26"}],"decide":[{"txt":"La loi fixe les règles concernant la nationalité (article 34 de la Constitution) ; avant sa promulgation, une loi peut être déférée au Conseil constitutionnel, qui se prononce sur sa conformité à la Constitution (article 61).","src":"sujet_immigration_cc_constitution"},{"txt":"Le ministère de l'Intérieur indique que le préfet de département applique les règles relatives à l'entrée et au séjour des étrangers.","src":"sujet_immigration_interieur_prefectures"},{"txt":"En matière d'asile, la préfecture doit enregistrer la demande dans un délai de 3 jours ouvrés, l'Ofpra l'étudie d'abord dans le cadre du statut de réfugié, et un recours est possible devant la CNDA dans le délai d'un mois suivant la notification de la décision.","src":"sujet_immigration_sp_asile"},{"txt":"Au niveau européen, le pacte sur la migration et l'asile, adopté par le Conseil de l'Union européenne le 14 mai 2024, couvre notamment le filtrage, une procédure commune d'asile, les conditions d'accueil et la base de données Eurodac ; ses règles s'appliquent depuis le 12 juin 2026.","src":"sujet_immigration_consilium_pacte"}],"jeunes":[{"txt":"Nationalité française à 18 ans pour un jeune né en France de parents étrangers : il faut résider en France à 18 ans et y avoir eu sa résidence habituelle pendant une période continue ou discontinue de 5 ans ou plus depuis l'âge de 11 ans. L'acquisition est automatique : aucune démarche n'est à faire. D'autres conditions existent (voir la fiche).","src":"sujet_immigration_sp_nationalite18"},{"txt":"Étudiant étranger : le visa de long séjour valant titre de séjour (VLS-TS) est délivré pour une durée de 4 mois à 1 an et doit être validé dans les 3 mois suivant l'arrivée en France. Il faut être inscrit (ou préinscrit) dans un établissement d'enseignement supérieur ou de formation initiale et justifier de ressources au moins égales à 877,5 euros par mois. Après 1 an de séjour, on peut demander une carte de séjour temporaire étudiant (valable 1 an) ou pluriannuelle étudiant.","src":"sujet_immigration_sp_etudiant"}],"questions":[{"txt":"Comment réduire la durée de la procédure d'asile et le coût de l'accueil des demandeurs d'asile, tout en garantissant l'examen de chaque demande ?","src":"sujet_immigration_senat_asile_couts"},{"txt":"Comment améliorer l'exécution des obligations de quitter le territoire français, dans le respect des droits des personnes concernées ?","src":"sujet_immigration_senat_plf2026_immigration"},{"txt":"Comment adapter le droit français aux règles du pacte européen sur la migration et l'asile, entrées en application le 12 juin 2026 ?","src":"sujet_immigration_senat_affeur_pacte"}],"lire":["sujet_immigration_senat_asile_couts","sujet_immigration_senat_plf2026_immigration","sujet_immigration_senat_affeur_pacte"]},"institutions":{"trente":{"txt":"Les institutions françaises reposent sur la Constitution du 4 octobre 1958 : les députés sont élus au suffrage direct, les sénateurs au suffrage indirect. Le Conseil constitutionnel veille à la régularité de l'élection du Président de la République, prévue les 18 avril et 2 mai 2027. Depuis la dissolution de juin 2024, plusieurs Premiers ministres se sont succédé.","src":["sujet_institutions_cc_constitution","sujet_institutions_info_pdr2027","sujet_institutions_info_dissolution"]},"chiffres":[{"v":"73,69 %","l":"de participation au 1er tour de la présidentielle du 10 avril 2022 (71,99 % au 2nd tour, le 24 avril 2022)","src":"sujet_institutions_int_pdr2022"},{"v":"66,71 %","l":"de participation au 1er tour des législatives anticipées du 30 juin 2024 (66,63 % au 2nd tour, le 7 juillet 2024)","src":"sujet_institutions_int_leg2024"},{"v":"67,2 %","l":"des inscrits de 18 à 29 ans ont voté au 1er tour de la présidentielle de 2022, contre 77,0 % des 65 ans ou plus (Insee, novembre 2022)","src":"sujet_institutions_insee_ip1929"},{"v":"577 et 348","l":"députés et sénateurs au plus : maximum fixé par l'article 24 de la Constitution (texte à jour de la révision du 8 mars 2024)","src":"sujet_institutions_cc_constitution"},{"v":"9","l":"référendums nationaux organisés depuis 1958 sur le fondement des articles 11 et 89 de la Constitution, le dernier le 29 mai 2005 (page du Conseil constitutionnel de 2020)","src":"sujet_institutions_cc_referendums"},{"v":"1,5 million","l":"de jeunes nés entre 2006 et début 2008 inscrits d'office sur les listes électorales en 2026 (50,4 millions de personnes inscrites au total, mars 2026)","src":"sujet_institutions_insee_focus378"}],"recent":[{"date":"19 janv. 2026","txt":"Le Premier ministre annonce qu'il engagera le lendemain la responsabilité du Gouvernement (article 49.3 de la Constitution) sur la partie recettes du projet de loi de finances pour 2026. Le texte est alors réputé adopté sans vote, sauf si une motion de censure est déposée dans les 24 heures.","src":"sujet_institutions_info_budget493","iso":"2026-01-19"},{"date":"10 oct. 2025","txt":"Le Président de la République nomme Sébastien Lecornu Premier ministre et le charge de former un Gouvernement ; une première nomination avait eu lieu le 9 septembre 2025, date de fin de fonctions de François Bayrou (en poste du 13 décembre 2024 au 9 septembre 2025, selon info.gouv.fr). Michel Barnier avait été nommé Premier ministre le 5 septembre 2024.","src":"sujet_institutions_elysee_lecornu_oct","iso":"2025-10-10"},{"date":"7 août 2025","txt":"Le Conseil constitutionnel déclare conformes à la Constitution les dispositions déférées de la loi visant à réformer le mode d'élection des membres du conseil de Paris et des conseils municipaux de Lyon et Marseille. Selon info.gouv.fr, les municipales des 15 et 22 mars 2026 à Paris, Lyon et Marseille comportent un double scrutin distinct : un pour élire les conseillers d'arrondissement ou de secteur, l'autre pour choisir directement les représentants des mairies centrales.","src":"sujet_institutions_cc_2025892dc","iso":"2025-08-07"},{"date":"9 juin 2024","txt":"Le chef de l'État annonce la dissolution de l'Assemblée nationale (décret publié au Journal officiel le 10 juin). Les élections législatives anticipées ont lieu les 30 juin et 7 juillet 2024.","src":"sujet_institutions_info_dissolution","iso":"2024-06-09"}],"decide":[{"txt":"Pour réviser la Constitution (article 89), l'initiative appartient au Président de la République, sur proposition du Premier ministre, et aux membres du Parlement. Le texte doit être voté par les deux assemblées en termes identiques, puis approuvé par référendum ; le Président peut aussi le soumettre au Parlement réuni en Congrès, où il faut alors la majorité des trois cinquièmes des suffrages exprimés.","src":"sujet_institutions_cc_constitution"},{"txt":"Le Président de la République peut soumettre au référendum certains projets de loi (article 11) : sur l'organisation des pouvoirs publics, sur des réformes de la politique économique, sociale ou environnementale, ou pour ratifier certains traités. Il le fait sur proposition du Gouvernement pendant les sessions ou sur proposition conjointe des deux assemblées ; un référendum peut aussi être organisé à l'initiative d'un cinquième des parlementaires, soutenue par un dixième des électeurs inscrits.","src":"sujet_institutions_cc_constitution"},{"txt":"Le Conseil constitutionnel compte neuf membres, dont le mandat dure neuf ans et n'est pas renouvelable. Il veille à la régularité de l'élection du Président de la République (article 58) et se prononce sur la conformité à la Constitution des lois organiques avant leur promulgation ; les lois peuvent aussi lui être déférées (article 61).","src":"sujet_institutions_cc_constitution"}],"jeunes":[{"txt":"Un jeune de nationalité française qui a fait son recensement citoyen à 16 ans est inscrit automatiquement sur la liste électorale à 18 ans, dans la commune où il l'a fait. Sinon, il faut s'inscrire (en ligne, en mairie ou par courrier) avec un justificatif d'identité et un justificatif de domicile de moins de 3 mois. Pour voter à un scrutin donné, la demande par courrier doit arriver au plus tard le 6e vendredi avant le 1er tour.","src":"sujet_institutions_sp_inscription"},{"txt":"La majorité civile, fixée à 18 ans, ouvre le droit de se porter candidat à l'élection présidentielle et aux élections législatives. Pour être sénateur, l'âge minimum est de 24 ans (article L.O. 296 du code électoral) ; une proposition de loi déposée au Sénat en septembre 2026 propose de le ramener à 18 ans, mais ce n'est à ce stade qu'une proposition.","src":"sujet_institutions_senat_ppl948"},{"txt":"Présidentielle 2027 : 1er tour le dimanche 18 avril, 2nd tour le dimanche 2 mai 2027. Pour voter, il faut être inscrit sur les listes électorales. Pour être candidat, il faut obtenir la signature de 500 élus habilités, représentant au moins 30 départements ou collectivités d'outre-mer différents.","src":"sujet_institutions_info_pdr2027"}],"questions":[{"txt":"Comment répartir les prérogatives entre le chef de l'État et le chef du Gouvernement ?","src":"sujet_institutions_senat_r414"},{"txt":"Faut-il faciliter le déclenchement du référendum d'initiative partagée, et à quelles conditions ?","src":"sujet_institutions_senat_r99"},{"txt":"Comment encourager les jeunes à voter et à s'engager dans la vie démocratique ?","src":"sujet_institutions_senat_r648"},{"txt":"Comment organiser l'élection présidentielle pour en garantir la régularité : transmission électronique des parrainages, date limite des procurations, publicité du dépouillement ?","src":"sujet_institutions_cc_pdr2022obs"}],"lire":["sujet_institutions_senat_r414","sujet_institutions_cc_pdr2022obs","sujet_institutions_senat_r648"]},"europe":{"trente":{"txt":"La France contribue au budget de l'Union européenne par un prélèvement sur ses recettes, évalué à 28,8 milliards d'euros pour 2026. Au Conseil de l'Union, la politique étrangère et de sécurité commune se décide à l'unanimité, sauf exceptions. À l'ONU, la France est l'un des cinq membres permanents du Conseil de sécurité, qui sont seuls à disposer d'un droit de veto.","src":["sujet_europe_senat_psr","sujet_europe_consilium_unanimity","unric_veto"]},"chiffres":[{"v":"28,8 Md€","l":"de prélèvement sur recettes au profit de l'Union européenne évalué pour 2026 par le projet de loi de finances (+24,6 % par rapport à la prévision d'exécution 2025)","src":"sujet_europe_senat_psr"},{"v":"51,49 %","l":"de participation en France aux élections européennes de juin 2024 (50,74 % dans l'ensemble de l'Union européenne)","src":"sujet_europe_ep_results"},{"v":"5","l":"membres permanents du Conseil de sécurité de l'ONU, seuls à avoir un droit de veto : la Chine, les États-Unis, la France, le Royaume-Uni et la Russie","src":"unric_veto"}],"recent":[{"date":"23 avr. 2026","txt":"Le Conseil de l'Union européenne finalise un prêt de 90 milliards d'euros à l'Ukraine pour 2026 et 2027, financé par de l'emprunt de l'UE sur les marchés de capitaux et garanti par la marge du budget de l'UE : 30 milliards pour le soutien macroéconomique, 60 milliards pour les capacités industrielles de défense de l'Ukraine.","src":"sujet_europe_consilium_ukraine","iso":"2026-04-23"},{"date":"27 mai 2025","txt":"Le Conseil de l'Union européenne adopte SAFE (Security Action for Europe), un instrument de prêts allant jusqu'à 150 milliards d'euros pour financer des investissements de défense des États membres. En principe, les États bénéficiaires doivent mener des achats communs impliquant au moins deux pays participants.","src":"sujet_europe_consilium_safe","iso":"2025-05-27"}],"decide":[{"txt":"Au niveau de l'Union européenne, le Conseil vote à l'unanimité sur la politique étrangère et de sécurité commune, sauf dans certains cas précis où la majorité qualifiée s'applique. Avec l'unanimité, l'abstention d'un État n'empêche pas l'adoption d'une décision.","src":"sujet_europe_consilium_unanimity"}],"jeunes":[{"txt":"DiscoverEU, session d'octobre 2026 (candidatures du 1er au 15 octobre) : pour les jeunes de 18 ans nés en 2008, citoyens d'un État membre de l'UE ou d'un pays associé à Erasmus+, un pass ferroviaire gratuit valable jusqu'à 30 jours entre mars 2027 et mai 2028 (près de 41 000 titres).","src":"sujet_europe_ec_discovereu"}],"questions":[{"txt":"Quelle part de l'effort de défense doit être financée et organisée en commun au niveau européen, et quelle part doit rester nationale ?","src":"sujet_europe_ec_white"},{"txt":"Dans quels domaines l'Union européenne devrait-elle passer de l'unanimité à la majorité qualifiée, notamment avant un nouvel élargissement ?","src":"sujet_europe_ec_enlargement"}],"lire":["sujet_europe_ec_enlargement"]},"etudes":{"trente":{"txt":"À la rentrée 2025, plus de 3 millions d'étudiants sont inscrits dans l'enseignement supérieur. L'État finance les universités et les aides aux étudiants ; les montants des bourses sont maintenus en 2026-2027. Depuis le 4 mai 2026, le repas Crous à 1 € est ouvert à tous les étudiants.","src":["sujet_etudes_sies_nf17","sujet_etudes_senat_pjl_avis","sujet_etudes_esr_cout_rentree","sujet_etudes_crous_repas1e"]},"chiffres":[{"v":"3 049 600","l":"étudiants inscrits dans l'enseignement supérieur à la rentrée 2025 (+1,1 %, troisième hausse consécutive)","src":"sujet_etudes_sies_nf17"},{"v":"44 %","l":"des étudiants travaillent pendant l'année universitaire (enquête Conditions de vie de l'OVE, 2023, dernière édition publiée)","src":"sujet_etudes_ove_reperes2023"},{"v":"668 284","l":"étudiants bénéficiaient d'une bourse du ministère de l'Enseignement supérieur en 2025 (2,41 Md€ de bourses versées)","src":"sujet_etudes_crous_bourses"},{"v":"175 394","l":"lits de capacité d'accueil totale du réseau des Crous, dans 813 résidences et cités (rapport d'activité 2024)","src":"sujet_etudes_crous_rapport2024"},{"v":"40,3 %","l":"des bacheliers 2020 inscrits en L1 à la rentrée suivante ont obtenu leur licence en 3 ou 4 ans (30,1 % en 3 ans)","src":"sujet_etudes_sies_nf29"},{"v":"576 749","l":"lycéens avaient reçu au moins une proposition d'admission sur Parcoursup au 11 juillet 2026, sur 660 399 candidats lycéens","src":"sujet_etudes_parcoursup_tdb"}],"recent":[{"date":"1er juil. 2026","txt":"Les étudiants extracommunautaires titulaires d'un visa long séjour ou d'un titre de séjour portant la mention « poursuite d'études » ne peuvent plus percevoir les aides personnelles au logement que s'ils reçoivent une bourse sur critères sociaux, avec des exceptions prévues par la Caf.","src":"sujet_etudes_caf_apl","iso":"2026-07-01"},{"date":"5 juin 2026","txt":"Sur Parcoursup, les candidats ayant des vœux en attente doivent les classer par ordre de préférence entre le 5 et le 8 juin 2026 ; les vœux en attente non classés avant le 8 juin à 23 h 59 sont supprimés.","src":"sujet_etudes_parcoursup_diaporama","iso":"2026-06-05"},{"date":"4 mai 2026","txt":"Le repas à 1 € des restaurants universitaires est proposé à tous les étudiants (titulaires d'une carte d'étudiant, apprentis et alternants, doctorants, services civiques), sur présentation d'un compte Izly actif ; il comprend un plat principal et, au plus, deux périphériques.","src":"sujet_etudes_crous_repas1e","iso":"2026-05-04"},{"date":"29 mars 2023","txt":"Le ministère annonce une première étape de la réforme des bourses sur critères sociaux dès la rentrée 2023 : revalorisation de 37 € par mois (370 € par an) pour tous les échelons et 35 000 étudiants issus des classes moyennes vont devenir boursiers.","src":"sujet_etudes_esr_reforme2023","iso":"2023-03-29"}],"decide":[{"txt":"Les universités ont depuis la loi de 2007 (LRU) des « responsabilités et compétences élargies » et une autonomie budgétaire. Selon le Sénat, l'État exerce sa tutelle principalement par des contrats d'objectifs, de moyens et de performance, par la subvention pour charges de service public et par les priorités stratégiques fixées par le ministère.","src":"sujet_etudes_senat_r58"},{"txt":"Le Parlement examine chaque année les crédits dans le projet de loi de finances : pour 2026, 18,8 Md€ étaient prévus sur les programmes « Formations supérieures et recherche universitaire » et « Vie étudiante » (+0,7 %). La subvention pour charges de service public versée au réseau Cnous-Crous est de 548 M€ pour 2026 (32 % de ses ressources en 2024).","src":"sujet_etudes_senat_pjl_avis"},{"txt":"Les Crous forment un réseau de 27 établissements publics au service des étudiants (logement, restauration, culture) ; leur rôle est d'améliorer les conditions de vie et d'accueil de tous les étudiants.","src":"sujet_etudes_lescrous_reseau"}],"jeunes":[{"txt":"Bourse sur critères sociaux 2026-2027 : les montants annuels, versés sur 10 mois, vont de 1 454 € à 6 335 € selon l'échelon.","src":"sujet_etudes_crous_bourses"},{"txt":"Pour demander une bourse ou un logement Crous, il faut constituer son dossier social étudiant (DSE) sur messervices.etudiant.gouv.fr. Pour 2026-2027, la campagne a ouvert le 2 mars et courait jusqu'au 31 mai 2026 : après cette date, les dossiers sont traités au fil de l'eau, sans priorité pour le logement et avec un versement de bourse retardé.","src":"sujet_etudes_crous_dse"},{"txt":"Les aides au logement (APL ou ALS) ne dépendent pas des ressources des parents pour les étudiants. La demande doit être faite dès l'entrée dans le logement. Les salaires perçus en tant qu'étudiant sur l'année sont exonérés d'impôt sur le revenu dans la limite de 3 fois le Smic mensuel.","src":"sujet_etudes_guide_vie_etudiante"},{"txt":"La CVEC (contribution de vie étudiante et de campus) est de 105 € pour 2026-2027. Tout étudiant inscrit en formation initiale doit obtenir son attestation d'acquittement et la présenter à son établissement à l'inscription. Sont exonérés notamment les étudiants réfugiés, les bénéficiaires de la protection subsidiaire, les demandeurs d'asile et les boursiers du gouvernement français.","src":"sujet_etudes_cvec"}],"questions":[{"txt":"Comment garantir un financement lisible et stable des universités, alors que le Sénat relève en 2025 un résultat consolidé des établissements devenu déficitaire en 2024 et l'absence de modèle de répartition des moyens depuis 2016 ?","src":"sujet_etudes_senat_r58"},{"txt":"Faut-il faire évoluer les droits d'inscription à l'université, qu'une commission d'enquête du Sénat propose en septembre 2026 de porter à 900 € en licence et 1 300 € en master (soit 10 % du coût moyen) ?","src":"sujet_etudes_senat_ce943"},{"txt":"Faut-il poursuivre la réforme des bourses sur critères sociaux, dont la seconde phase, annoncée pour la rentrée 2025 et estimée entre 350 et 400 millions d'euros par le ministère, a été mise en suspens ?","src":"sujet_etudes_senat_pjl_avis"},{"txt":"Faut-il traiter ensemble le logement des étudiants et celui des jeunes actifs, comme le recommande une mission d'information du Sénat (octobre 2025) ?","src":"sujet_etudes_senat_logement_jeunes"}],"lire":["sujet_etudes_senat_r58","sujet_etudes_senat_ce943","sujet_etudes_senat_pjl_avis"]},"numerique":{"trente":{"txt":"En 2025, 48 % de la population utilise l'IA générative et 83 % des 11-17 ans utilisent chaque jour une très grande plateforme. Plateformes et IA relèvent de règlements européens (DSA, règlement sur l'IA). La loi du 24 août 2026 sur les réseaux sociaux a été promulguée sans son interdiction avant 15 ans, censurée par le Conseil constitutionnel.","src":["sujet_numerique_barometre_rapport","sujet_numerique_arcom_mineurs","sujet_numerique_arcom_dsa","sujet_numerique_ec_ai_act","sujet_numerique_cc_decision","sujet_numerique_senat_loi2026"]},"chiffres":[{"v":"48 %","l":"de la population de 12 ans et plus utilise des services d'IA générative en 2025, soit 15 points de plus en un an","src":"sujet_numerique_arcep_cp"},{"v":"85 %","l":"des 18-24 ans utilisent l'IA générative en 2025 (Baromètre du numérique, édition 2026)","src":"sujet_numerique_barometre_rapport"},{"v":"83 %","l":"des 11-17 ans utilisent chaque jour au moins une très grande plateforme en ligne (99 % au moins une plateforme), étude de l'Arcom de septembre 2025","src":"sujet_numerique_arcom_mineurs"},{"v":"62 %","l":"des 11-17 ans n'ont pas indiqué leur vraie date de naissance sur au moins une inscription (étude de l'Arcom, septembre 2025)","src":"sujet_numerique_arcom_mineurs"},{"v":"124 500","l":"sollicitations reçues par le 3018, numéro national pour les jeunes victimes de violences numériques, en 2025","src":"sujet_numerique_e_enfance_obs"},{"v":"83 sanctions","l":"prononcées par la CNIL en 2025, pour 486 839 500 € d'amendes au total","src":"sujet_numerique_cnil_sanctions"}],"recent":[{"date":"14 août 2026","txt":"Le Conseil constitutionnel déclare contraire à la Constitution l'article 1er de la loi visant à protéger les mineurs des risques auxquels les expose l'utilisation des réseaux sociaux, qui prévoyait d'interdire l'accès des moins de 15 ans aux réseaux sociaux. L'interdiction d'accès avant 15 ans n'est donc pas en vigueur. La loi n° 2026-813 est promulguée le 24 août 2026.","src":"sujet_numerique_cc_decision","iso":"2026-08-14"},{"date":"1er août 2024","txt":"Le règlement européen sur l'intelligence artificielle (AI Act) entre en vigueur, avec une application par étapes : pratiques interdites et obligations de formation à l'IA (« AI literacy ») depuis le 2 février 2025, règles pour les modèles d'IA à usage général depuis le 2 août 2025, application générale le 2 août 2026 avec des exceptions. Selon la Commission européenne, les règles sur certains systèmes à haut risque sont repoussées au 2 décembre 2027 (domaines sensibles) et au 2 août 2028 (produits réglementés).","src":"sujet_numerique_ec_ai_act","iso":"2024-08-01"},{"date":"17 févr. 2024","txt":"Le règlement européen sur les services numériques (DSA) s'applique à toutes les plateformes en ligne, quelle que soit leur taille. Il prévoit notamment une solution simple pour signaler les contenus illégaux, de la transparence sur la modération et les algorithmes, et l'interdiction de la publicité ciblée à destination des mineurs.","src":"sujet_numerique_arcom_dsa","iso":"2024-02-17"},{"date":"7 juil. 2023","txt":"La loi n° 2023-566 visant à instaurer une majorité numérique et à lutter contre la haine en ligne est adoptée, mais elle n'est jamais entrée en vigueur : la Commission européenne a considéré que le texte imposait des obligations techniques susceptibles d'affecter le marché communautaire et empiétait sur le règlement européen sur les services numériques (DSA), d'application directe.","src":"sujet_numerique_senat_essentiel","iso":"2023-07-07"}],"decide":[{"txt":"Le règlement européen sur les services numériques (DSA) est d'application directe : la Commission européenne a jugé que la loi française de 2023 sur la majorité numérique empiétait sur lui, ce qui l'a empêchée d'entrer en vigueur. Le droit national est donc encadré par le droit européen pour tout ce qui touche aux obligations imposées aux plateformes.","src":"sujet_numerique_senat_essentiel"},{"txt":"En France, l'Arcom est le « coordinateur pour les services numériques » : elle supervise le respect du DSA par les opérateurs établis en France et coopère avec ses homologues européens. La Commission européenne peut, elle, infliger aux très grandes plateformes des amendes allant jusqu'à 6 % de leur chiffre d'affaires mondial.","src":"sujet_numerique_arcom_dsa"},{"txt":"La CNIL est l'autorité chargée des données personnelles : en 2025, elle a reçu 20 150 plaintes (10 % de plus qu'en 2024), mené 323 contrôles et prononcé 83 sanctions.","src":"sujet_numerique_cnil_rapport"}],"jeunes":[{"txt":"Signaler un contenu illicite (menaces, contenus terroristes, contenus pédopornographiques, discours de haine, trafic d'êtres humains...) : le portail officiel PHAROS, internet-signalement.gouv.fr, est gratuit et permet de signaler sans s'identifier. Les policiers et gendarmes ne recontactent la personne qu'exceptionnellement, et ce n'est pas un service d'urgence.","src":"sujet_numerique_masecurite_pharos"},{"txt":"Cyberharcèlement : le 3018 est le numéro national dédié aux jeunes victimes de harcèlement et de violences numériques. Il est ouvert 7 jours sur 7, de 9 h à 23 h, par téléphone ou via l'application 3018.","src":"sujet_numerique_e_enfance_obs"},{"txt":"Vos données personnelles : vous pouvez demander à un organisme l'accès à vos données ou leur effacement. Il doit répondre au plus tard dans un délai d'un mois. Sans réponse satisfaisante, vous pouvez saisir la CNIL d'une plainte, après avoir d'abord contacté l'organisme ou son délégué à la protection des données, en joignant les pièces utiles (échanges, adresse URL...). Le service de plainte en ligne demande de créer un compte.","src":"sujet_numerique_cnil_plainte"},{"txt":"Arnaque ou piratage : 17Cyber, sur cybermalveillance.gouv.fr, est un service public d'assistance en ligne gratuit pour les victimes de cybermalveillance. Il propose un diagnostic rapide, des recommandations personnalisées, l'appui de prestataires informatiques et, si besoin, un accompagnement par tchat avec des policiers ou des gendarmes.","src":"sujet_numerique_cybermalv_17cyber"}],"questions":[{"txt":"Faut-il réserver l'accès des adolescents aux réseaux sociaux à ceux dotés d'une « conception éthique », comme le recommandait la commission d'experts sur les écrans en avril 2024, et à partir de quel âge ?","src":"sujet_numerique_elysee_ecrans"},{"txt":"Faut-il imposer aux plateformes des règles de conception pour les mineurs, comme un fil limité aux abonnements volontaires ou l'interdiction des lives rémunérés avant 18 ans, que propose une commission d'enquête de l'Assemblée nationale (septembre 2025) ?","src":"sujet_numerique_an_tiktok"},{"txt":"Comment prévenir les effets des réseaux sociaux sur la santé des adolescents (sommeil, santé mentale, cyberviolence), alors que l'Anses (décembre 2025) recommande vérification de l'âge, éducation aux médias et accès des chercheurs aux données des plateformes ?","src":"sujet_numerique_anses_rs"},{"txt":"Comment former élèves et enseignants à l'IA générative, dont l'usage dans les établissements scolaires dépend encore beaucoup des initiatives individuelles selon l'inspection générale (mai 2025) ?","src":"sujet_numerique_igesr_ia"}],"lire":["sujet_numerique_elysee_ecrans","sujet_numerique_an_tiktok","sujet_numerique_anses_rs"]},"pouvoir":{"trente":{"txt":"Le pouvoir d'achat, c'est le volume de biens et services qu'un revenu permet d'acheter : il dépend des revenus et des prix. Selon l'Insee, celui des ménages a reculé de 0,4 % en 2025 (-0,7 % par unité de consommation) et il baisse encore au 2e trimestre 2026, alors que l'inflation atteint 3,0 % en septembre.","src":["sujet_pouvoir_insee_def","sujet_pouvoir_insee_nation25","sujet_pouvoir_insee_t2","sujet_pouvoir_insee_ipc_sept"]},"chiffres":[{"v":"-0,4 %","l":"pouvoir d'achat du revenu disponible brut des ménages en 2025, soit -0,7 % par unité de consommation (après +2,7 % en 2024)","src":"sujet_pouvoir_insee_nation25"},{"v":"-0,6 %","l":"pouvoir d'achat des ménages par unité de consommation au 2e trimestre 2026, sur un trimestre","src":"sujet_pouvoir_insee_t2"},{"v":"3,0 %","l":"inflation sur un an en septembre 2026, estimation provisoire (2,4 % en août), avec des prix de l'énergie en hausse de 21,2 %","src":"sujet_pouvoir_insee_ipc_sept"},{"v":"+1,5 %","l":"prix de l'alimentation sur un an en septembre 2026, estimation provisoire (+1,1 % en août)","src":"sujet_pouvoir_insee_ipc_sept"},{"v":"148,37","l":"indice de référence des loyers au 2e trimestre 2026, soit +1,15 % sur un an","src":"sujet_pouvoir_insee_irl"},{"v":"17,2 %","l":"taux d'épargne des ménages au 2e trimestre 2026, en fort repli sur le trimestre","src":"sujet_pouvoir_insee_t2"}],"recent":[{"date":"1er juin 2026","txt":"Le Smic est revalorisé de 2,41 %.","src":"sujet_pouvoir_eco_smic_juin","iso":"2026-06-01"},{"date":"1er févr. 2025","txt":"L'accise sur l'électricité revient à son niveau d'avant la crise, selon l'arrêté du 20 décembre 2024, et la CRE propose alors une baisse moyenne de 15 % des tarifs réglementés (de 281 à 239 € TTC par MWh).","src":"sujet_pouvoir_cre_cp2025","iso":"2025-02-01"},{"date":"1er févr. 2024","txt":"L'accise sur l'électricité, ramenée à 1 € par MWh pendant le bouclier tarifaire au lieu de 32 €, remonte à 21 € par MWh, et les tarifs réglementés augmentent de 8,6 % (tarif de base) à 9,8 % (heures pleines et creuses), taxes comprises.","src":"sujet_pouvoir_eco_elec2024","iso":"2024-02-01"},{"date":"juil. 2023","txt":"La loi n° 2023-568 prolonge jusqu'au 1er trimestre 2024 le plafond de 3,5 % de la hausse annuelle de l'indice de référence des loyers (IRL), plafond instauré par la loi du 16 août 2022.","src":"sujet_pouvoir_eco_irl_daj","iso":"2023-07"}],"decide":[{"txt":"Chaque année, l'Assemblée nationale et le Sénat examinent et votent le projet de loi de finances, qui propose l'ensemble des recettes de l'État, principalement des impôts et taxes, et de ses dépenses.","src":"sujet_pouvoir_eco_plf"},{"txt":"Pour la TVA, l'Union européenne impose un taux normal d'au moins 15 % ; dans ce cadre, chaque État membre fixe le nombre et le niveau de ses taux.","src":"sujet_pouvoir_ue_tva"},{"txt":"Les tarifs réglementés de l'électricité sont proposés par la CRE aux ministres de l'énergie et de l'économie, qui peuvent les fixer par arrêté pris chaque année après son avis.","src":"sujet_pouvoir_cre_2026_147"},{"txt":"Depuis le 1er janvier 1987, les prix sont libres en France, à quelques exceptions près, comme les tarifs réglementés de l'électricité et du gaz.","src":"sujet_pouvoir_eco_prix"}],"jeunes":[{"txt":"Prime d'activité : pour un étudiant salarié, la Caf indique qu'il faut avoir plus de 18 ans et percevoir un montant net social supérieur à 78 % du Smic sur les 3 mois déclarés ; la prime est ensuite versée chaque mois selon les ressources des 3 derniers mois.","src":"sujet_pouvoir_caf_prime"},{"txt":"Chèque énergie : les ménages dont le revenu fiscal de référence 2024 par unité de consommation est inférieur à 11 000 € le reçoivent sans démarche, pour un montant de 48 à 277 € selon les revenus et la composition du foyer, à utiliser pour une dépense d'énergie liée au logement.","src":"sujet_pouvoir_eco_cheque"},{"txt":"Pass Culture : depuis le 1er mars 2025, un jeune de 18 ans dispose de 150 € (contre 300 € auparavant), utilisables sur trois ans au lieu de deux, avec un bonus possible de 50 € en cas de handicap (AEEH ou AAH) ou sous conditions de ressources du foyer.","src":"sujet_pouvoir_passculture"}],"questions":[{"txt":"Faut-il protéger les ménages des hausses de prix de l'énergie par des mesures pour tous ou par des aides plus ciblées, alors qu'un rapport du Sénat relevait en 2023 que l'hétérogénéité des mesures avait nui à leur lisibilité ?","src":"sujet_pouvoir_senat_energie"},{"txt":"Quel indicateur décrit le mieux le pouvoir d'achat vécu : celui de l'ensemble des ménages, celui par unité de consommation, ou l'inflation mesurée par l'indice des prix à la consommation ?","src":"sujet_pouvoir_insee_def"},{"txt":"À partir de quel âge ouvrir l'accès à un revenu minimum, alors que la restriction pour les moins de 25 ans « fait débat depuis de nombreuses années » selon le Conseil d'orientation des politiques de jeunesse (2019) ?","src":"sujet_pouvoir_coj_rua"}],"lire":["sujet_pouvoir_insee_nation25","sujet_pouvoir_senat_energie","sujet_pouvoir_coj_rua"]},"defense":{"trente":{"txt":"Le Président de la République est le chef des armées ; le Parlement vote les lois de programmation militaire et les lois de finances. La loi du 16 août 2026 actualise la programmation militaire 2024-2030. L'OTAN compte 32 membres, engagés en 2025 à investir 5 % du PIB dans la défense et la sécurité d'ici 2035.","src":["sujet_europe_cc_constitution","sujet_europe_senat_loi_lpm","sujet_europe_nato_members","sujet_europe_nato_hague"]},"chiffres":[{"v":"56,9 Md€","l":"de crédits pour la mission Défense hors pensions en 2026 (loi de finances initiale) ; 68,3 Md€ pour l'ensemble du ministère, pensions incluses","src":"sujet_europe_def_chiffres2026"},{"v":"436 Md€","l":"de crédits budgétaires courants pour la mission Défense sur 2024-2030 selon la loi du 16 août 2026 actualisant la programmation militaire, avec 36 Md€ de ressources supplémentaires sur 2026-2030","src":"sujet_europe_senat_loi_lpm"},{"v":"5 % du PIB","l":"d'ici 2035 : engagement des Alliés de l'OTAN au sommet de La Haye en juin 2025, dont au moins 3,5 % pour les besoins de défense de base et jusqu'à 1,5 % pour des dépenses liées à la sécurité (infrastructures critiques, réseaux, résilience civile)","src":"sujet_europe_nato_hague"},{"v":"201 016","l":"militaires du ministère (équivalents temps plein travaillés) au 31 décembre 2025, sur 264 720 personnels civils et militaires ; 49 290 réservistes sous contrat","src":"sujet_europe_def_chiffres2026"}],"recent":[{"date":"16 août 2026","txt":"La loi actualisant la programmation militaire pour les années 2024 à 2030 est promulguée (loi n° 2026-791). Elle porte à 436 milliards d'euros courants les crédits de la mission Défense sur la période, avec 36 milliards de ressources supplémentaires sur 2026-2030. Le Parlement l'avait définitivement adoptée le 1er juillet 2026 et le Conseil constitutionnel l'a déclarée conforme à la Constitution le 6 août 2026.","src":"sujet_europe_senat_loi_lpm","iso":"2026-08-16"},{"date":"27 mai 2025","txt":"Le Conseil de l'Union européenne adopte SAFE (Security Action for Europe), un instrument de prêts allant jusqu'à 150 milliards d'euros pour financer des investissements de défense des États membres. En principe, les États bénéficiaires doivent mener des achats communs impliquant au moins deux pays participants.","src":"sujet_europe_consilium_safe","iso":"2025-05-27"},{"date":"7 mars 2024","txt":"La Suède devient le 32e membre de l'OTAN, après la Finlande, 31e membre depuis le 4 avril 2023.","src":"sujet_europe_nato_members","iso":"2024-03-07"}],"decide":[{"txt":"Le Président de la République est le chef des armées (article 15 de la Constitution) et le Premier ministre est responsable de la défense nationale (article 21). Le Parlement vote les lois de programmation, qui déterminent les objectifs de l'action de l'État (article 34), et les lois de finances, qui déterminent les ressources et les charges de l'État. La déclaration de guerre est autorisée par le Parlement ; le Gouvernement l'informe de toute intervention des forces armées à l'étranger au plus tard trois jours après son début et, au-delà de quatre mois, en soumet la prolongation à son autorisation (article 35).","src":"sujet_europe_cc_constitution"},{"txt":"La programmation militaire est fixée par une loi : celle qui actualise la LPM 2024-2030 a été adoptée par le Sénat (texte de compromis du 30 juin 2026) puis par l'Assemblée nationale (1er juillet 2026), déclarée conforme à la Constitution par le Conseil constitutionnel le 6 août 2026 et promulguée le 16 août 2026.","src":"sujet_europe_senat_loi_lpm"}],"jeunes":[{"txt":"Dès 16 ans, chaque Français doit faire son recensement citoyen. Il est ensuite convoqué automatiquement à la journée défense et citoyenneté (JDC), qu'il doit faire avant 25 ans ; service-public.gouv.fr l'appelle désormais « journée de mobilisation (ex-JDC) » et indique que les jeunes y sont convoqués pendant l'année de leurs 17 ans. Le certificat de participation est demandé pour s'inscrire au permis de conduire (de 17 à 24 ans) et aux examens et concours comme le bac ou les concours administratifs (de 18 à 24 ans) ; à partir de 25 ans, aucun justificatif n'est exigé.","src":"sujet_europe_sp_jdc"},{"txt":"Le nouveau service national est volontaire et ouvert aux Français de 18 à 25 ans, avec ou sans diplôme. Il dure 10 mois (1 mois de formation initiale et 9 mois en unité), avec une solde d'au moins 800 euros brut par mois ; il est mis en place progressivement à partir de septembre 2026. Service-public.gouv.fr précise que ce service national, exclusivement militaire, est voué à remplacer le service national universel (SNU).","src":"sujet_europe_info_servicenational"},{"txt":"Pour devenir réserviste opérationnel dans les armées, il faut être français, avoir 17 ans minimum (limite d'âge : 72 ans), être apte médicalement et avoir accompli la journée de mobilisation (ex-JDC) ou le service militaire. Le contrat d'engagement dure de 1 à 5 ans, pour 5 à 120 jours d'activité par année civile.","src":"sujet_europe_sp_reserve"}],"questions":[{"txt":"Quel effort de défense la France peut-elle financer compte tenu de l'état de ses finances publiques ?","src":"sujet_europe_senat_avis654"},{"txt":"Quelle part de l'effort de défense doit être financée et organisée en commun au niveau européen, et quelle part doit rester nationale ?","src":"sujet_europe_ec_white"},{"txt":"Quelle place donner aux jeunes dans la défense nationale : journée de mobilisation, service national volontaire, réserve ?","src":"sujet_europe_senat_r666"}],"lire":["sujet_europe_senat_avis654","sujet_europe_senat_r666"]},"etat":{"trente":{"txt":"L'organisation de la République est décentralisée : l'État, avec ses ministères, ses préfectures et ses opérateurs, partage l'action publique avec les collectivités territoriales (communes, départements, régions), qui s'administrent librement par des conseils élus. Fin 2024, 5,9 millions d'agents travaillent dans les trois fonctions publiques : d'État, territoriale et hospitalière.","src":["sujet_institutions_cc_constitution","sujet_etat_insee_fp2024"]},"chiffres":[{"v":"5,9 millions","l":"d'agents dans la fonction publique fin 2024 : 2,59 millions pour l'État, 2,04 millions pour la territoriale, 1,25 million pour l'hospitalière (+0,6 % en un an)","src":"sujet_etat_insee_fp2024"},{"v":"24,0 %","l":"des agents publics sont contractuels fin 2024, soit 0,7 point de plus qu'en 2023","src":"sujet_etat_insee_fp2024"},{"v":"434","l":"opérateurs de l'État recensés par une commission d'enquête du Sénat en 2025, avec 103 agences et 317 organismes consultatifs","src":"sujet_etat_senat_r807"},{"v":"2 840","l":"espaces France services, ou plus, pour aider aux démarches administratives (près de 9 millions de démarches en 2023, selon la Cour des comptes)","src":"bdt_france_services"}],"recent":[{"date":"1er juil. 2025","txt":"La commission d'enquête du Sénat sur les agences, opérateurs et organismes consultatifs de l'État rend son rapport. Elle recense 103 agences, 434 opérateurs et 317 organismes consultatifs, et propose une méthode de réforme plutôt que des coupes budgétaires.","src":"sujet_etat_senat_r807","iso":"2025-07-01"},{"date":"19 mai 2025","txt":"Le gouvernement veut supprimer ou fusionner environ un tiers des opérateurs et agences de l'État, avec 2 à 3 milliards d'euros d'économies visées en 2027, selon Public Sénat. Ces organismes emploient environ 180 000 personnes.","src":"sujet_etat_ps_agences","iso":"2025-05-19"}],"decide":[{"txt":"L'organisation de la République est décentralisée (article 1er de la Constitution). Les collectivités territoriales sont les communes, les départements, les régions, les collectivités à statut particulier et les collectivités d'outre-mer ; elles s'administrent librement par des conseils élus, dans les conditions prévues par la loi (article 72).","src":"sujet_institutions_cc_constitution"},{"txt":"Le Gouvernement détermine et conduit la politique de la nation et dispose de l'administration (article 20 de la Constitution).","src":"sujet_institutions_cc_constitution"}],"questions":[{"txt":"Quelles missions confier à l'État, à ses agences et opérateurs, ou aux collectivités locales ?","src":"sujet_etat_senat_r807"},{"txt":"Combien peut-on économiser en réduisant le nombre d'agences et d'opérateurs, sans dégrader le service rendu ?","src":"sujet_etat_ps_agences"}],"lire":["sujet_etat_senat_r807","sujet_etat_insee_fp2024"]}},"semaine":{"d":"2026-10-15","titre":["Natacha Polony annonce sa candidature,","Raphaël Glucksmann remporte la primaire sociale-démocrate,","{n} propositions ajoutées."],"ecrans":[{"k":"Nouvelle candidature","c1":"polony","txt":"Annoncée le 14 octobre 2026 sur France Inter. Elle doit encore recevoir les parrainages de 500 élus pour pouvoir se présenter.","src":["lcp_polony"]},{"k":"Primaire sociale-démocrate","t":"Raphaël Glucksmann l'emporte dès le premier tour","txt":"Le vote, prolongé jusqu'à dimanche 18 h après une cyberattaque, est terminé. Il est désigné candidat de la gauche sociale-démocrate à la présidentielle. Olivier Faure arrive deuxième. Pas de second tour.","stat":{"pre":"Raphaël Glucksmann obtient","v":"66,13 %","u":"des voix"},"c":["faure","glucksmann","guedj","maurel","royal"],"src":["lcp_primaire_resultats","e1_primaire_resultats"],"cl":"Les cinq candidats de la primaire"},{"k":"Dans l'appli","t":"Un sujet élargi : Environnement et climat","txt":"L'ancien sujet « Climat et énergie » couvre maintenant aussi la biodiversité, l'eau, l'agriculture et les pesticides, les sols et la pollution de l'air, avec des chiffres officiels et de nouvelles propositions des candidats."}]},"statutsNote":{"primaire":"« A perdu la primaire » : candidat à la primaire sociale-démocrate, remportée le 11 octobre 2026 par Raphaël Glucksmann. Ses propositions restent consultables dans l'appli."},"rubriques":[["finances","Finances publiques"],["interieur","Int
