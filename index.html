érieur & Justice"],["social","Social & Solidarité"],["travail","Travail & Retraites"],["environnement","Environnement"],["europe","Europe & international"],["gouvernance","Gouvernance & République"],["etat","Réformes de l'État"],["education","Éducation & Jeunesse"],["defense","Défense"],["numerique","Numérique & IA"]],"themeRub":{"budget":"finances","eco":"finances","securite":"interieur","immigration":"interieur","pouvoir":"social","logement":"social","social":"social","travail":"travail","retraites":"travail","ecologie":"environnement","europe":"europe","institutions":"gouvernance","education":"education","etudes":"education","numerique":"numerique","defense":"defense","etat":"etat"},"reglePhares":"Dans chaque thème, jusqu'à 3 mesures phares viennent d'abord : celles que le candidat met lui-même le plus en avant (titres de son programme, documents chiffrés, discours de 2026). Les autres sont repliées en dessous."}</script>
<script>
"use strict";
/* Les données vivent dans data.json : une mise à jour ne touche que ce fichier. La copie intégrée sert d'affichage immédiat et de secours hors connexion. */
let DATA = JSON.parse(document.getElementById("seed").textContent);
let CAND = {}, SRC = {}, THEME_NAME = {};

const ICONS = {
  travail: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18"/>',
  logement: '<path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 0 1-1.5 1.5H14v-6h-4v6H5.5A1.5 1.5 0 0 1 4 19.5z"/>',
  education: '<path d="M12 6.5C10 5 7 4.4 4 5v14c3-.6 6 0 8 1.5 2-1.5 5-2.1 8-1.5V5c-3-.6-6 0-8 1.5zM12 6.5v14"/>',
  ecologie: '<path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l7-7"/>',
  retraites: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4.3l3 1.9"/>',
  social: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  eco: '<path d="M16.5 7.2a6 6 0 1 0 0 9.6"/><path d="M5 10.5h8M5 13.5h8"/>',
  securite: '<path d="M12 3l7 3v5.2c0 4.4-3 7.9-7 9.8-4-1.9-7-5.4-7-9.8V6z"/>',
  immigration: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.6 2.6 2.6 13.4 0 16M12 4c-2.6 2.6-2.6 13.4 0 16"/>',
  institutions: '<rect x="4" y="10" width="16" height="10" rx="1.6"/><path d="M9 10V4h6v6M8 14.5h8"/>',
  europe: '<path d="M12 4l2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 15.8l-4.6 2.5.9-5.2-3.8-3.6 5.2-.7z"/>',
  budget: '<path d="M4 9l8-5 8 5M5.5 9v9M9.8 9v9M14.2 9v9M18.5 9v9M3 20h18"/>',
  etudes: '<path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4M21 9v5"/>',
  pouvoir: '<path d="M4 9h16l-1.5 10h-13z"/><path d="M8 9l3-5M16 9l-3-5M9.5 13v3M14.5 13v3"/>',
  numerique: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 17.5h2M10 9a3 3 0 0 1 4 0M8.6 7.3a5 5 0 0 1 6.8 0"/>',
  r_finances: '<path d="M16.5 7.2a6 6 0 1 0 0 9.6"/><path d="M5 10.5h8M5 13.5h8"/>',
  r_interieur: '<path d="M12 4v16M8 20h8M5 7h14M5 7l-2.5 6a2.5 2.5 0 0 0 5 0zM19 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/>',
  r_social: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  r_travail: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18"/>',
  r_environnement: '<path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l7-7"/>',
  r_europe: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.6 2.6 2.6 13.4 0 16M12 4c-2.6 2.6-2.6 13.4 0 16"/>',
  r_gouvernance: '<path d="M4 9l8-5 8 5M5.5 9v9M9.8 9v9M14.2 9v9M18.5 9v9M3 20h18"/>',
  r_etat: '<path d="M19.5 11A7.5 7.5 0 0 0 6 6.8L4.5 8.5M4.5 4.5v4h4"/><path d="M4.5 13A7.5 7.5 0 0 0 18 17.2l1.5-1.7M19.5 19.5v-4h-4"/>',
  r_education: '<path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4M21 9v5"/>',
  r_defense: '<path d="M4 17h16M5.5 17v-2.5a6.5 6.5 0 0 1 13 0V17M12 8v4M3 20h18"/>',
  r_numerique: '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>'
};
const svg = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">${ICONS[k] || ""}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"/></svg>';
const EXT = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M14 5h5v5M19 5l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>';
const ARW = '<svg viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const isoDay = d => /^\d{4}-\d{2}-\d{2}$/.test(d);
const fmtD = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });
const fmtDM = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short" });
const fmtM = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" });
const dt = d => new Date(d + "T12:00:00");
function fmtDate(d, short) {
  if (isoDay(d)) return (short && d.slice(0, 4) === new Date().getFullYear().toString() ? fmtDM : fmtD).format(dt(d));
  if (/^\d{4}-\d{2}$/.test(d)) return fmtM.format(dt(d + "-15"));
  return d;
}
const nf1 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const md = v => nf1.format(v) + " milliard" + (v >= 2 ? "s" : "") + " d'euros";
const daysTo = d => Math.max(0, Math.ceil((new Date(d + "T08:00:00") - new Date()) / 86400000));
const daysSince = d => Math.floor((new Date() - dt(d)) / 86400000);
const ext = (u, label) => `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`;
const KIND = { officiel: "document du candidat", presse: "média", analyse: "comparateur", donnees: "source officielle", sondage: "institut de sondage", etude: "think tank ou institut" };

function prep() {
  CAND = Object.fromEntries(DATA.candidats.map(c => [c.id, c]));
  SRC = DATA.sources;
  THEME_NAME = Object.fromEntries(DATA.themes);
}
const candSorted = () => DATA.candidats.slice().sort((a, b) => a.tri.localeCompare(b.tri, "fr"));
const propsOf = id => DATA.propositions.filter(p => p.c === id);
const nom = id => CAND[id] ? CAND[id].nom : id;
function initials(c) { const t = c.tri.split(" "); return t.length > 1 ? t.map(w => w[0].toUpperCase()).join("") : t[0][0].toUpperCase() + t[0][1].toLowerCase(); }
/* Photo ronde, même cadrage pour tous ; initiales quand aucune photo libre de droits n'existe */
function mono(id, size = "") {
  const c = CAND[id];
  if (c && c.photo) { const big = size === "l", px = big ? 92 : size === "s" ? 30 : 40; return `<img class="mono ${size}" src="photos/${c.id}${big ? "" : "-96"}.jpg" alt="" width="${px}" height="${px}" loading="${big ? "eager" : "lazy"}" decoding="async">`; }
  return `<span class="mono ${size}" aria-hidden="true">${c ? initials(c) : "·"}</span>`;
}
const photoCredit = c => c.photo
  ? `Photo : ${esc(c.photo.a)}, ${esc(c.photo.y)} · ${ext(c.photo.lu, esc(c.photo.l))} · ${ext(c.photo.u, "Wikimedia Commons")} · recadrée`
  : "Pas de photo libre de droits trouvée pour l'instant : l'appli n'utilise que des photos dont la licence autorise la réutilisation.";
/* « À confirmer » : la proposition ne repose que sur un comparateur, pas encore sur un document du candidat ou un média */
const onlyAnalyse = p => allSrc(p).every(s => SRC[s] && SRC[s].type === "analyse");
/* Fiche détaillée (p.plus) : chaque élément est [texte, source, ...] ; une source vide signale un constat de l'appli (« nous n'avons pas trouvé… ») */
const PLUS_KEYS = ["detail", "objectif", "pourquoi", "auj", "fin_cand", "fin_ind"];
const plusSrc = x => x ? PLUS_KEYS.flatMap(k => (x[k] || []).flatMap(it => it.slice(1))).concat(x.note ? x.note.slice(1) : []) : [];
const SRC_ORDER = ["officiel", "donnees", "presse", "etude", "sondage", "analyse"];
const allSrc = p => p.s.concat(plusSrc(p.plus)).filter((s, i, a) => s && SRC[s] && a.indexOf(s) === i);
const tbc = p => onlyAnalyse(p) ? `<span class="tbc" title="Seule source trouvée : un comparateur. La proposition reste à confirmer sur un document du candidat ou dans un média.">À confirmer</span>` : "";
const statut = c => `<span class="pill st-${c.statut}">${esc(DATA.statuts[c.statut])}</span>`;
const isNew = p => p.aj > DATA.base && daysSince(p.aj) <= 10;
/* Date d'annonce : la plus ancienne source datée (articles, ou documents publiés à une date précise), hors pages simplement consultées le jour de la mise à jour */
const pDate = p => p.s.map(s => SRC[s]).filter(s => isoDay(s.d) && s.type !== "analyse" && (s.type === "presse" || s.d !== DATA.base)).map(s => s.d).sort()[0] || null;

function amount(a) {
  if (!a) return "";
  const lab = a.lab || { cout: "Coût annoncé", economie: "Économie annoncée", recette: "Recette annoncée", neutre: "Présenté comme neutre", dette: "Montant concerné" }[a.nature];
  const per = a.per === "an" ? " par an" : "";
  const share = v => { const x = v / DATA.reperes.depenses.v * 100; return x < 0.1 ? "moins de 0,1 %" : (x < 1 ? new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 }).format(x) : nf1.format(x)) + " %"; };
  const hab = a.per === "an" ? `<span>soit environ ${nf0.format(a.v * 1e9 / (DATA.reperes.population * 1e6))} € par habitant et ${share(a.v)} des dépenses publiques</span>` : (a.nature === "dette" || a.per === "total" ? `<span>${esc(a.h)}</span>` : "");
  return `<span class="amt ${a.nature}">${lab} : ${md(a.v)}${per}${hab}</span>`;
}
function srcLine(ids) {
  return ids.map(id => { const s = SRC[id]; return `${ext(s.u, esc(s.p))} · ${KIND[s.type]} · ${esc(fmtDate(s.d, true))}`; }).join("<br>");
}
const FIN_HELP = {
  f: "Le candidat donne le coût et dit comment il le finance.",
  c: "Un montant est annoncé, mais nous n'avons pas trouvé comment il serait financé.",
  n: "Nous n'avons trouvé aucun chiffrage de cette proposition à ce jour.",
  s: "Changement de règle ou d'institution, sans dépense ni recette nouvelle annoncée. Ses effets indirects peuvent coûter ou rapporter."
};
function finLabel(p) { if (p.fin === "c" && p.a && p.a.nature === "economie") return "Économie chiffrée"; if (p.fin === "c" && p.a && p.a.nature === "recette") return "Recette chiffrée"; return { f: "Chiffrée et financée", c: "Chiffrée, financement non trouvé", n: "Aucun chiffrage trouvé", s: "Sans dépense directe" }[p.fin] || ""; }
const finHelp = p => p.a && p.a.nature === "recette" ? "Le candidat annonce ce que la mesure rapporterait." : FIN_HELP[p.fin] || "";
const finBadge = p => p.fin ? `<span class="fin fin-${p.fin}" title="${esc(finHelp(p))}">${esc(finLabel(p))}</span>` : "";
const finText = p => p.finTxt ? `<p class="fintxt">Financement prévu : ${esc(p.finTxt)}</p>` : "";
function propItem(p) {
  const ss = p.s.filter(s => SRC[s]);
  return `<div class="prop"><p class="pt">${isNew(p) ? '<span class="newb">Nouveau</span>' : ""}${frTypo(p.t)}</p><div class="badges">${finBadge(p)}${tbc(p)}</div>${amount(p.a)}${finText(p)}<div class="prop-f"><p class="src">Source : ${ss.length ? `${ext(SRC[ss[0]].u, esc(SRC[ss[0]].p))}, ${esc(fmtDate(SRC[ss[0]].d, true))}` : ""}${allSrc(p).length > 1 ? `<span class="more-s">, et ${allSrc(p).length - 1} autre${allSrc(p).length > 2 ? "s" : ""}</span>` : ""}</p><button class="plus-btn" type="button" data-more="${p.id}">Aller plus loin${CHEV}</button></div></div>`;
}

/* ---------- graphiques ---------- */
function pollBars(sd, opts = {}) {
  const rows = Object.entries(sd.scores).map(([id, v]) => [nom(id), v, id]).concat((sd.autres || []).map(([n, v]) => [n, v, null])).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "fr"));
  const list = opts.limit ? rows.slice(0, opts.limit) : rows;
  const max = Math.max(40, Math.ceil(rows[0][1] / 10) * 10);
  return `<div class="poll">${list.map(([n, v, id]) => {
    const e = 196 * Math.sqrt((v / 100) * (1 - v / 100) / sd.n);
    return `<div class="poll-row">${id ? `<a class="n" href="#c-${id}">${esc(n)}</a>` : `<span class="n">${esc(n)}</span>`}<span class="track"><span class="fill" style="width:${v / max * 100}%"></span>${opts.moe ? `<span class="moe" style="left:${Math.max(0, v - e) / max * 100}%;width:${2 * e / max * 100}%"></span>` : ""}</span><span class="v">${nf1.format(v)} %</span></div>`;
  }).join("")}</div>`;
}
function axis(cfg) {
  const pos = v => (v - cfg.min) / (cfg.max - cfg.min) * 100;
  const rows = cfg.rows.slice().sort((a, b) => CAND[a.c].tri.localeCompare(CAND[b.c].tri, "fr")).map(r => {
    const p = pos(r.v), main = r.label || nf0.format(r.v) + " " + cfg.unite;
    const hasAlt = r.alt != null, pa = hasAlt ? pos(r.alt) : p;
    const lo = Math.min(p, pa), hi = Math.max(p, pa);
    const text = hasAlt ? main + ", " + r.altLabel : main;
    const lab = lo < 50 ? `<span class="lb" style="left:${lo}%;transform:translate(${lo < 6 ? "-4px" : "-7px"}, 10px)">${esc(text)}</span>` : `<span class="lb" style="left:${hi}%;transform:translate(calc(-100% + 7px), 10px)">${esc(text)}</span>`;
    const range = hasAlt ? `<span class="rng" style="left:${lo}%;width:${hi - lo}%"></span><span class="pt alt" style="left:${pa}%"></span>` : "";
    return `<div class="axis-row"><a class="who" href="#c-${r.c}">${esc(CAND[r.c].tri)}</a><div class="axis-track" title="${esc(CAND[r.c].nom)} : ${esc(text)} (source : ${esc(SRC[r.s].p)})">${range}<span class="pt${r.hollow ? " alt" : ""}" style="left:${p}%"></span>${lab}</div></div>`;
  }).join("");
  return `<div class="axis">${rows}<div class="axis-scale"><span></span><div class="ticks">${cfg.ticks.map(t => `<span style="left:${pos(t)}%">${nf0.format(t)}</span>`).join("")}</div></div></div>`;
}

/* Références numérotées : chaque phrase porte un petit numéro, la liste des sources suit (même rendu partout) */
function refBox() {
  const refs = [];
  const ref = id => { if (Array.isArray(id)) return id.map(ref).join(""); if (!SRC[id]) return ""; let i = refs.indexOf(id); if (i < 0) { refs.push(id); i = refs.length - 1; } return `<sup class="ref"><a href="${esc(SRC[id].u)}" target="_blank" rel="noopener" aria-label="Source ${i + 1} : ${esc(SRC[id].p)}">${i + 1}</a></sup>`; };
  const list = () => refs.length ? `<ol class="refs">${refs.map(id => { const x = SRC[id]; return `<li><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.p)}</a>${x.d ? " · " + esc(fmtDate(x.d)) : ""} <span>${esc(x.t)}</span></li>`; }).join("")}</ol>` : "";
  return { ref, list };
}

/* Les sujets sur lesquels portent ses propositions publiées : même règle pour tous, calculée à partir des données */
function themeLine(ps) {
  const R = DATA.rubriques, key = R ? rubOf : p => p.th, NAME = R ? Object.fromEntries(R) : THEME_NAME, word = R ? ["la rubrique", "les rubriques"] : ["le sujet", "les sujets"];
  const q = k => `« ${NAME[k]} »`;
  if (!ps.length) return "Aucune proposition relevée pour l'instant dans l'appli.";
  if (ps.length === 1) return `La seule proposition relevée pour l'instant dans l'appli porte sur ${word[0]} ${q(key(ps[0]))}.`;
  const n = {}; ps.forEach(p => n[key(p)] = (n[key(p)] || 0) + 1);
  const top = Object.entries(n).sort((a, b) => b[1] - a[1] || NAME[a[0]].localeCompare(NAME[b[0]], "fr"));
  if (top[0][1] === 1) {
    const all = top.map(([k]) => q(k));
    return all.length <= 4 ? `Les ${ps.length} propositions relevées dans l'appli portent chacune sur ${R ? "une rubrique différente" : "un sujet différent"} : ${all.slice(0, -1).join(", ")} et ${all[all.length - 1]}.` : `Les ${ps.length} propositions relevées dans l'appli portent sur ${all.length} ${word[1].split(" ")[1]} différent${R ? "e" : ""}s.`;
  }
  const keep = top.filter(([, v]) => v >= Math.min(top[0][1], 2)).slice(0, 3);
  const list = (keep.length ? keep : top.slice(0, 2)).map(([k]) => q(k));
  const txt = list.length > 1 ? list.slice(0, -1).join(", ") + " et " + list[list.length - 1] : list[0];
  return `Les ${ps.length} propositions relevées dans l'appli portent surtout sur ${list.length > 1 ? word[1] : word[0]} ${txt}.`;
}

function rubSection(c, ps, k, l) {
  const all = ps.filter(p => rubOf(p) === k), ph = c.oeil ? (c.oeil.phares[k] || []) : [];

/* Comparer : deux candidats côte à côte, ou tous les candidats sur un sujet */
function screenComparer() {
  const seg = `<div class="seg" role="group" aria-label="Mode"><button type="button" data-mode="tous" aria-pressed="${ui.cmpMode === "tous"}">${DATA.rubriques ? "Par thème" : "Par sujet"}</button><button type="button" data-mode="deux" aria-pressed="${ui.cmpMode === "deux"}">Deux candidats</button></div>`;
  const chipsFor = list => `<div class="chips" role="group" aria-label="Sujet">${list.map(([k, l]) => `<button class="chip" type="button" data-th="${k}" aria-pressed="${ui.cmpTh === k}">${esc(l)}</button>`).join("")}</div>`;
  if (ui.cmpMode === "tous") {
    const nTh = k => new Set(DATA.propositions.filter(p => p.th === k).map(p => p.c)).size;
    if (DATA.rubriques) return `<div class="page-h"><h1>Les propositions</h1><p class="lead">Ce que propose chaque candidat, thème par thème. Pour comprendre la situation actuelle, voir l'onglet Accueil.</p></div>${seg}
    <div class="tiles">${DATA.rubriques.map(([k, l]) => { const ps = DATA.propositions.filter(p => rubOf(p) === k), n = new Set(ps.map(p => p.c)).size; return `<a class="tile" href="#p-${k}"><span class="ic">${svg("r_" + k)}</span><span class="tt"><b>${esc(l)}</b><span>${n ? `${n} candidat${n > 1 ? "s" : ""}, ${ps.length} proposition${ps.length > 1 ? "s" : ""}` : "Aucune proposition relevée"}</span></span></a>`; }).join("")}</div>`;
    return `<div class="page-h"><h1>Les propositions</h1><p class="lead">Ce que propose chaque candidat, sujet par sujet. Pour comprendre la situation actuelle, voir l'onglet Accueil.</p></div>${seg}
    <div class="tiles">${DATA.themes.map(([k, l]) => { const n = nTh(k), ok = DATA.sujets && DATA.sujets[k]; const np = DATA.propositions.filter(p => p.th === k).length; return `<a class="tile" href="#t-${k}"><span class="ic">${svg(k)}</span><span class="tt"><b>${esc(l)}</b><span>${n} candidat${n > 1 ? "s" : ""} · ${np} proposition${np > 1 ? "s" : ""}</span></span></a>`; }).join("")}</div>`;
  }
  if (!ui.cmpA || !CAND[ui.cmpA] || !ui.cmpB || !CAND[ui.cmpB] || ui.cmpA === ui.cmpB) {
    const pool = shuffle(DATA.candidats.map(c => c.id).filter(id => id !== ui.cmpA && id !== ui.cmpB));
    if (!ui.cmpA || !CAND[ui.cmpA]) ui.cmpA = pool.pop();
    if (!ui.cmpB || !CAND[ui.cmpB] || ui.cmpB === ui.cmpA) ui.cmpB = pool.find(x => x !== ui.cmpA);
  }
  const opts = sel => candSorted().map(c => `<option value="${c.id}"${c.id === sel ? " selected" : ""}>${esc(c.nom)}</option>`).join("");
  const A = ui.cmpA, B = ui.cmpB;
  const RB = DATA.rubriques, NAMES = RB ? Object.fromEntries(RB) : THEME_NAME, LIST = RB || DATA.themes, ic = k => RB ? "r_" + k : k;
  const themes = ui.cmpTh === "tous" || !NAMES[ui.cmpTh] ? LIST : LIST.filter(([k]) => k === ui.cmpTh);
  const col = (id, k) => { const ps = DATA.propositions.filter(p => p.c === id && (RB ? rubOf(p) : p.th) === k); return `<div class="cmp-col">${ps.length ? ps.map(p => `<div class="ci"><b>${esc(p.t)}</b>${finBadge(p)}${tbc(p)}${p.a ? amount(p.a) : ""}${ext(SRC[p.s[0]].u, "Source : " + esc(SRC[p.s[0]].p))}<button class="more-lnk" type="button" data-more="${p.id}">Aller plus loin</button></div>`).join("") : `<span class="none">Rien de public pour l'instant</span>`}</div>`; };
  return `
  <div class="page-h"><h1>Les propositions</h1><p class="lead">Deux candidats côte à côte, ${DATA.rubriques ? "thème par thème" : "sujet par sujet"}.</p></div>
  ${seg}
  <section class="card">
    <div class="pick">
      <select id="cmpA" aria-label="Premier candidat">${opts(A)}</select>
      <button class="swap" type="button" data-act="swap" aria-label="Inverser les deux candidats"><svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M8 4v15l-3-3M16 20V5l3 3"/></svg></button>
      <select id="cmpB" aria-label="Second candidat">${opts(B)}</select>
    </div>
  </section>
  ${chipsFor([["tous", RB ? "Tous les thèmes" : "Tous les sujets"]].concat(LIST))}
  <div class="cmp-head"><div>${mono(A, "s")}<span>${esc(nom(A))}</span></div><div>${mono(B, "s")}<span>${esc(nom(B))}</span></div></div>
  ${themes.map(([k, l]) => `<section class="card"><h2 class="th-h">${svg(ic(k))}${esc(l)}</h2><div class="cmp-grid">${col(A, k)}${col(B, k)}</div></section>`).join("")}`;
}
/* La carte qui ouvre « Le budget en une image » (sujet Budget de l'État) */

/* Page d'un thème (onglet Propositions) : les candidats et leurs propositions, avec un filtre par sujet quand le thème en regroupe plusieurs */
const rubSujetsAll = k => DATA.themes.filter(([t]) => DATA.themeRub[t] === k && DATA.sujets && DATA.sujets[t]);
const rubSujets = k => DATA.themes.filter(([t]) => DATA.themeRub[t] === k && DATA.propositions.some(p => rubOf(p) === k && p.th === t));
function screenRub(k, th) {
  const RN = Object.fromEntries(DATA.rubriques); if (!RN[k]) return screenComparer();
  ui.cmpTh = k;
  const subs = rubSujets(k); if (th) ui.rubTh = th; if (!subs.some(([t]) => t === ui.rubTh)) ui.rubTh = "tous";
  const f = ui.rubTh, ps = DATA.propositions.filter(p => rubOf(p) === k && (f === "tous" || p.th === f));
  const who = candSorted().filter(c => ps.some(p => p.c === c.id)), silent = candSorted().filter(c => !ps.some(p => p.c === c.id));
  const R = DATA.reperes, axs = (f === "tous" ? subs.map(([t]) => t) : [f]).map(t => R.axes[t]).filter(Boolean);
  const showBudget = subs.some(([t]) => t === "budget") && (f === "tous" || f === "budget");
  const comp = subs.filter(([t]) => DATA.sujets && DATA.sujets[t]);
  return `
  <div class="page-h"><span class="kick">${svg("r_" + k)} Propositions</span><h1>${esc(RN[k])}</h1><p class="lead">Ce que propose chaque candidat sur ce thème.</p></div>
  ${subs.length > 1 ? `<div class="chips" role="group" aria-label="Sujet">${[["tous", "Tout le thème"]].concat(subs).map(([t, l]) => `<button class="chip" type="button" data-rth="${t}" aria-pressed="${f === t}">${esc(l)}</button>`).join("")}</div>` : ""}
  <p class="small" style="padding-inline:4px">${who.length ? `${who.length} candidat${who.length > 1 ? "s ont" : " a"} fait au moins une proposition ${f === "tous" ? "dans ce thème" : "sur ce sujet"}.` : "Aucune proposition relevée pour l'instant."}</p>
  ${axs.map(ax => `<section class="card"><h2>${esc(ax.titre)}</h2>${axis(ax)}<p class="small">${esc(ax.note)}</p></section>`).join("")}
  ${showBudget ? `<section class="card"><h2>Les comptes publics aujourd'hui</h2><div class="figs"><div><b>${nf0.format(R.dette.v)} Md€</b><span>de dette publique ${esc(R.dette.quand)}, ${esc(R.dette.pct)}</span></div><div><b>${nf1.format(R.deficit.v)} Md€</b><span>de déficit ${esc(R.deficit.quand)}, ${esc(R.deficit.pct)}</span></div></div><p class="small">Source : ${ext(SRC[R.dette.s].u, "Insee")}. Le déficit, c'est ce que l'État et les administrations dépensent en plus de ce qu'ils encaissent sur une année.</p>${DATA.budget ? `<a class="more-btn as-link" href="#budget">Le budget en une image${ARW}</a>` : ""}</section>` : ""}
  ${who.map(c => `<section class="card"><a class="cand-h" href="#c-${c.id}">${mono(c.id, "s")}<span class="nm"><b>${esc(c.nom)}</b><small>${esc(c.parti)}</small></span></a><div class="props">${ps.filter(p => p.c === c.id).map(propItem).join("")}</div></section>`).join("")}
  ${silent.length && who.length ? `<p class="silent" style="padding-inline:4px">Aucune proposition relevée pour l'instant : ${silent.map(c => esc(c.nom)).join(", ")}.</p>` : ""}
  <button class="more-btn" type="button" data-mode="deux" data-keepth="1">Comparer deux candidats sur ce thème</button>
  ${comp.length ? `<section class="card"><h2>Comprendre le sujet</h2><p class="small">La situation aujourd'hui, avec des chiffres officiels.</p><div class="rows">${comp.map(([t, l]) => `<a class="row" href="#comprendre-${t}"><span class="ic-s">${svg(t)}</span><span class="txt"><b>${esc(l)}</b></span>${CHEV}</a>`).join("")}</div></section>` : ""}`;
}
/* Page d'un sujet (onglet Propositions) : les candidats et leurs propositions */
function screenTheme(k) {
  if (!THEME_NAME[k]) return screenComparer();
  ui.cmpTh = k;
  const S = DATA.sujets && DATA.sujets[k];
  return `
  <div class="page-h"><span class="kick">${svg(k)} Propositions</span><h1>${esc(THEME_NAME[k])}</h1><p class="lead">Ce que propose chaque candidat sur ce sujet.</p></div>
  ${themeAll(k)}
  <button class="more-btn" type="button" data-mode="deux" data-keepth="1">Comparer deux candidats sur ce sujet</button>

}

function themeAll(k) {
  const ps = DATA.propositions.filter(p => p.th === k);
  const who = candSorted().filter(c => ps.some(p => p.c === c.id));
  const silent = candSorted().filter(c => !ps.some(p => p.c === c.id));
  const ax = DATA.reperes.axes[k];
  const R = DATA.reperes;
  const budget = k === "budget" ? `<section class="card"><h2>Les comptes publics aujourd'hui</h2><div class="figs"><div><b>${nf0.format(R.dette.v)} Md€</b><span>de dette publique ${esc(R.dette.quand)}, ${esc(R.dette.pct)}</span></div><div><b>${nf1.format(R.deficit.v)} Md€</b><span>de déficit ${esc(R.deficit.quand)}, ${esc(R.deficit.pct)}</span></div></div><p class="small">Source : ${ext(SRC[R.dette.s].u, "Insee")}. Le déficit, c'est ce que l'État et les administrations dépensent en plus de ce qu'ils encaissent sur une année.</p>${DATA.budget ? `<a class="more-btn as-link" href="#budget">Le budget en une image${ARW}</a>` : ""}</section>` : "";
  return `

  </section>

  else if (h === "methode") { html = screenMethode(); title = "Méthode"; back = "#actu"; }
  else if (h === "sources") { html = screenSources(); title = "Sources"; back = "#methode"; }
  else if (h.startsWith("kit-")) { html = screenKit(h.slice(4)); title = "Avant de voter"; back = "#actu"; }
  else if (h === "budget") { html = screenBudget(); title = "Le budget"; back = "#comprendre-budget"; }
  else if (h.startsWith("comprendre-r-") && DATA.rubriques) { const k = h.slice(13); html = screenComprendreRub(k); title = (Object.fromEntries(DATA.rubriques))[k] || "Comprendre"; back = "#actu"; }
  else if (h.startsWith("comprendre-")) { const k = h.slice(11), r = DATA.rubriques && DATA.themeRub[k]; html = screenComprendre(k); title = THEME_NAME[k] || "Comprendre"; back = r && rubSujetsAll(r).length > 1 ? "#comprendre-r-" + r : "#actu"; }
  else if (TAB_TITLE[h]) { tab = h; html = { candidats: screenCandidats, videos: screenVideos, comparer: screenComparer, sondages: screenSondages }[h](); title = TAB_TITLE[h]; }
  else { html = screenAccueil(); title = null; }
  app.classList.toggle("full", full);
  app.innerHTML = html;
  $("#ttl").innerHTML = title ? esc(title) : '<span class="wm">Programmes <em>2027</em></span>';
  const b = $("#back"); b.hidden = !back; b.dataset.to = back || "";
  document.querySelectorAll(".nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === tab ? "page" : "false"));
}
/* Page candidat : une fois le sommaire passé, une barre de thèmes reste en haut et suit la lecture */
let rbTick = false;
function rubBarSync() {
  rbTick = false;
  const bar = document.getElementById("rubbar"), nav = document.getElementById("rubnav"); if (!bar || !nav) return;
  const top = document.querySelector(".top").getBoundingClientRect().bottom;
  bar.style.top = top + "px";
  const secs = [...document.querySelectorAll(".rub-sec")], last = secs[secs.length - 1];
  const on = nav.getBoundingClientRect().bottom < top && last && last.getBoundingClientRect().bottom > top + 60;
  bar.classList.toggle("on", on); bar.setAttribute("aria-hidden", on ? "false" : "true");
  bar.querySelectorAll("button").forEach(b => b.tabIndex = on ? 0 : -1);
  let cur = null; secs.forEach(sct => { if (sct.getBoundingClientRect().top <= top + bar.offsetHeight + 24) cur = sct.id; });
  bar.querySelectorAll("button").forEach(b => {
    const act = b.dataset.rb === cur; if ((b.getAttribute("aria-current") === "true") === act) return;
    b.setAttribute("aria-current", act ? "true" : "false");
    if (act) bar.scrollTo({ left: b.offsetLeft - 16, behavior: "smooth" });
  });
}
window.addEventListener("scroll", () => { if (!rbTick) { rbTick = true; requestAnimationFrame(rubBarSync); } }, { passive: true });
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }
window.addEventListener("hashchange", () => { closeMore(true); closeStory(true); closeChat(true); route(); askSync(); window.scrollTo(0, 0); });
window.addEventListener("scroll", () => $("#bar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });
$("#back").addEventListener("click", e => { location.hash = e.currentTarget.dataset.to || "#actu"; });
function setTheme(dark, save) {
  const r = document.documentElement;
  if (dark) r.setAttribute("data-theme", "dark"); else r.removeAttribute("data-theme");
  const b = $("#mode");
  b.setAttribute("aria-pressed", dark ? "true" : "false");
  b.setAttribute("aria-label", dark ? "Revenir au mode clair" : "Activer le mode sombre");
  $('meta[name="theme-color"]').setAttribute("content", dark ? "#090D1F" : "#FFFFFF");
  if (save) { try { localStorage.setItem("p27-theme", dark ? "dark" : "light"); } catch (e) {} }
}
setTheme(document.documentElement.getAttribute("data-theme") === "dark", false);
$("#mode").addEventListener("click", () => setTheme(document.documentElement.getAttribute("data-theme") !== "dark", true));
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.actu) { ui.actuC = t.dataset.actu; rerender(); }
  else if (t.dataset.cmpwith) { ui.cmpMode = "deux"; ui.cmpA = t.dataset.cmpwith; if (ui.cmpB === ui.cmpA) ui.cmpB = null; location.hash = "#comparer"; }
  else if (t.dataset.act === "swap") { [ui.cmpA, ui.cmpB] = [ui.cmpB, ui.cmpA]; rerender(); }
  else if (t.dataset.act === "refeed") { ui.feed = buildFeed(); route(); const f = $("#feed"); if (f) f.scrollTo(0, 0); }
  else if (t.dataset.mode) { ui.cmpMode = t.dataset.mode; if (!t.dataset.keepth && ui.cmpMode === "deux") ui.cmpTh = "tous"; if (location.hash !== "#comparer") location.hash = "#comparer"; else rerender(); }
  else if (t.dataset.th) { ui.cmpTh = t.dataset.th; rerender(); }
  else if (t.dataset.rth) { ui.rubTh = t.dataset.rth; rerender(); }
  else if (t.dataset.jump) { const el = document.getElementById(t.dataset.jump); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
  else if (t.dataset.srcg) { ui.srcG = t.dataset.srcg; rerender(); }
  else if (t.dataset.feedth) { ui.feedTh = t.dataset.feedth; ui.feed = buildFeed(); route(); const f = $("#feed"); if (f) f.scrollTo(0, 0); const c = document.querySelector(`[data-feedth="${ui.feedTh}"]`); if (c) c.scrollIntoView({ inline: "center", block: "nearest" }); }
  else if (t.dataset.yt) { const m = t.closest(".reel-media"); if (m) m.innerHTML = ytEmbed(t.dataset.yt, t.dataset.title || "Vidéo"); }
});
app.addEventListener("input", e => {
  if (e.target.id === "qs") {
    const q = e.target.value.trim().toLowerCase(); let shown = 0;
    document.querySelectorAll(".src-g").forEach(g => {
      if (q) g.hidden = false; else g.hidden = !(ui.srcG === "tous" || g.dataset.g === ui.srcG);
      let n = 0; g.querySelectorAll(".row").forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) n++; });
      if (q && !n) g.hidden = true; if (!g.hidden) shown += n;
    });
    const none = document.getElementById("snone"); if (none) none.hidden = shown > 0;
    return;
  }
  if (e.target.id !== "qc") return;
  const q = e.target.value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll("#clist .row").forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) shown++; });
  const none = document.getElementById("cnone"); if (none) none.hidden = shown > 0;
});
app.addEventListener("change", e => {
  if (e.target.id === "cmpA") { ui.cmpA = e.target.value; if (ui.cmpA === ui.cmpB) ui.cmpB = null; rerender(); }
  if (e.target.id === "cmpB") { ui.cmpB = e.target.value; if (ui.cmpB === ui.cmpA) ui.cmpA = null; rerender(); }
});

function boot() {
  prep();
  $("#jx").textContent = "J−" + daysTo("2027-04-18");
  route();
  askSync();
  fetch("data.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(d => {
    if (d && d.maj && d.propositions && (d.maj > DATA.maj || d.version > DATA.version)) { DATA = d; prep(); ui.feed = null; rerender(); }
  }).catch(() => {});
}
boot();
</script>
