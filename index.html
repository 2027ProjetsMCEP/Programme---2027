<script>
/* Thème : clair par défaut ; le mode sombre choisi avec le bouton lune est mémorisé sur l'appareil (rien n'est envoyé). Appliqué avant l'affichage pour éviter un flash. */
(function () {
  var dark = false;
  try { dark = localStorage.getItem("p27-theme") === "dark"; } catch (e) {}
  if (dark) document.documentElement.setAttribute("data-theme", "dark");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#090D1F" : "#FFFFFF");
  document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", dark ? "black-translucent" : "default");
})();
</script>

<title>Programmes 2027</title>

<style>
/* Polices hébergées avec l'appli : aucune requête vers un service extérieur */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/instrument-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/instrument-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/instrument-sans-latin-700-normal.woff2) format("woff2")}

/* Appli mobile. Thème clair par défaut (fond blanc, texte bleu nuit), mode sombre au choix (bouton lune en haut à droite, mémorisé sur l'appareil). Une colonne de 560px au plus, barre du haut translucide, barre d'onglets fixe en bas, fil vidéo plein écran (toujours sombre). Le bleu sert aux actions, le rouge au compte à rebours et aux nouveautés ; aucun candidat n'a de couleur propre. */
:root {
  --bg: #FFFFFF;
  --card: #FFFFFF;
  --ink: #0D1B52;
  --ink-2: #3B4878;
  --ink-3: #5E6A90;
  --line: #E2E6F0;
  --chip: #EEF1F8;
  --bleu: #1F3FD1;
  --bleu-2: #5B73E3;
  --bleu-soft: #E8ECFD;
  --rouge: #D0213B;
  --rouge-soft: #FDE9EC;
  --ok: #11764A; --ok-soft: #E2F4EA;
  --warn: #8C5A00; --warn-soft: #FFF2D6;
  --mute: #5E6A90; --mute-soft: #EEF1F8;
  --save: #0B7671; --save-soft: #DDF3F1;
  --flag-b: #1F3FD1; --flag-w: #DDE2EE; --flag-r: #D0213B;
  --reel-a: #2A45C4;
  --reel-b: #0B1238;
  --on-reel: #FFFFFF;
  --on-reel-2: #C9D3F7;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  --bar-h: 54px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #090D1F;
  --card: #121834;
  --ink: #F2F4FA;
  --ink-2: #B4BCD6;
  --ink-3: #8089A8;
  --line: #222B50;
  --chip: #1B2346;
  --bleu: #7D98FF;
  --bleu-2: #3F55B5;
  --bleu-soft: #1A2552;
  --rouge: #FF5C70;
  --rouge-soft: #3A1424;
  --ok: #5FD39A; --ok-soft: #0F2E21;
  --warn: #F2C063; --warn-soft: #33270E;
  --mute: #AAB3CC; --mute-soft: #1E2645;
  --save: #4CD0C9; --save-soft: #0E2C30;
  --flag-b: #2F55E4; --flag-w: #F2F4FA; --flag-r: #FF5C70;
  --reel-a: #2A45C4;
  --reel-b: #0B1238;
  --on-reel: #FFFFFF;
  --on-reel-2: #C9D3F7;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
  --bar-h: 54px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.flag { display: flex; height: 3px; }
.flag i { flex: 1; }
.flag i:nth-child(1) { background: var(--flag-b); } .flag i:nth-child(2) { background: var(--flag-w); } .flag i:nth-child(3) { background: var(--flag-r); }

/* Barre du haut */
/* Le bloc du haut (bande tricolore + barre) reste collé en haut ; son fond opaque couvre aussi la zone de l'heure sur iPhone */
.top { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
.bar { position: relative; height: var(--bar-h); display: flex; align-items: center; gap: 8px; padding-inline: 12px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.5) blur(12px); -webkit-backdrop-filter: saturate(1.5) blur(12px); border-bottom: 1px solid transparent; }
.bar.scrolled { border-bottom-color: var(--line); }
.bar .back { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none; }
.bar .back:hover { background: var(--chip); }
.bar .back svg { width: 22px; height: 22px; }
.bar .mode { width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; flex: none; margin-right: -6px; }
.bar .mode:hover { background: var(--chip); color: var(--ink); }
.bar .mode svg { width: 20px; height: 20px; }
.bar .mode .sun, :root[data-theme="dark"] .bar .mode .moon { display: none; }
:root[data-theme="dark"] .bar .mode .sun { display: block; }
.bar .ttl { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.bar .ttl .wm em { font-style: normal; color: var(--rouge); }
.jx { flex: none; font-weight: 700; font-size: 0.8rem; color: var(--rouge); background: var(--rouge-soft); padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }

main { padding: 6px 16px calc(var(--nav-h) + 84px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }

/* Barre d'onglets */
.nav { position: fixed; z-index: 30; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 560px); display: grid; grid-template-columns: repeat(5, 1fr); background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: saturate(1.5) blur(14px); -webkit-backdrop-filter: saturate(1.5) blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav a { height: var(--nav-h); display: grid; place-items: center; align-content: center; gap: 3px; text-decoration: none; color: var(--ink-3); font-size: 0.7rem; font-weight: 600; }
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--bleu); }
.nav a[aria-current="page"] svg { stroke-width: 2.2; }

/* Cartes */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > h2 { font-size: 1.12rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card > h2 a, .link { font-family: var(--f-body); font-size: 0.86rem; font-weight: 600; color: var(--bleu); text-decoration: none; }
.lead { font-size: 0.95rem; color: var(--ink-2); }
.small { font-size: 0.82rem; color: var(--ink-3); }
.small a { color: var(--ink-2); }
.page-h { display: grid; gap: 6px; padding: 10px 2px 4px; }
.page-h h1 { font-size: 1.85rem; letter-spacing: -0.02em; }

/* Accueil */
.hero { padding: 14px 2px 8px; display: grid; gap: 4px; }
.hero .kick { font-size: 0.82rem; font-weight: 700; color: var(--ink-2); }
.hero .cd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hero .cd b { font-family: var(--f-display); font-weight: 800; font-size: 4rem; line-height: 0.95; letter-spacing: -0.04em; color: var(--ink); font-variant-numeric: tabular-nums; }
.hero .cd span { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; line-height: 1.15; max-width: 12ch; }
.hero .date { font-size: 0.86rem; color: var(--ink-3); }

.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding-block: 11px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; min-width: 0; }
.rows > .row:first-child { border-top: 0; padding-top: 2px; }
.row .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row .txt b { font-weight: 600; line-height: 1.32; }
.row .txt span { font-size: 0.82rem; color: var(--ink-3); }
.chev { width: 18px; height: 18px; flex: none; color: var(--ink-3); }
a.row:hover .txt b { color: var(--bleu); }
.news .txt b { font-weight: 600; }
.news .src { font-weight: 700; color: var(--rouge); }
.more-btn { border: 0; background: var(--chip); color: var(--ink); font-weight: 600; font-size: 0.9rem; border-radius: 12px; padding: 11px; cursor: pointer; }
.more-btn:hover { background: var(--bleu-soft); color: var(--bleu); }

.agenda { display: grid; gap: 10px; }
.agenda .it { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.leaf { border-radius: 10px; overflow: hidden; text-align: center; background: var(--chip); line-height: 1.05; }
.leaf small { display: block; background: var(--rouge); color: #FFFFFF; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 0; }
.leaf b { display: block; font-family: var(--f-display); font-size: 1.3rem; padding: 3px 0 5px; }

/* Monogrammes : même pastille pour tous */
.mono { --s: 40px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--chip); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: calc(var(--s) * .38); }
.mono.s { --s: 30px; }
.mono.l { --s: 64px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-publie { color: var(--ok); background: var(--ok-soft); }
.st-partiel { color: var(--warn); background: var(--warn-soft); }
.st-nonpublie { color: var(--mute); background: var(--mute-soft); }
.st-primaire { color: var(--mute); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.newb { display: inline-block; vertical-align: 2px; font-family: var(--f-body); font-size: 0.7rem; font-weight: 700; color: var(--rouge); background: color-mix(in srgb, var(--rouge) 10%, transparent); padding: 1px 7px; border-radius: 999px; margin-right: 6px; }

/* Propositions */
.props { display: grid; }
.prop { display: grid; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
.props > .prop:first-child { border-top: 0; padding-top: 0; }
.prop .pt { font-weight: 600; font-size: 1rem; line-height: 1.35; }
.amt { justify-self: start; display: inline-flex; flex-wrap: wrap; gap: 2px 6px; font-size: 0.8rem; font-weight: 600; padding: 4px 9px; border-radius: 8px; }
.amt.cout { color: var(--bleu); background: var(--bleu-soft); }
.amt.economie, .amt.dette, .amt.recette { color: var(--save); background: var(--save-soft); }
.amt.neutre { color: var(--ink-2); background: var(--mute-soft); }
.amt span { font-weight: 500; opacity: .85; }
.prop details { font-size: 0.9rem; color: var(--ink-2); }
.prop summary { cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--bleu); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
.prop summary::-webkit-details-marker { display: none; }
.prop summary::after { content: "+"; font-weight: 700; }
.prop details[open] summary::after { content: "−"; }
.prop details p { margin-top: 6px; }
.prop .src { font-size: 0.8rem; color: var(--ink-3); }
.prop .src a { color: var(--ink-2); font-weight: 600; }

.cand-h { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.cand-h .nm { display: grid; }
.cand-h .nm b { font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; }
.cand-h .nm small { font-size: 0.8rem; color: var(--ink-3); }
a.cand-h:hover b { color: var(--bleu); }

/* Fiche candidat */
.profile { display: grid; gap: 12px; justify-items: start; }
.profile .who { display: flex; gap: 14px; align-items: center; }
.profile h1 { font-size: 1.7rem; }
.profile .party { color: var(--ink-2); font-size: 0.92rem; }
.stats { display: flex; gap: 10px; width: 100%; }
.stats div { flex: 1; background: var(--chip); border-radius: 12px; padding: 10px 12px; display: grid; align-content: start; }
.stats b { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; }
.stats span { font-size: 0.78rem; color: var(--ink-2); }
.stats b small { font-size: 0.9rem; font-weight: 600; color: var(--ink-3); margin-left: 1px; }
.card > h2.th-h { display: flex; align-items: center; justify-content: flex-start; gap: 10px; font-size: 1rem; }
.th-h svg { width: 22px; height: 22px; color: var(--bleu); flex: none; }
.oeil { display: grid; gap: 12px; }
.oeil p { font-size: 0.94rem; color: var(--ink-2); }
.oeil .s { font-size: 0.76rem; color: var(--ink-3); }
.oeil .s a { color: var(--ink-2); }
.oe-top { display: grid; gap: 8px; }
.rubnav { gap: 10px; }
.rubnav h2 { font-size: 1.05rem; }
.rn-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 74px; gap: 8px; }
.rn { display: grid; grid-template-columns: 20px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; align-items: start; column-gap: 8px; row-gap: 2px; height: 100%; box-sizing: border-box; padding: 10px 10px 9px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; font-size: 0.86rem; font-weight: 600; line-height: 1.2; text-align: left; cursor: pointer; }
.rn svg { width: 20px; height: 20px; color: var(--bleu); grid-row: 1; margin-top: 0; }
.rn .t { min-width: 0; overflow-wrap: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rn small { grid-column: 2; min-width: 0; font-size: 0.74rem; font-weight: 500; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rn:hover { border-color: var(--bleu-2); background: var(--bleu-soft); }
.rn:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
.rn.off { cursor: default; color: var(--ink-3); background: transparent; border-style: dashed; font-weight: 500; }
.rn.off svg { color: var(--ink-3); }
.rn.off:hover { background: transparent; border-color: var(--line); }
@media (min-width: 520px) { .rn-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 359px) { .rn { grid-template-columns: minmax(0, 1fr); padding-inline: 10px; font-size: 0.8rem; } .rn svg { display: none; } .rn small { grid-column: 1; } }
.rubbar { position: fixed; z-index: 19; left: 50%; transform: translate(-50%, -8px); width: min(100%, 560px); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: saturate(1.5) blur(12px); -webkit-backdrop-filter: saturate(1.5) blur(12px); border-bottom: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; }
.rubbar::-webkit-scrollbar { display: none; }
main > .rubbar { animation: none; }
.rubbar.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.rubbar button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); font: inherit; font-size: 0.8rem; font-weight: 600; border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.rubbar button[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
@media (prefers-reduced-motion: reduce) { .rubbar { transition: none; } }
.card > h2.th-h .cnt { margin-left: auto; }
.more-props { border-top: 1px solid var(--line); padding-top: 10px; }
.more-props summary { cursor: pointer; font-size: 0.86rem; font-weight: 600; color: var(--bleu); }
.more-props .props { margin-top: 8px; }
.oe-h { font-family: var(--f-body); font-size: 0.86rem; font-weight: 700; color: var(--ink); }
.silent { font-size: 0.86rem; color: var(--ink-3); }
.docs .row .txt b { font-size: 0.95rem; }

/* Thèmes */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 10px; text-decoration: none; color: inherit; min-height: 118px; align-content: start; }
.tile:hover { border-color: var(--bleu-2); }
.tile .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bleu-soft); color: var(--bleu); }
.tile .ic svg { width: 22px; height: 22px; }
.tile b { font-family: var(--f-display); font-size: 1.05rem; font-weight: 700; line-height: 1.2; display: block; }
.tile span { font-size: 0.78rem; color: var(--ink-3); }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.figs div { background: var(--chip); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.figs b { font-family: var(--f-display); font-size: 1.3rem; line-height: 1.1; }
.figs span { font-size: 0.78rem; color: var(--ink-2); }

/* Axe chiffré */
.axis { display: grid; gap: 2px; }
.axis-row { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); align-items: center; gap: 10px; min-height: 42px; }
.axis-row .who { font-weight: 600; font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.axis-track { position: relative; height: 42px; }
.axis-track::before { content: ""; position: absolute; left: 0; right: 0; top: 40%; border-top: 1px dashed var(--line); }
.axis-track .rng { position: absolute; top: calc(40% - 2px); height: 4px; background: var(--bleu-2); border-radius: 2px; }
.axis-track .pt { position: absolute; top: 40%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--bleu); box-shadow: 0 0 0 3px var(--card); }
.axis-track .pt.alt { background: var(--card); border: 2px solid var(--bleu); }
.axis-track .lb { position: absolute; top: 40%; font-size: 0.7rem; color: var(--ink-3); white-space: nowrap; }
.axis-scale { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 10px; }
.axis-scale .ticks { position: relative; height: 20px; border-top: 1px solid var(--ink-3); }
.axis-scale .ticks span { position: absolute; top: 3px; transform: translateX(-50%); font-size: 0.74rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Comparer */

145"],"gouvernance":["p143","p045"],"education":["p046"],"environnement":["p176","p047","p177"],"numerique":["p196","p197"]},"fin":{"cand":[["Il vise un déficit à 2 % du PIB en fin de quinquennat. Montants trouvés : 30 milliards d'euros par an attendus de sa réforme des retraites, 50 milliards de baisse d'impôts de production compensée par moins d'aides, 2 milliards par an pour l'adaptation au climat.","sudradio_philippe_hdv","ps_retraites","lcp_philippe","lid_philippe_climat"]],"ind":[["Nous n'avons pas trouvé de chiffrage extérieur de l'ensemble de ses propositions.",null]]}}},{"id":"retailleau","nom":"Bruno Retailleau","tri":"Retailleau","parti":"Les Républicains","statut":"partiel","statutTxt":"Mesures annoncées par thème","faits":[["Désigné candidat des Républicains le 19 avril 2026 par un vote des adhérents.","wiki_2027"]],"docs":[],"photo":{"a":"Anthonymontardyfr","y":"2025","l":"CC BY 4.0","lu":"https://creativecommons.org/licenses/by/4.0","u":"https://commons.wikimedia.org/wiki/File:Bruno_Retailleau_-_Ministre_de_l%27Int%C3%A9rieur_fran%C3%A7ais_(cropped).jpg"},"parcours":{"chapo":["Ancien ministre d'État, ministre de l'Intérieur (2024-2025), Bruno Retailleau est sénateur de la Vendée et président des Républicains. Il a présidé le groupe UMP puis LR au Sénat de 2014 à 2024.",["bio_retailleau_infogouv","bio_retailleau_senat","bio_retailleau_lr","bio_retailleau_psenat0401","bio_retailleau_psenat1112"]],"paras":[["Origines et formation",[["Bruno Retailleau est né le 20 novembre 1960 à Cholet (Maine-et-Loire).","bio_retailleau_infogouv"],["Il est diplômé de l'Institut d'études politiques de Paris et titulaire d'une maîtrise de sciences économiques.","bio_retailleau_infogouv"]]],["Parcours",[["Député de la Vendée de 1994 à 1997 puis sénateur dès 2004, il a présidé le conseil général de la Vendée (2010-2015) puis la région Pays de la Loire (2016-2017).","bio_retailleau_infogouv"],["Le 21 septembre 2024, il est devenu ministre de l'Intérieur dans le gouvernement d
